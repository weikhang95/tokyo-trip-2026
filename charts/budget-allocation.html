<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lieflat Charts — 旅费 100% 构成分解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #6B6255;
    --faint: #B8B0A2;
    --grid: #E5DFC5;
    --ai: #1C3553;
    --shu: #C2412D;
    --kin: #855E16;
    --matcha: #506628;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    padding: 36px 20px 60px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 900px; }

  .chart-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .chart-nav a {
    color: var(--ai);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 99px;
    background: rgba(28, 53, 83, 0.06);
    transition: all .18s ease;
  }
  .chart-nav a:hover {
    background: var(--ai);
    color: #fff;
  }
  .nav-sep { color: var(--faint); }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 24px;
    padding: 36px 36px 28px;
    box-shadow: 0 4px 20px rgba(35, 31, 27, 0.05);
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 14px;
    border: 1px solid #D9D2C5;
    background: #FAF9F6;
    color: var(--muted);
  }
  h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.35;
  }
  .sub {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .sub strong { color: var(--ai); font-weight: 700; }
  svg {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    overflow: visible;
  }
  svg text { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
  .src {
    font-size: 11px;
    color: var(--muted);
    margin-top: 24px;
    letter-spacing: .06em;
    font-weight: 600;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--grid);
  }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,.7,.3,1.3) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: none; } }
  .fade { animation: fade .8s ease both; }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .fade { animation: none !important; }
  }
  @media (max-width: 640px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 24px 16px 20px; border-radius: 18px; }
    h2 { font-size: 18px; }
    .sub { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="chart-nav">
    <a href="index.html">← 决策图表集总览</a>
    <span class="nav-sep">·</span>
    <a href="../index.html">返回旅行手册主页 →</a>
  </nav>

  <div class="card">
    <span class="badge">L14 HUNDRED FIELD · 旅费全貌百人点阵</span>
    <h2>六成大头出发前已锁定：2 人 RM 14,350 真实支出结构</h2>
    <div class="sub">1 个点 = 1% 旅费 (约 RM 143.5) · <strong>62 点深色为已锁死刚性开销 (机票+住宿)</strong> · 38 点浅色为在地自由支配</div>
    <svg id="hundredfield" viewBox="0 0 820 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="旅费100%构成百人点阵图"></svg>
    <div class="src">
      <span>L14 Hundred Field · Tokyo Trip Budget</span>
      <span>点击图表重新播放动画 · Click chart to replay</span>
    </div>
  </div>
</div>

<script>
// ── Tokens & Helpers ──
const INK = '#231F1B', MUTED = '#6B6255', GRID = '#E5DFC5', FAINT = '#B8B0A2';
const AI = '#1C3553', SHU = '#C2412D', KIN = '#855E16', MATCHA = '#506628', PAPER = '#FAF9F6';
const NS = 'http://www.w3.org/2000/svg';
const el = (p, t, a) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  p.appendChild(n);
  return n;
};
const txt = (p, a, s) => {
  const n = el(p, 'text', a);
  n.textContent = s;
  return n;
};
const tip = (n, s) => {
  const t = document.createElementNS(NS, 'title');
  t.textContent = s;
  n.appendChild(t);
};
const rnd = (i, k) => Math.abs(((i * 73856093) ^ (k * 19349663)) % 1000) / 1000;
const D2R = Math.PI / 180;
const pol = (cx, cy, r, deg) => [cx + r * Math.cos(deg * D2R), cy + r * Math.sin(deg * D2R)];

const obsReveal = (id, fn) => {
  const n = document.getElementById(id);
  const go = () => { n.innerHTML = ''; fn(n); };
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { go(); io.disconnect(); }
  }, { threshold: .2 });
  io.observe(n);
  n.style.cursor = 'pointer';
  n.addEventListener('click', go);
};

// ── 预算六大构成（精准求和为 100 点）──
// [Name, Pts, AmountStr, Tone, Type]
const SEG = [
  ['国际机票', 36, 'RM 5,208', AI, 'fixed'],
  ['东京住宿', 26, 'RM 3,734', '#2D2823', 'fixed'],
  ['在地餐饮', 23, '约 RM 3,300', KIN, 'flex'],
  ['河口湖自驾', 6, '约 RM 810', MATCHA, 'flex'],
  ['市内交通', 6, '约 RM 900', '#5E6D82', 'flex'],
  ['门票杂项', 3, '约 RM 400', SHU, 'flex']
];

// 六个簇的核心坐标，错落分布在 820x440 的画布中
const POS = [
  [160, 130],  // 机票 (36)
  [410, 120],  // 东京住宿 (26)
  [660, 140],  // 在地餐饮 (23)
  [160, 315],  // 河口湖 (6)
  [410, 310],  // 市内交通 (6)
  [660, 315]   // 门票杂项 (3)
];

obsReveal('hundredfield', s => {
  // 星座连接线（弱化背景关联）
  const links = [[0, 1], [1, 2], [0, 3], [1, 4], [2, 5], [3, 4], [4, 5]];
  links.forEach(([a, b], k) => {
    el(s, 'line', {
      x1: POS[a][0], y1: POS[a][1], x2: POS[b][0], y2: POS[b][1],
      stroke: GRID, 'stroke-width': 1, 'stroke-dasharray': '3 4',
      class: 'fade', style: `animation-delay: ${0.4 + k * 0.04}s`
    });
  });

  SEG.forEach(([name, count, amt, shade, kind], ci) => {
    const [cx, cy] = POS[ci];
    let maxEdge = 0;
    const isFixed = (kind === 'fixed');

    for (let k = 0; k < count; k++) {
      // 黄金角叶序排布
      const a = k * 137.508 + ci * 60;
      const rr = 7 + Math.sqrt(k) * 7.5 + rnd(k + 1, ci + 2) * 2.8;
      maxEdge = Math.max(maxEdge, rr);
      const [px, py] = pol(cx, cy, rr, a);

      // 每 5 个点画一根弱引线连接核心
      if (k % 5 === 0) {
        el(s, 'line', {
          x1: cx, y1: cy, x2: px, y2: py,
          stroke: GRID, 'stroke-width': 0.8,
          class: 'fade', style: `animation-delay: ${ci * 0.08 + k * 0.008}s`
        });
      }

      const dot = el(s, 'circle', {
        cx: px, cy: py,
        r: isFixed ? 3.6 : 3.0,
        fill: shade,
        opacity: isFixed ? 0.95 : 0.82,
        stroke: '#FFFFFF', 'stroke-width': 0.8,
        class: 'pop', style: `animation-delay: ${ci * 0.08 + k * 0.01}s`
      });

      tip(dot, `${name}：${amt} · 占总预算 ${count}% (1点 = RM 143.5)`);
    }

    // 核心锚点
    el(s, 'circle', {
      cx, cy, r: 4.2, fill: shade,
      class: 'pop', style: `animation-delay: ${ci * 0.08}s`
    });

    // 簇标签 (名称 + 占比)
    txt(s, {
      x: cx, y: cy + maxEdge + 18,
      'font-size': 13.5, 'font-weight': 800, fill: INK, 'text-anchor': 'middle',
      'letter-spacing': '.04em', class: 'fade', style: `animation-delay: ${0.35 + ci * 0.06}s`
    }, `${name} (${count}%)`);

    // 簇副标签 (金额)
    txt(s, {
      x: cx, y: cy + maxEdge + 35,
      'font-size': 11.5, 'font-weight': 600, fill: shade, 'text-anchor': 'middle',
      class: 'fade', style: `animation-delay: ${0.4 + ci * 0.06}s`
    }, amt);
  });

  // 底部指导结论
  txt(s, {
    x: 410, y: 420,
    'font-size': 11, 'font-weight': 600, fill: MUTED, 'text-anchor': 'middle',
    'letter-spacing': '.06em', class: 'fade', style: 'animation-delay: .75s'
  }, '机票与住宿占 62% (RM 8,942) 已提前付清 · 每日餐饮与交通灵活可控 · 零隐形被动消费');
});
</script>
</body>
</html>
