<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lieflat Charts — 旅费 100% 构成分解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #8A8073;
    --faint: #C4BEB3;
    --grid: #E8E2D6;
    --ai: #1C3553;
    --shu: #C2412D;
    --kin: #855E16;
    --matcha: #506628;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 600px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 24px;
    padding: 28px 24px 20px;
    box-shadow: 0 2px 12px rgba(35, 31, 27, 0.04);
  }
  .badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 12px;
    border: 1px dashed #C4BEB3;
    color: var(--muted);
  }
  h2 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .sub {
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .sub strong { color: var(--ai); font-weight: 700; }
  svg {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    overflow: visible;
  }
  svg text { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
  .src {
    font-size: 9px;
    color: var(--faint);
    margin-top: 14px;
    letter-spacing: .08em;
    font-weight: 600;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,.7,.3,1.3) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: none; } }
  .fade { animation: fade .8s ease both; }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .fade { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="badge">L14 HUNDRED FIELD · 预算单位分解</span>
    <h2>六成二支出已在行前锁定，在地每日浮动预算仅占 38%</h2>
    <div class="sub">1 个点 = 1% 旅费 (约 RM 143.5) · <strong>62 点深色为已锁定刚性开销</strong> · 38 点浅色为在地生活 · 2人共 RM 14,350</div>
    <svg id="hundredfield" viewBox="0 0 540 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="旅费100%构成百人点阵图"></svg>
    <div class="src">
      <span>L14 Hundred Field · Tokyo Trip Budget</span>
      <span>Click chart to replay</span>
    </div>
  </div>
</div>

<script>
// ── Tokens & Helpers ──
const INK = '#231F1B', MUTED = '#8A8073', GRID = '#E8E2D6', FAINT = '#C4BEB3';
const AI = '#1C3553', SHU = '#C2412D', KIN = '#855E16', MATCHA = '#506628', PAPER = '#FAF9F6';
const NS = 'http://www.w3.org/2000/svg';
const el = (p, t, a) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  p.appendChild(n);
  return n;
};
const txt = (p, a, s) => {
  const n = el(p, 'text', a);
  n.textContent = s;
  return n;
};
const tip = (n, s) => {
  const t = document.createElementNS(NS, 'title');
  t.textContent = s;
  n.appendChild(t);
};
const rnd = (i, k) => Math.abs(((i * 73856093) ^ (k * 19349663)) % 1000) / 1000;
const D2R = Math.PI / 180;
const pol = (cx, cy, r, deg) => [cx + r * Math.cos(deg * D2R), cy + r * Math.sin(deg * D2R)];

const obsReveal = (id, fn) => {
  const n = document.getElementById(id);
  const go = () => { n.innerHTML = ''; fn(n); };
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { go(); io.disconnect(); }
  }, { threshold: .2 });
  io.observe(n);
  n.style.cursor = 'pointer';
  n.addEventListener('click', go);
};

// ── 预算六大构成（精准求和为 100 点）──
// [Name, Pts, AmountStr, Tone, Type]
const SEG = [
  ['国际机票', 36, 'RM 5,208', AI, 'fixed'],
  ['东京住宿', 26, 'RM 3,734', '#2D2823', 'fixed'],
  ['在地餐饮', 23, '约 RM 3,300', KIN, 'flex'],
  ['河口湖自驾', 6, '约 RM 810', MATCHA, 'flex'],
  ['市内交通', 6, '约 RM 900', '#5E6D82', 'flex'],
  ['门票杂项', 3, '约 RM 400', SHU, 'flex']
];

// 六个簇的核心坐标，错落分布在 540x340 的画布中
const POS = [
  [120, 110],  // 机票 (36)
  [305, 100],  // 东京住宿 (26)
  [455, 125],  // 在地餐饮 (23)
  [100, 245],  // 河口湖 (6)
  [255, 240],  // 市内交通 (6)
  [410, 245]   // 门票杂项 (3)
];

obsReveal('hundredfield', s => {
  // 星座连接线（弱化背景关联）
  const links = [[0, 1], [1, 2], [0, 3], [1, 4], [2, 5], [3, 4], [4, 5]];
  links.forEach(([a, b], k) => {
    el(s, 'line', {
      x1: POS[a][0], y1: POS[a][1], x2: POS[b][0], y2: POS[b][1],
      stroke: GRID, 'stroke-width': 0.8, 'stroke-dasharray': '2 4',
      class: 'fade', style: `animation-delay: ${0.5 + k * 0.05}s`
    });
  });

  SEG.forEach(([name, count, amt, shade, kind], ci) => {
    const [cx, cy] = POS[ci];
    let maxEdge = 0;
    const isFixed = (kind === 'fixed');

    for (let k = 0; k < count; k++) {
      // 黄金角叶序排布
      const a = k * 137.508 + ci * 60;
      const rr = 5 + Math.sqrt(k) * 5.8 + rnd(k + 1, ci + 2) * 2.2;
      maxEdge = Math.max(maxEdge, rr);
      const [px, py] = pol(cx, cy, rr, a);

      // 每 5 个点画一根弱引线连接核心
      if (k % 5 === 0) {
        el(s, 'line', {
          x1: cx, y1: cy, x2: px, y2: py,
          stroke: GRID, 'stroke-width': 0.6,
          class: 'fade', style: `animation-delay: ${ci * 0.1 + k * 0.01}s`
        });
      }

      const dot = el(s, 'circle', {
        cx: px, cy: py,
        r: isFixed ? 2.6 : 2.2,
        fill: shade,
        opacity: isFixed ? 0.95 : 0.82,
        stroke: '#FFFFFF', 'stroke-width': 0.5,
        class: 'pop', style: `animation-delay: ${ci * 0.1 + k * 0.012}s`
      });

      tip(dot, `${name}：${amt} · 占总预算 ${count}% (1点 = RM 143.5)`);
    }

    // 核心锚点
    el(s, 'circle', {
      cx, cy, r: 3.2, fill: shade,
      class: 'pop', style: `animation-delay: ${ci * 0.1}s`
    });

    // 簇标签
    txt(s, {
      x: cx, y: cy + maxEdge + 14,
      'font-size': 8.5, 'font-weight': 800, fill: INK, 'text-anchor': 'middle',
      'letter-spacing': '.04em', class: 'fade', style: `animation-delay: ${0.4 + ci * 0.08}s`
    }, `${name} · ${count}%`);

    txt(s, {
      x: cx, y: cy + maxEdge + 25,
      'font-size': 7.5, 'font-weight': 500, fill: MUTED, 'text-anchor': 'middle',
      class: 'fade', style: `animation-delay: ${0.4 + ci * 0.08}s`
    }, amt);
  });

  // 底部统计说明
  txt(s, {
    x: 270, y: 326,
    'font-size': 7.5, 'font-weight': 600, fill: MUTED, 'text-anchor': 'middle',
    'letter-spacing': '.08em', class: 'fade', style: 'animation-delay: 1.1s'
  }, '100 个点 = 36 + 26 + 23 + 6 + 6 + 3 · 机酒 62% 已提前锁定，无现场预算超支压力');
});
</script>
</body>
</html>
