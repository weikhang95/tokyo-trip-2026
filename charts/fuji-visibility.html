<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lieflat Charts — 富士山全天能见度与顺光拍摄窗口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #6B6255;
    --faint: #B8B0A2;
    --grid: #E5DFC5;
    --ai: #1C3553;
    --shu: #C2412D;
    --matcha: #506628;
    --matcha-soft: rgba(80, 102, 40, 0.09);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    padding: 36px 20px 60px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 900px; }

  .chart-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .chart-nav a {
    color: var(--ai);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 99px;
    background: rgba(28, 53, 83, 0.06);
    transition: all .18s ease;
  }
  .chart-nav a:hover {
    background: var(--ai);
    color: #fff;
  }
  .nav-sep { color: var(--faint); }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 24px;
    padding: 36px 36px 28px;
    box-shadow: 0 4px 20px rgba(35, 31, 27, 0.05);
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 14px;
    border: 1px solid #D9D2C5;
    background: #FAF9F6;
    color: var(--muted);
  }
  h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.35;
  }
  .sub {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .sub strong { color: var(--matcha); font-weight: 700; }
  svg {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    overflow: visible;
  }
  svg text { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
  .src {
    font-size: 11px;
    color: var(--muted);
    margin-top: 24px;
    letter-spacing: .06em;
    font-weight: 600;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--grid);
  }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,.7,.3,1.3) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: none; } }
  .fade { animation: fade .8s ease both; }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .fade { animation: none !important; }
  }
  @media (max-width: 640px) {
    body { padding: 20px 12px 40px; }
    .card { padding: 24px 16px 20px; border-radius: 18px; }
    h2 { font-size: 18px; }
    .sub { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="chart-nav">
    <a href="index.html">← 决策图表集总览</a>
    <span class="nav-sep">·</span>
    <a href="../index.html">返回旅行手册主页 →</a>
  </nav>

  <div class="card">
    <span class="badge">F2 HAIRLINE LINE · 景观能见度决策</span>
    <h2>早起两小时等于多看两座富士山：上午 9 点后云量陡增，正午跌至 28%</h2>
    <div class="sub">折线 = 10月历史每小时晴空露脸概率(%) · <strong>浅绿底带 = 06:00–11:30 自驾顺光拍摄黄金窗</strong> · 12:00 准时还车</div>
    <svg id="fujiline" viewBox="0 0 760 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="富士山全天各时刻能见度与顺光拍摄窗口折线图"></svg>
    <div class="src">
      <span>F2 Hairline Line · Fuji Five Lakes Timing</span>
      <span>点击图表重新播放动画 · Click chart to replay</span>
    </div>
  </div>
</div>

<script>
// ── Tokens & Helpers ──
const INK = '#231F1B', MUTED = '#6B6255', GRID = '#E5DFC5', FAINT = '#B8B0A2';
const SHU = '#C2412D', MATCHA = '#506628', MATCHA_SOFT = 'rgba(80, 102, 40, 0.09)';
const NS = 'http://www.w3.org/2000/svg';
const el = (p, t, a) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  p.appendChild(n);
  return n;
};
const txt = (p, a, s) => {
  const n = el(p, 'text', a);
  n.textContent = s;
  return n;
};
const tip = (n, s) => {
  const t = document.createElementNS(NS, 'title');
  t.textContent = s;
  n.appendChild(t);
};

const obsReveal = (id, fn) => {
  const n = document.getElementById(id);
  const go = () => { n.innerHTML = ''; fn(n); };
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { go(); io.disconnect(); }
  }, { threshold: .2 });
  io.observe(n);
  n.style.cursor = 'pointer';
  n.addEventListener('click', go);
};

// ── Data (13 Hours: 06:00 - 18:00) ──
// [Hour, Visibility%, Spot & Lighting Note]
const DATA = [
  ['06:00', 82, '本栖湖千圆日出 · 绝景顺光'],
  ['07:00', 88, '精进湖抱子富士 · 倒影大满贯峰值'],
  ['08:00', 85, '西湖根场 · 晨间纯净顺光'],
  ['09:00', 68, '河口湖大石公园 · 光线极佳'],
  ['10:00', 52, '云层开始升腾'],
  ['11:00', 38, '云冠形成 · 五湖巡游收官'],
  ['12:00', 28, '正午低谷 · 12:00 准时还车'],
  ['13:00', 30, '午后多云遮挡'],
  ['14:00', 35, '大石公园返程东京巴士'],
  ['15:00', 46, '云层逐渐拉开'],
  ['16:00', 62, '山中湖长池亲水公园 · 顺侧光'],
  ['17:00', 74, '大石公园落日 · 晚霞红富士'],
  ['18:00', 65, '日落蓝调天光']
];

obsReveal('fujiline', s => {
  const N = DATA.length;
  const base = 285, topMargin = 65;
  const x = i => 55 + i * 54;
  const mapY = v => base - (v / 100) * (base - topMargin);

  // ── 黄金自驾顺光窗口背景带 (06:00 - 11:30，对应 index 0 到 5.5) ──
  const winX1 = x(0) - 18;
  const winX2 = x(5) + 27;
  el(s, 'rect', {
    x: winX1, y: topMargin - 18, width: winX2 - winX1, height: base - topMargin + 18,
    fill: MATCHA_SOFT, rx: 10, stroke: MATCHA, 'stroke-width': 1.4, 'stroke-dasharray': '4 4',
    class: 'fade', style: 'animation-delay: .15s'
  });
  txt(s, {
    x: (winX1 + winX2) / 2, y: topMargin - 2,
    'font-size': 11.5, 'font-weight': 700, fill: MATCHA, 'text-anchor': 'middle',
    'letter-spacing': '.06em', class: 'fade', style: 'animation-delay: .25s'
  }, '自驾拍摄黄金顺光窗 (06:00–11:30)');

  // ── Y 轴辅助刻度线 (20%, 50%, 80%) ──
  [20, 50, 80].forEach(val => {
    const yVal = mapY(val);
    el(s, 'line', {
      x1: 40, y1: yVal, x2: 720, y2: yVal,
      stroke: GRID, 'stroke-width': 1, 'stroke-dasharray': '2 3', class: 'fade'
    });
    txt(s, {
      x: 32, y: yVal + 4,
      'font-size': 10, 'font-weight': 600, fill: FAINT, 'text-anchor': 'end'
    }, `${val}%`);
  });

  // ── X 轴基线 ──
  el(s, 'line', {
    x1: 30, y1: base + 4, x2: 730, y2: base + 4,
    stroke: GRID, 'stroke-width': 1.2, class: 'fade'
  });

  // ── 构建折线路径 ──
  let pathD = '';
  DATA.forEach(([, vis], i) => {
    const px = x(i), py = mapY(vis);
    pathD += (i === 0 ? `M ${px} ${py}` : ` L ${px} ${py}`);
  });

  // 折线阴影渐变填充（区域）
  let areaD = `${pathD} L ${x(N - 1)} ${base} L ${x(0)} ${base} Z`;
  el(s, 'path', {
    d: areaD,
    fill: 'rgba(28, 53, 83, 0.04)',
    class: 'fade', style: 'animation-delay: .2s'
  });

  // 主折线
  el(s, 'path', {
    d: pathD,
    fill: 'none',
    stroke: INK,
    'stroke-width': 2.4,
    'stroke-linecap': 'round',
    'stroke-linejoin': 'round',
    class: 'fade', style: 'animation-delay: .3s'
  });

  // ── 各时刻数据点与文字标签 ──
  DATA.forEach(([hour, vis, note], i) => {
    const px = x(i), py = mapY(vis);
    const isPeak = (hour === '07:00');
    const isNoon = (hour === '12:00');
    const isSunset = (hour === '17:00');
    const isGold = (i <= 5);

    // 关键时刻强调垂线
    if (isPeak || isNoon || isSunset) {
      el(s, 'line', {
        x1: px, y1: py + 8, x2: px, y2: base,
        stroke: isPeak ? MATCHA : (isNoon ? SHU : '#506628'),
        'stroke-width': 1.2, 'stroke-dasharray': '2 2', opacity: 0.6,
        class: 'fade', style: `animation-delay: ${.4 + i * 0.03}s`
      });
    }

    // 节点圆点
    const dotColor = isPeak ? MATCHA : (isNoon ? SHU : (isGold ? '#2D3E50' : INK));
    const dot = el(s, 'circle', {
      cx: px, cy: py,
      r: (isPeak || isNoon) ? 5.5 : 4,
      fill: (isPeak || isNoon) ? dotColor : '#FFFFFF',
      stroke: dotColor,
      'stroke-width': (isPeak || isNoon) ? 2 : 2.2,
      class: 'pop', style: `animation-delay: ${.3 + i * 0.04}s`
    });

    tip(dot, `${hour}：能见度 ${vis}% · ${note}`);

    // 百分比数值文字
    const valY = isPeak ? py - 18 : (isNoon ? py - 14 : py - 12);
    txt(s, {
      x: px, y: valY,
      'font-size': (isPeak || isNoon) ? 13 : 11,
      'font-weight': (isPeak || isNoon) ? 800 : 600,
      fill: isPeak ? MATCHA : (isNoon ? SHU : MUTED),
      'text-anchor': 'middle',
      class: 'fade', style: `animation-delay: ${.4 + i * 0.04}s`
    }, `${vis}%`);

    // 关键地标批注
    if (isPeak) {
      txt(s, {
        x: px + 4, y: py - 34,
        'font-size': 11.5, 'font-weight': 800, fill: MATCHA, 'text-anchor': 'middle',
        class: 'fade', style: 'animation-delay: .5s'
      }, '精进湖 · 倒影大满贯峰值');
    }
    if (isNoon) {
      txt(s, {
        x: px, y: py + 26,
        'font-size': 11.5, 'font-weight': 800, fill: SHU, 'text-anchor': 'middle',
        class: 'fade', style: 'animation-delay: .6s'
      }, '正午谷底 · 12:00 准时还车');
    }

    // X 轴时间刻度
    txt(s, {
      x: px, y: base + 22,
      'font-size': 11, 'font-weight': isGold ? 700 : 500,
      fill: isGold ? INK : MUTED,
      'text-anchor': 'middle',
      class: 'fade', style: `animation-delay: ${i * 0.03}s`
    }, hour);
  });

  // 底部指导结论
  txt(s, {
    x: 380, y: 355,
    'font-size': 11, 'font-weight': 600, fill: MUTED, 'text-anchor': 'middle',
    'letter-spacing': '.06em', class: 'fade', style: 'animation-delay: .7s'
  }, '清晨 06:00–08:00 露脸率超 80% · 正午跌至 28% 宜室内用膳 · 傍晚 17:00 红富士晚霞二度回升');
});
</script>
</body>
</html>
