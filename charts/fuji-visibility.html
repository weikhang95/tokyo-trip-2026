<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lieflat Charts — 富士山全天能见度与五湖机位顺光窗口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #8A8073;
    --faint: #C4BEB3;
    --grid: #E8E2D6;
    --ai: #1C3553;
    --shu: #C2412D;
    --matcha: #506628;
    --matcha-soft: rgba(80, 102, 40, 0.09);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 580px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 24px;
    padding: 28px 24px 20px;
    box-shadow: 0 2px 12px rgba(35, 31, 27, 0.04);
  }
  .badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 12px;
    border: 1px dashed #C4BEB3;
    color: var(--muted);
  }
  h2 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .sub {
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .sub strong { color: var(--matcha); font-weight: 700; }
  svg {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    overflow: visible;
  }
  svg text { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
  .src {
    font-size: 9px;
    color: var(--faint);
    margin-top: 14px;
    letter-spacing: .08em;
    font-weight: 600;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,.7,.3,1.3) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: none; } }
  .fade { animation: fade .8s ease both; }
  @keyframes fade { from { opacity: 0; } }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .fade, .draw { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="badge">F2 HAIRLINE LINE · 富士山景观决策</span>
    <h2>早起两小时等于多看两座富士山：上午 9 点后云量陡增，正午跌至 28%</h2>
    <div class="sub">折线 = 10月历史每小时晴空露脸概率(%) · <strong>浅绿底带 = 06:00–11:30 自驾顺光拍摄黄金窗</strong> · 12:00 还车</div>
    <svg id="fujiline" viewBox="0 0 520 330" preserveAspectRatio="xMidYMid meet" role="img" aria-label="富士山全天各时刻能见度与顺光拍摄窗口折线图"></svg>
    <div class="src">
      <span>F2 Hairline Line · Fuji Five Lakes Timing</span>
      <span>Click chart to replay</span>
    </div>
  </div>
</div>

<script>
// ── Tokens & Helpers ──
const INK = '#231F1B', MUTED = '#8A8073', GRID = '#E8E2D6', FAINT = '#C4BEB3';
const SHU = '#C2412D', MATCHA = '#506628', MATCHA_SOFT = 'rgba(80, 102, 40, 0.08)';
const NS = 'http://www.w3.org/2000/svg';
const el = (p, t, a) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  p.appendChild(n);
  return n;
};
const txt = (p, a, s) => {
  const n = el(p, 'text', a);
  n.textContent = s;
  return n;
};
const tip = (n, s) => {
  const t = document.createElementNS(NS, 'title');
  t.textContent = s;
  n.appendChild(t);
};

const obsReveal = (id, fn) => {
  const n = document.getElementById(id);
  const go = () => { n.innerHTML = ''; fn(n); };
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { go(); io.disconnect(); }
  }, { threshold: .2 });
  io.observe(n);
  n.style.cursor = 'pointer';
  n.addEventListener('click', go);
};

// ── Data (13 Hours: 06:00 - 18:00) ──
// [Hour, Visibility%, Spot & Lighting Note]
const DATA = [
  ['06:00', 82, '本栖湖千圆日出 · 绝景'],
  ['07:00', 88, '精进湖抱子富士 · 倒影大满贯'],
  ['08:00', 85, '西湖根场 · 晨间纯净顺光'],
  ['09:00', 68, '河口湖大石公园 · 光线极佳'],
  ['10:00', 52, '云层开始升腾'],
  ['11:00', 38, '云冠形成 · 五湖巡游收官'],
  ['12:00', 28, '正午低谷 · 12:00 准时还车'],
  ['13:00', 30, '午后多云遮挡'],
  ['14:00', 35, '大石公园返程东京巴士'],
  ['15:00', 46, '云层逐渐拉开'],
  ['16:00', 62, '山中湖长池亲水公园 · 顺侧光'],
  ['17:00', 74, '大石公园落日 · 晚霞红富士'],
  ['18:00', 65, '日落蓝调天光']
];

obsReveal('fujiline', s => {
  const N = DATA.length;
  const base = 252, topMargin = 55;
  const x = i => 44 + i * 36;
  const mapY = v => base - (v / 100) * (base - topMargin);

  // ── 黄金自驾顺光窗口背景带 (06:00 - 11:30，对应 index 0 到 5.5) ──
  const winX1 = x(0) - 14;
  const winX2 = x(5) + 18;
  el(s, 'rect', {
    x: winX1, y: topMargin - 15, width: winX2 - winX1, height: base - topMargin + 15,
    fill: MATCHA_SOFT, rx: 6, stroke: MATCHA, 'stroke-width': 1, 'stroke-dasharray': '3 3',
    class: 'fade', style: 'animation-delay: .15s'
  });
  txt(s, {
    x: (winX1 + winX2) / 2, y: topMargin - 3,
    'font-size': 8.5, 'font-weight': 700, fill: MATCHA, 'text-anchor': 'middle',
    'letter-spacing': '.06em', class: 'fade', style: 'animation-delay: .25s'
  }, '自驾拍摄黄金顺光窗 (06:00–11:30)');

  // ── 50% 基准安全辅助线 ──
  el(s, 'line', {
    x1: 28, y1: mapY(50), x2: 492, y2: mapY(50),
    stroke: GRID, 'stroke-width': 0.8, 'stroke-dasharray': '2 4', class: 'fade'
  });
  txt(s, {
    x: 32, y: mapY(50) - 4,
    'font-size': 7, 'font-weight': 600, fill: FAINT, class: 'fade'
  }, '50% 露脸概率线');

  // ── 地板网格线与发丝日历刻度 ──
  el(s, 'line', {
    x1: 28, y1: base + 2, x2: 492, y2: base + 2,
    stroke: GRID, 'stroke-width': 1, class: 'fade'
  });
  for (let i = 0; i < N; i++) {
    el(s, 'line', {
      x1: x(i), y1: base + 2, x2: x(i), y2: base - 6,
      stroke: FAINT, 'stroke-width': 0.7,
      class: 'fade', style: `animation-delay: ${i * 0.02}s`
    });
  }

  // ── 发丝折线路径 ──
  const pts = DATA.map((d, i) => `${x(i)} ${mapY(d[1])}`).join(' L ');
  el(s, 'path', {
    d: 'M ' + pts, fill: 'none', stroke: INK, 'stroke-width': 1.6, pathLength: 1,
    class: 'draw', style: 'animation-duration: 1.2s'
  });

  // ── 数据圆点与关键峰谷标签 ──
  DATA.forEach(([hour, val, note], i) => {
    const cx = x(i), cy = mapY(val);
    const isPeak = (i === 1); // 07:00
    const isValley = (i === 6); // 12:00
    const isSunset = (i === 11); // 17:00
    const isKey = isPeak || isValley || isSunset;

    const dot = el(s, 'circle', {
      cx, cy,
      r: isKey ? 4.2 : 2.2,
      fill: isValley ? SHU : (isPeak ? MATCHA : (isSunset ? '#E07A5F' : '#FFFFFF')),
      stroke: isKey ? '#FFFFFF' : INK,
      'stroke-width': isKey ? 1.5 : 1.2,
      class: 'pop', style: `animation-delay: ${0.2 + i * 0.04}s`
    });
    tip(dot, `${hour}：${val}% 露脸概率 · ${note}`);

    // 峰值标签
    if (isPeak) {
      txt(s, {
        x: cx, y: cy - 11,
        'font-size': 11, 'font-weight': 800, fill: MATCHA, 'text-anchor': 'middle',
        class: 'fade', style: 'animation-delay: .7s'
      }, `${val}% 极佳`);
    } else if (isValley) {
      txt(s, {
        x: cx, y: cy + 18,
        'font-size': 10, 'font-weight': 800, fill: SHU, 'text-anchor': 'middle',
        class: 'fade', style: 'animation-delay: .8s'
      }, `${val}% 准时还车`);
    } else if (isSunset) {
      txt(s, {
        x: cx, y: cy - 11,
        'font-size': 10, 'font-weight': 800, fill: '#E07A5F', 'text-anchor': 'middle',
        class: 'fade', style: 'animation-delay: .9s'
      }, `${val}% 落日`);
    }

    // X 轴时间刻度
    txt(s, {
      x: cx, y: base + 18,
      'font-size': 7.5, 'font-weight': isKey ? 800 : 500,
      fill: isKey ? INK : MUTED,
      'text-anchor': 'middle', class: 'fade', style: `animation-delay: ${i * 0.03}s`
    }, hour.replace(':00', 'h'));
  });

  // 底部说明
  txt(s, {
    x: 260, y: 312,
    'font-size': 7.5, 'font-weight': 600, fill: MUTED, 'text-anchor': 'middle',
    'letter-spacing': '.08em', class: 'fade', style: 'animation-delay: 1s'
  }, '历史实测：清晨无风倒影概率最高 · 11:30 五湖收官还车避开拥堵与厚云');
});
</script>
</body>
</html>
