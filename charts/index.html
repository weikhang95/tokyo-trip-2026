<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>东京 · 河口湖 2026 — 行程精选 Lieflat Charts 图表集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #8A8073;
    --faint: #C4BEB3;
    --grid: #E8E2D6;
    --ai: #1C3553;
    --shu: #C2412D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    padding: 40px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 960px; margin: 0 auto; }
  .header { margin-bottom: 36px; text-align: center; }
  .header h1 {
    font-family: 'Shippori Mincho', 'Inter', serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--ai);
    margin-bottom: 8px;
    letter-spacing: .02em;
  }
  .header p {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 680px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 28px;
  }
  .chart-frame {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(35, 31, 27, 0.04);
    display: flex;
    flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .chart-frame:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(35, 31, 27, 0.08);
  }
  .frame-head {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--grid);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #FAF9F6;
  }
  .frame-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ai);
  }
  .frame-link {
    font-size: 11.5px;
    color: var(--shu);
    text-decoration: none;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .frame-link:hover { text-decoration: underline; }
  iframe {
    width: 100%;
    height: 480px;
    border: none;
    background: var(--bg);
  }
  .back-btn {
    display: inline-block;
    margin-bottom: 24px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ai);
    text-decoration: none;
  }
  .back-btn:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <a href="../index.html" class="back-btn">← 返回旅行手册主页</a>
  <div class="header">
    <h1>东京 · 河口湖 2026 · 精选决策图表集</h1>
    <p>基于 Lieflat Charts（图表品味法典）打造的 4 张无依赖、单文件响应式决策图表。以单位分解与诚实契约替代装饰，服务于长辈同行与突发决策场景。</p>
  </div>

  <div class="grid">
    <div class="chart-frame">
      <div class="frame-head">
        <span class="frame-title">1. 全程节奏 · 10天体力与三连休避峰曲线</span>
        <a class="frame-link" href="pacing-curve.html" target="_blank">独立全屏 ↗</a>
      </div>
      <iframe src="pacing-curve.html"></iframe>
    </div>

    <div class="chart-frame">
      <div class="frame-head">
        <span class="frame-title">2. 景观决策 · 富士山全天能见度与顺光窗口</span>
        <a class="frame-link" href="fuji-visibility.html" target="_blank">独立全屏 ↗</a>
      </div>
      <iframe src="fuji-visibility.html"></iframe>
    </div>

    <div class="chart-frame">
      <div class="frame-head">
        <span class="frame-title">3. 突发抉择 · 羽田深夜返程 4 大方案权衡</span>
        <a class="frame-link" href="haneda-options.html" target="_blank">独立全屏 ↗</a>
      </div>
      <iframe src="haneda-options.html"></iframe>
    </div>

    <div class="chart-frame">
      <div class="frame-head">
        <span class="frame-title">4. 财务全貌 · 旅费 100% 构成分解</span>
        <a class="frame-link" href="budget-allocation.html" target="_blank">独立全屏 ↗</a>
      </div>
      <iframe src="budget-allocation.html"></iframe>
    </div>
  </div>
</div>
</body>
</html>
