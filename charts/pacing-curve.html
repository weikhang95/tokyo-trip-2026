<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lieflat Charts — 10天行程强度与避峰节奏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #6B6255;
    --faint: #B8B0A2;
    --grid: #E5DFC5;
    --ai: #1C3553;
    --shu: #C2412D;
    --shu-soft: rgba(194, 65, 45, 0.08);
    --matcha: #506628;
    --kin: #855E16;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    overflow-x: hidden;
  }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    padding: 24px 20px 36px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 900px; }
  
  .chart-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 600;
  }
  .chart-nav a {
    color: var(--ai);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 99px;
    background: rgba(28, 53, 83, 0.06);
    transition: all .18s ease;
  }
  .chart-nav a:hover {
    background: var(--ai);
    color: #fff;
  }
  .nav-sep { color: var(--faint); }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 24px;
    padding: 28px 32px 24px;
    box-shadow: 0 4px 20px rgba(35, 31, 27, 0.05);
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 12px;
    border: 1px solid #D9D2C5;
    background: #FAF9F6;
    color: var(--muted);
  }
  h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.35;
  }
  .sub {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .sub strong { color: var(--shu); font-weight: 700; }
  svg {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    overflow: visible;
  }
  svg text { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
  .src {
    font-size: 11px;
    color: var(--muted);
    margin-top: 18px;
    letter-spacing: .06em;
    font-weight: 600;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--grid);
  }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,.7,.3,1.3) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: none; } }
  .fade { animation: fade .8s ease both; }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .fade { animation: none !important; }
  }

  /* ── Embedded Mode (inside charts/index.html iframe, zero scrollbars) ── */
  html.is-embedded,
  body.is-embedded {
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden !important;
    background: transparent !important;
  }
  body.is-embedded .wrap {
    max-width: 100% !important;
    padding: 0 !important;
  }
  body.is-embedded .chart-nav {
    display: none !important;
  }
  body.is-embedded .card {
    border: none !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    background: transparent !important;
    padding: 24px 28px 24px !important;
  }

  @media (max-width: 640px) {
    body { padding: 16px 12px 28px; }
    .card { padding: 20px 16px 18px; border-radius: 18px; }
    body.is-embedded .card { padding: 16px 16px 18px !important; }
    h2 { font-size: 18px; }
    .sub { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="chart-nav">
    <a href="index.html">← 决策图表集总览</a>
    <span class="nav-sep">·</span>
    <a href="../index.html">返回旅行手册主页 →</a>
  </nav>

  <div class="card">
    <span class="badge">F1 RUNG BARS · 行程节奏与负荷</span>
    <h2>硬仗前必有深歇：Day 7 涩谷达峰 13.5k 步前后的波浪回血节奏</h2>
    <div class="sub">1 档梯 = 2,000 步预估消耗 · <strong>朱红虚线 = 日本体育之日三连休大幅降载避峰</strong> · 10/3–10/12 (长辈控载波浪节奏)</div>
    <svg id="rungs" viewBox="0 0 760 370" preserveAspectRatio="xMidYMid meet" role="img" aria-label="10天行程强度与避峰节奏阶梯柱状图"></svg>
    <div class="src">
      <span>F1 Rung Bars · Tokyo Trip 2026</span>
      <span>点击图表重新播放动画 · Click chart to replay</span>
    </div>
  </div>
</div>

<script>
// ── Tokens & Helpers ──
const INK = '#231F1B', MUTED = '#6B6255', GRID = '#E5DFC5', FAINT = '#B8B0A2';
const SHU = '#C2412D', SHU_BG = 'rgba(194, 65, 45, 0.08)', MATCHA = '#506628';
const NS = 'http://www.w3.org/2000/svg';
const el = (p, t, a) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  p.appendChild(n);
  return n;
};
const txt = (p, a, s) => {
  const n = el(p, 'text', a);
  n.textContent = s;
  return n;
};
const tip = (n, s) => {
  const t = document.createElementNS(NS, 'title');
  t.textContent = s;
  n.appendChild(t);
};
const rnd = (i, k) => Math.abs(((i * 73856093) ^ (k * 19349663)) % 1000) / 1000;

const obsReveal = (id, fn) => {
  const n = document.getElementById(id);
  const go = () => { n.innerHTML = ''; fn(n); };
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { go(); io.disconnect(); }
  }, { threshold: .2 });
  io.observe(n);
  n.style.cursor = 'pointer';
  n.addEventListener('click', go);
};

// ── Data (10 Days) ──
// [Day, Date, Steps(k), Title, HighlightType]
const D = [
  ['D1', '10/3六', 2, '抵达安顿', 'lo'],
  ['D2', '10/4日', 4.5, '浅草晨·秋叶原', 'mid'],
  ['D3', '10/5一', 3, '上野·日本桥', 'lo'],
  ['D4', '10/6二', 2.75, '河口湖自驾', 'mid'],
  ['D5', '10/7三', 3.5, '富士五湖自驾', 'mid'],
  ['D6', '10/8四', 5, '筑地·银座·铁塔', 'mid'],
  ['D7', '10/9五', 6.75, '神宫·表参道·涩谷SKY', 'hi'],
  ['D8', '10/10六', 3, '镰仓大佛·江之电海景', 'holiday'],
  ['D9', '10/11日', 2.5, '采买·整备赴羽田', 'holiday'],
  ['D10', '10/12一', 0.5, '02:20起飞回马', 'end']
];

obsReveal('rungs', s => {
  const base = 285, step = 18, HW = 24;
  const x0 = i => 55 + i * 72;

  // ── 三连休背景高亮区域 (D8-D10) ──
  const holX1 = x0(7) - 34;
  const holX2 = x0(9) + 34;
  el(s, 'rect', {
    x: holX1, y: 32, width: holX2 - holX1, height: base - 26,
    fill: SHU_BG, rx: 10, stroke: SHU, 'stroke-width': 1.4, 'stroke-dasharray': '4 4',
    class: 'fade', style: 'animation-delay: .2s'
  });
  txt(s, {
    x: (holX1 + holX2) / 2, y: 52,
    'font-size': 11.5, 'font-weight': 700, fill: SHU, 'text-anchor': 'middle',
    'letter-spacing': '.06em', class: 'fade', style: 'animation-delay: .3s'
  }, '日本体育之日三连休 (大幅降载避人潮)');

  // ── 基础网格线 ──
  el(s, 'line', {
    x1: 20, y1: base + 4, x2: 740, y2: base + 4,
    stroke: GRID, 'stroke-width': 1.2, class: 'fade'
  });

  // ── 绘制每天的阶梯柱 ──
  D.forEach(([day, date, rungsCount, desc, kind], i) => {
    const x = x0(i);
    const wholeRungs = Math.floor(rungsCount);
    const partial = rungsCount - wholeRungs;
    const isHero = (kind === 'hi');
    const isHoliday = (kind === 'holiday');

    // 梯档绘制
    for (let k = 0; k < wholeRungs; k++) {
      const y = base - k * step;
      const w = HW - 1.5 + rnd(k + 1, i + 2) * 3.0;
      const strokeColor = isHero ? INK : (isHoliday ? SHU : '#484036');
      const strokeW = isHero ? 3.0 : 2.2;
      el(s, 'line', {
        x1: x - w, y1: y, x2: x + w, y2: y,
        stroke: strokeColor, 'stroke-width': strokeW,
        opacity: isHero ? 1 : 0.8 + rnd(k + 2, i + 4) * 0.2,
        class: 'fade', style: `animation-delay: ${i * 0.05 + k * 0.015}s`
      });

      // 每 6 档（12,000步高负荷线）红点标记
      if (k === 5) {
        el(s, 'circle', {
          cx: x + HW + 6, cy: y, r: 2.2, fill: isHero ? SHU : FAINT,
          class: 'fade', style: `animation-delay: ${i * 0.05 + k * 0.015}s`
        });
      }
    }

    // 半档（如果有）
    if (partial > 0) {
      const y = base - wholeRungs * step;
      const w = (HW - 2) * partial;
      el(s, 'line', {
        x1: x - w, y1: y, x2: x + w, y2: y,
        stroke: isHoliday ? SHU : '#484036', 'stroke-width': 1.8,
        'stroke-dasharray': '3 3', opacity: 0.75,
        class: 'fade', style: `animation-delay: ${i * 0.05 + wholeRungs * 0.015}s`
      });
    }

    // 柱顶数值
    const topY = base - (rungsCount - 1) * step;
    const stepsRaw = rungsCount * 2;
    const stepsVal = (stepsRaw % 1 === 0) ? stepsRaw : stepsRaw.toFixed(1);
    const num = txt(s, {
      x, y: topY - 12,
      'font-size': isHero ? 15 : 12.5,
      'font-weight': 800,
      fill: isHero ? INK : (isHoliday ? SHU : MUTED),
      'text-anchor': 'middle',
      class: 'fade', style: `animation-delay: ${.3 + i * 0.05}s`
    }, stepsVal > 1 ? `${stepsVal}k` : '回马');

    tip(num, `${day} (${date})：约 ${stepsVal}k 步 · ${desc}`);

    // X 轴标签（Day 与 星期）
    txt(s, {
      x, y: base + 24,
      'font-size': 12, 'font-weight': 800,
      fill: isHero ? INK : (isHoliday ? SHU : INK),
      'text-anchor': 'middle', class: 'fade', style: `animation-delay: ${i * 0.04}s`
    }, day);

    txt(s, {
      x, y: base + 42,
      'font-size': 10.5, 'font-weight': 500,
      fill: MUTED, 'text-anchor': 'middle',
      class: 'fade', style: `animation-delay: ${i * 0.04}s`
    }, date.replace(/^\d+\//, ''));
  });

  // 底部说明与刻度尺
  txt(s, {
    x: 380, y: 355,
    'font-size': 11, 'font-weight': 600, fill: MUTED, 'text-anchor': 'middle',
    'letter-spacing': '.06em', class: 'fade', style: 'animation-delay: .7s'
  }, '1 档 = 2,000 步 · 6 档点标 = 12,000 步高负荷线 · D7 达峰 13.5k 步后连休大幅降载');
});

// ── Embedded Mode Detection & Auto-Height Communication ──
(function() {
  const isEmbedded = (window.self !== window.top);
  if (isEmbedded) {
    document.documentElement.classList.add('is-embedded');
    document.body.classList.add('is-embedded');
  }

  function notifyHeight() {
    if (!isEmbedded) return;
    const body = document.body;
    const html = document.documentElement;
    const h = Math.max(
      body ? body.scrollHeight : 0,
      body ? body.offsetHeight : 0,
      html ? html.scrollHeight : 0,
      html ? html.offsetHeight : 0
    );
    if (h > 50 && window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'resize-iframe',
        frameSrc: 'pacing-curve.html',
        height: Math.ceil(h)
      }, '*');
    }
  }

  if (isEmbedded) {
    window.addEventListener('load', notifyHeight);
    window.addEventListener('resize', notifyHeight);
    if (window.ResizeObserver && document.body) {
      new ResizeObserver(notifyHeight).observe(document.body);
    }
    setTimeout(notifyHeight, 50);
    setTimeout(notifyHeight, 200);
    setTimeout(notifyHeight, 500);
  }
})();
</script>
</body>
</html>
