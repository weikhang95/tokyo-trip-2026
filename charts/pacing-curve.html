<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lieflat Charts — 10天行程强度与避峰节奏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #8A8073;
    --faint: #C4BEB3;
    --grid: #E8E2D6;
    --ai: #1C3553;
    --shu: #C2412D;
    --shu-soft: #FDF2F0;
    --matcha: #506628;
    --kin: #855E16;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 580px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 24px;
    padding: 28px 24px 20px;
    box-shadow: 0 2px 12px rgba(35, 31, 27, 0.04);
  }
  .badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 12px;
    border: 1px dashed #C4BEB3;
    color: var(--muted);
  }
  h2 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -.02em;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .sub {
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .sub strong { color: var(--shu); font-weight: 700; }
  svg {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    overflow: visible;
  }
  svg text { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
  .src {
    font-size: 9px;
    color: var(--faint);
    margin-top: 14px;
    letter-spacing: .08em;
    font-weight: 600;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,.7,.3,1.3) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: none; } }
  .fade { animation: fade .8s ease both; }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .fade { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="badge">F1 RUNG BARS · 行程节奏与负荷</span>
    <h2>硬仗前必有深歇：Day 7 涩谷高峰前后的波浪回血节奏</h2>
    <div class="sub">1 档梯 = 2,000 步预估消耗 · <strong>朱红虚线 = 日本体育之日三连休避峰</strong> · 10/3–10/12</div>
    <svg id="rungs" viewBox="0 0 520 330" preserveAspectRatio="xMidYMid meet" role="img" aria-label="10天行程强度与避峰节奏阶梯柱状图"></svg>
    <div class="src">
      <span>F1 Rung Bars · Tokyo Trip 2026</span>
      <span>Click chart to replay</span>
    </div>
  </div>
</div>

<script>
// ── Tokens & Helpers ──
const INK = '#231F1B', MUTED = '#8A8073', GRID = '#E8E2D6', FAINT = '#C4BEB3';
const SHU = '#C2412D', SHU_BG = 'rgba(194, 65, 45, 0.08)', MATCHA = '#506628';
const NS = 'http://www.w3.org/2000/svg';
const el = (p, t, a) => {
  const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]);
  p.appendChild(n);
  return n;
};
const txt = (p, a, s) => {
  const n = el(p, 'text', a);
  n.textContent = s;
  return n;
};
const tip = (n, s) => {
  const t = document.createElementNS(NS, 'title');
  t.textContent = s;
  n.appendChild(t);
};
const rnd = (i, k) => Math.abs(((i * 73856093) ^ (k * 19349663)) % 1000) / 1000;

const obsReveal = (id, fn) => {
  const n = document.getElementById(id);
  const go = () => { n.innerHTML = ''; fn(n); };
  const io = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { go(); io.disconnect(); }
  }, { threshold: .2 });
  io.observe(n);
  n.style.cursor = 'pointer';
  n.addEventListener('click', go);
};

// ── Data (10 Days) ──
// [Day, Date, Steps(k), Title, HighlightType]
const D = [
  ['D1', '10/3六', 3, '抵达安顿', 'lo'],
  ['D2', '10/4日', 6.5, '浅草晨·晴空塔', 'mid'],
  ['D3', '10/5一', 4.5, '上野·日本桥', 'lo'],
  ['D4', '10/6二', 5, '河口湖自驾', 'mid'],
  ['D5', '10/7三', 5.5, '富士五湖大满贯', 'mid'],
  ['D6', '10/8四', 6, '筑地·银座·铁塔', 'mid'],
  ['D7', '10/9五', 9, '明治神宫·涩谷SKY', 'hi'],
  ['D8', '10/10六', 3.5, '清澄白河·连休避峰', 'holiday'],
  ['D9', '10/11日', 3, '合羽桥·整备赴羽田', 'holiday'],
  ['D10', '10/12一', 0.5, '02:20起飞回马', 'end']
];

obsReveal('rungs', s => {
  const base = 252, step = 14, HW = 16;
  const x0 = i => 42 + i * 48;

  // ── 三连休背景高亮区域 (D8-D10) ──
  const holX1 = x0(7) - 22;
  const holX2 = x0(9) + 22;
  el(s, 'rect', {
    x: holX1, y: 32, width: holX2 - holX1, height: base - 28,
    fill: SHU_BG, rx: 8, stroke: SHU, 'stroke-width': 1, 'stroke-dasharray': '3 3',
    class: 'fade', style: 'animation-delay: .2s'
  });
  txt(s, {
    x: (holX1 + holX2) / 2, y: 48,
    'font-size': 8.5, 'font-weight': 700, fill: SHU, 'text-anchor': 'middle',
    'letter-spacing': '.06em', class: 'fade', style: 'animation-delay: .3s'
  }, '日本体育之日三连休');

  // ── 基础网格线 ──
  el(s, 'line', {
    x1: 18, y1: base + 4, x2: 502, y2: base + 4,
    stroke: GRID, 'stroke-width': 1, class: 'fade'
  });

  // ── 绘制每天的阶梯柱 ──
  D.forEach(([day, date, rungsCount, desc, kind], i) => {
    const x = x0(i);
    const wholeRungs = Math.floor(rungsCount);
    const partial = rungsCount - wholeRungs;
    const isHero = (kind === 'hi');
    const isHoliday = (kind === 'holiday');

    // 梯档绘制
    for (let k = 0; k < wholeRungs; k++) {
      const y = base - k * step;
      const w = HW - 1.2 + rnd(k + 1, i + 2) * 2.4;
      const strokeColor = isHero ? INK : (isHoliday ? SHU : '#484036');
      const strokeW = isHero ? 2.4 : 1.6;
      el(s, 'line', {
        x1: x - w, y1: y, x2: x + w, y2: y,
        stroke: strokeColor, 'stroke-width': strokeW,
        opacity: isHero ? 1 : 0.75 + rnd(k + 2, i + 4) * 0.25,
        class: 'fade', style: `animation-delay: ${i * 0.06 + k * 0.015}s`
      });

      // 每 5 档（10,000步）点标
      if (k === 4) {
        el(s, 'circle', {
          cx: x + HW + 4, cy: y, r: 1.2, fill: isHero ? SHU : FAINT,
          class: 'fade', style: `animation-delay: ${i * 0.06 + k * 0.015}s`
        });
      }
    }

    // 半档（如果有）
    if (partial > 0) {
      const y = base - wholeRungs * step;
      const w = (HW - 1.5) * partial;
      el(s, 'line', {
        x1: x - w, y1: y, x2: x + w, y2: y,
        stroke: isHoliday ? SHU : '#484036', 'stroke-width': 1.4,
        'stroke-dasharray': '2 2', opacity: 0.7,
        class: 'fade', style: `animation-delay: ${i * 0.06 + wholeRungs * 0.015}s`
      });
    }

    // 柱顶数值
    const topY = base - (rungsCount - 1) * step;
    const stepsVal = Math.round(rungsCount * 2);
    const num = txt(s, {
      x, y: topY - 10,
      'font-size': isHero ? 11.5 : 9.5,
      'font-weight': 800,
      fill: isHero ? INK : (isHoliday ? SHU : MUTED),
      'text-anchor': 'middle',
      class: 'fade', style: `animation-delay: ${.3 + i * 0.06}s`
    }, stepsVal > 1 ? `${stepsVal}k` : '回马');

    tip(num, `${day} (${date})：约 ${stepsVal}k 步 · ${desc}`);

    // X 轴标签（Day 与 星期）
    txt(s, {
      x, y: base + 18,
      'font-size': 8.5, 'font-weight': 800,
      fill: isHero ? INK : (isHoliday ? SHU : INK),
      'text-anchor': 'middle', class: 'fade', style: `animation-delay: ${i * 0.05}s`
    }, day);

    txt(s, {
      x, y: base + 30,
      'font-size': 7, 'font-weight': 500,
      fill: MUTED, 'text-anchor': 'middle',
      class: 'fade', style: `animation-delay: ${i * 0.05}s`
    }, date.replace(/^\d+\//, ''));
  });

  // 底部说明与刻度尺
  txt(s, {
    x: 260, y: 312,
    'font-size': 7.5, 'font-weight': 600, fill: MUTED, 'text-anchor': 'middle',
    'letter-spacing': '.08em', class: 'fade', style: 'animation-delay: .8s'
  }, '1 档 = 2,000 步 · 5 档标点 = 10,000 步红线 · DAY 7 达峰后连休大幅降载');
});
</script>
</body>
</html>
