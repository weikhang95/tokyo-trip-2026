<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>东京 · 随身行程与地图助手 (Tokyo Companion)</title>
<meta name="theme-color" content="#F7F5F0" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="东京 2026" />
<script>
// 与手册共用 tokyo_theme：在任一页切换，另一页跟着走
try {
  const savedTheme = localStorage.getItem('tokyo_theme');
  const t = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0e1116' : '#F7F5F0';
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="tabbar.css?v=4">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #6B6255;
    --faint: #B8B0A2;
    --grid: #E5DFC5;
    --ai: #1C3553;
    --ai-soft: rgba(28, 53, 83, 0.08);
    --shu: #C2412D;
    --shu-ink: #B03A27;
    --shu-soft: rgba(194, 65, 45, 0.08);
    --matcha: #506628;
    --matcha-soft: rgba(80, 102, 40, 0.1);
    --kin: #855E16;
    --kin-soft: rgba(133, 94, 22, 0.08);
    --shadow: 0 4px 16px rgba(35, 31, 27, 0.06);
    --radius: 16px;
    --on-ai: #FFFFFF;
    --chip-bg: #EFECE6;
    --chip-bg-2: #EAE6DE;
    --map-bg: #e5e3df;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --bar-bg: rgba(247, 245, 240, 0.96);
    --pin-ring: #FFFFFF;
  }
  /* 深色：与手册 index.html 的深色色值一致 */
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1116;
    --paper: #12161c;
    --card-bg: #151a21;
    --ink: #e8ecf1;
    --muted: #aab4c0;
    --faint: #8a94a1;
    --grid: #29303a;
    --ai: #8fb3e6;
    --ai-soft: rgba(143, 179, 230, 0.12);
    --shu: #f08a78;
    --shu-ink: #f08a78;
    --shu-soft: rgba(240, 138, 120, 0.12);
    --matcha: #9dbf5a;
    --matcha-soft: rgba(157, 191, 90, 0.12);
    --kin: #d9b25c;
    --kin-soft: rgba(217, 178, 92, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --on-ai: #0e1116;
    --chip-bg: #1c222b;
    --chip-bg-2: #1c222b;
    --map-bg: #1c222b;
    --bar-bg: rgba(14, 17, 22, 0.94);
    --pin-ring: #151a21;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }

  /* ── Sticky Top Bar ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: var(--bar-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--grid);
  }
  .bar-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    max-width: 900px;
    margin: 0 auto;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .back-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ai);
    background: var(--ai-soft);
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 99px;
    white-space: nowrap;
    min-height: 40px;
    transition: scale .1s var(--ease), background-color .15s var(--ease);
  }
  .back-btn:active { scale: .96; }
  .view-toggles {
    display: flex;
    flex-shrink: 0;
    gap: 4px;
    background: var(--chip-bg);
    padding: 2px;
    border-radius: 99px;
  }
  .view-btn {
    position: relative;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    padding: 0 12px;
    min-height: 40px;
    white-space: nowrap;
    border-radius: 99px;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), scale .1s var(--ease);
  }
  .view-btn:active,.theme-btn:active, .d8-opt-btn:active, .route-toggle-btn:active { scale: .96; }
  .view-btn.active {
    background: var(--ai);
    color: var(--on-ai);
  }
  /* 昼 / 夜 切换 */
  .bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .theme-btn {
    position: relative;
    min-width: 40px; min-height: 40px; padding: 0 10px;
    border: 0; border-radius: 99px; background: transparent;
    color: var(--muted); font: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), scale .1s var(--ease);
  }
  .theme-btn:hover { background: var(--chip-bg); color: var(--ink); }

  /* ── Day Selector Pills ── */
  .day-scroll {
    overflow-x: auto;
    scrollbar-width: none;
    display: flex;
    gap: 6px;
    padding: 6px 12px 10px;
    max-width: 900px;
    margin: 0 auto;
  }
  .day-scroll::-webkit-scrollbar { display: none; }
  .day-pill {
    flex: 0 0 auto;
    padding: 6px 12px;
    background: var(--paper);
    border: 1px solid var(--grid);
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .day-pill .dp-tag {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.8;
  }
  .day-pill.active {
    background: var(--ai);
    color: var(--on-ai);
    border-color: var(--ai);
    box-shadow: 0 2px 8px rgba(28, 53, 83, 0.25);
  }
  .d8-opt-btn small { font-size: 11px; font-weight: 600; }

  /* ── Main Layout Container ── */
  .content-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 12px 14px;
  }

  /* ── Map Container ── */
  .map-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .map-card.collapsed {
    display: none;
  }
  .map-header {
    padding: 8px 14px;
    background: var(--paper);
    border-bottom: 1px solid var(--grid);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    gap: 8px;
  }
  .map-actions {
    display: flex;
    flex: 1;
    gap: 6px;
    align-items: center;
  }
  .map-actions > a { margin-left: auto; }
  .route-toggle-btn {
    position: relative;
    border: 1px solid var(--grid);
    background: var(--card-bg);
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), scale .1s var(--ease);
  }
  .route-toggle-btn.active {
    background: var(--ai);
    color: var(--on-ai);
    border-color: var(--ai);
  }
  .map-link-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--shu-ink);
    text-decoration: none;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--shu-soft);
    transition: scale .1s var(--ease);
  }
  .map-link-btn:active { scale: .96; }
  #map {
    width: 100%;
    height: 270px;
    background: var(--map-bg);
  }
  @media (min-width: 640px) {
    #map { height: 340px; }
  }


  /* ── Day Summary Header Card ── */
  
  /* Day 8 Tri-Option Switcher Pills */
  .day8-switcher {
    display: flex;
    gap: 6px;
    background: var(--chip-bg-2);
    padding: 3px;
    border-radius: 17px;
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .day8-switcher::-webkit-scrollbar { display: none; }
  .d8-opt-btn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    padding: 5px 4px;
    border-radius: 14px;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), scale .1s var(--ease);
    white-space: nowrap;
    text-align: center;
  }
  .d8-opt-btn.active {
    background: var(--ai);
    color: var(--on-ai);
    box-shadow: 0 2px 8px rgba(28, 53, 83, 0.25);
  }

  .day-hero-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .hero-pacing {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--chip-bg);
    color: var(--muted);
  }
  .hero-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 6px;
  }
  /* 下一站：卡片内边距 14px，圆角 16 - 6 ≈ 10px 保持同心 */
  .hero-next {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; min-height: 44px; margin: 4px 0 8px; padding: 8px 12px;
    border: 0; border-radius: 10px; background: var(--chip-bg); color: var(--ink);
    font: inherit; text-align: left; cursor: pointer;
    transition: scale .1s var(--ease), background-color .15s var(--ease);
  }
  .hero-next[hidden] { display: none; }
  .hero-next:active { scale: .98; }
  .hero-next:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .hn-when {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; color: var(--shu);
    font-variant-numeric: tabular-nums;
  }
  .hn-when .ph { width: 1.2em; height: 1.2em; }
  .hn-what {
    font-size: 14px; font-weight: 700; line-height: 1.4;
    font-variant-numeric: tabular-nums; text-wrap: pretty;
  }
  /* 概要默认收起：路线已在标题里，逐站细节在下面的时间轴 */
  .hero-more > summary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    margin: -6px 0 -8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ai);
    cursor: pointer;
    list-style: none;
  }
  .hero-more > summary::-webkit-details-marker { display: none; }
  .hero-more > summary::after {
    content: "";
    width: 6px; height: 6px;
    border: solid currentColor;
    border-width: 0 1.5px 1.5px 0;
    rotate: 45deg;
    translate: 0 -.15em;
    transition: rotate .2s var(--ease), translate .2s var(--ease);
  }
  .hero-more[open] > summary::after { rotate: 225deg; translate: 0 .15em; }
  .hero-more > summary:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; border-radius: 4px; }
  .hero-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.65;
    padding-bottom: 4px;
    text-wrap: pretty;
  }
  @media (prefers-reduced-motion: reduce) { .hero-more > summary::after { transition: none; } }
  .hero-transit {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 8px 12px;
    border-radius: 10px;
    margin: 4px 0 6px;
    width: 100%;
  }
  .hero-route-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 800;
    color: var(--shu);
    background: var(--shu-soft);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 99px;
    margin-top: 8px;
    transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  /* 分屏时地图卡已有「Google 路线」，这里只在「行程」视图出现 */
  body:not([data-view="time"]) .hero-route-link { display: none; }
  .hero-route-link:hover {
    background: var(--shu);
    color: var(--on-ai);
  }

  /* ── Timeline Nodes ── */
  .timeline {
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    top: 14px;
    bottom: 14px;
    left: 11px;
    width: 2px;
    background: var(--grid);
    border-radius: 2px;
  }
  .node-item {
    position: relative;
    margin-bottom: 16px;
    cursor: pointer;
  }
  .node-dot {
    position: absolute;
    left: -28px;
    top: 14px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 2px solid var(--ai);
    color: var(--ai);
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    z-index: 2;
    transition: background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .node-item.hero .node-dot {
    border-color: var(--shu);
    color: var(--shu);
  }
  .node-item.active .node-dot {
    background: var(--shu);
    border-color: var(--shu);
    color: var(--on-ai);
    transform: scale(1.15);
  }

  .node-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: scale .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .node-item.active .node-card {
    border-color: var(--shu);
    box-shadow: 0 4px 18px rgba(194, 65, 45, 0.15);
  }
  .node-card:active {
    scale: .99;
  }

  .node-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 4px;
  }
  .time-badge {
    font-size: 12px;
    font-weight: 800;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: .02em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .ph { width: 1.2em; height: 1.2em; flex: none; }
  .nav-btn .ph { width: 1.25em; height: 1.25em; }
  a.tel { display: inline-flex; align-items: center; gap: 3px; color: var(--ai); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
  a.tel .ph { width: 1.1em; height: 1.1em; }
  .node-when {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    min-width: 0;
  }
  .node-tag {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ai);
    line-height: 1.4;
  }
  .node-item.hero .time-badge {
    color: var(--shu);
    background: var(--shu-soft);
  }

  .nav-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--on-ai);
    background: var(--ai);
    text-decoration: none;
    padding: 4px 9px;
    border-radius: 99px;
    flex-shrink: 0;
    transition: background-color .15s var(--ease), scale .1s var(--ease);
  }
  .nav-btn:active { scale: .96; }
  .back-btn::after, .view-btn::after, .theme-btn::after, .route-toggle-btn::after, .map-link-btn::after {
    content: ""; position: absolute; inset: 50% auto auto 50%;
    width: 44px; height: 44px; transform: translate(-50%, -50%);
  }
  /* 导航钮在可点的站点卡片里：只往上、左右扩，不压住下方站名（误触会跳出到 Google Maps） */
  .nav-btn::after { content: ""; position: absolute; inset: -10px -6px 0; }
  .nav-btn:hover {
    background: var(--shu);
  }
  .node-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .node-name-sub {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .node-action {
    font-size: 12.5px;
    color: var(--ink);
    line-height: 1.48;
    margin-bottom: 8px;
  }
  /* 一站 = 站名 + 几条要点（永远看得到，一条一行）+ 收起的详情 */
  .node-key,
  .node-more ul {
    list-style: none;
    margin: 0 0 2px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    text-wrap: pretty;
    overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
  }
  .node-key li,
  .node-more li {
    position: relative;
    padding-left: 14px;
  }
  .node-key li::before,
  .node-more li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: .68em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
  }
  .node-key li.kw { color: var(--shu); font-weight: 700; }
  .node-key li.kw::before { background: currentColor; }
  /* summary 保持 44px 触控高度，但吃掉一部分卡片内边距，免得底部空一大块 */
  .node-more { margin: -4px 0 -10px; }
  .node-more > summary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    cursor: pointer;
    list-style: none;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ai);
    -webkit-tap-highlight-color: transparent;
  }
  .node-more > summary::-webkit-details-marker { display: none; }
  .node-more > summary::after {
    content: "";
    width: .45em; height: .45em;
    border-right: 2px solid; border-bottom: 2px solid;
    rotate: 45deg; translate: 0 -.15em;
    transition: rotate .15s var(--ease), translate .15s var(--ease);
  }
  .node-more[open] > summary::after { rotate: 225deg; translate: 0 .15em; }
  .node-more > summary:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; border-radius: 4px; }
  .node-more ul { gap: 6px; margin-bottom: 8px; }
  .node-more strong { font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .node-more > summary::after { transition: none; } }
  .node-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .ntag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--paper);
    border: 1px solid var(--grid);
    color: var(--muted);
  }
  .ntag.highlight {
    background: var(--shu-soft);
    border-color: rgba(194, 65, 45, 0.2);
    color: var(--shu);
  }
  .ntag.ease {
    background: var(--matcha-soft);
    border-color: rgba(80, 102, 40, 0.2);
    color: var(--matcha);
  }

  /* ── Bottom Floating Quick Action ── */
  .role-note {
    margin: 20px 0 8px;
    padding: 16px 18px;
    background: var(--ai-soft);
    border: 1px solid var(--grid);
    border-radius: var(--radius);

// Compact Polyline Decoder
function decodePolyline(encoded) {
  const points = [];
  let index = 0, len = encoded.length;
  let lat = 0, lng = 0;
  while (index < len) {
    let b, shift = 0, result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lat += dlat;
    shift = 0;
    result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lng += dlng;
    points.push([lat * 1e-5, lng * 1e-5]);
  }
  return points;
}

function drawRealCurvedRoute(coords, color, isDrive) {
  // Glow casing line
  const casing = makePolyline(coords, {
    color: color,
    weight: isDrive ? 8 : 6,
    opacity: 0.22,
    lineCap: 'round',
    lineJoin: 'round'
  });
  // Core crisp line
  const core = makePolyline(coords, {
    color: color,
    weight: isDrive ? 4 : 3,
    opacity: 0.9,
    lineCap: 'round',
    lineJoin: 'round'
  });
  polylineLayer.addLayer(casing);
  polylineLayer.addLayer(core);
}

async function renderRoutePolyline(day) {
  if (!polylineLayer) return;
  polylineLayer.clearLayers();
  
  const latlngs = day.nodes.map(n => [n.lat, n.lng]);
  if (latlngs.length < 2) {
    return;
  }

  const isDrive = (day.day === 'D4' || day.day === 'D5');
  const isNature = isDrive;
  const themeColor = isNature ? cssVar('--matcha') : (isDrive ? cssVar('--ai') : cssVar('--shu'));

  if (!showRealRoadRoute) {
    // Straight line mode
    const straightLine = makePolyline(latlngs, {
      color: themeColor,
      weight: 3.5,
      opacity: 0.65,
      dashArray: '5, 8'
    });
    polylineLayer.addLayer(straightLine);
    return;
  }

  // Real Road Mode:
  // 1. Check prebaked cache first (0ms instant)
  if (PREBAKED_ROUTES[day.day]) {
    const data = PREBAKED_ROUTES[day.day];
    const coords = decodePolyline(data.encoded);
    drawRealCurvedRoute(coords, themeColor, isDrive);
    return;
  }

  // 2. Check dynamic memory cache
  if (routeCache[day.day]) {
    const data = routeCache[day.day];
    drawRealCurvedRoute(data.coords, themeColor, isDrive);
    return;
  }

  // 3. Fallback transit/straight line immediately
  const tempLine = makePolyline(latlngs, {
    color: themeColor,
    weight: 3.5,
    opacity: 0.65,
    dashArray: day.day === 'D10' ? '8, 12' : '5, 8'
  });
  polylineLayer.addLayer(tempLine);

  // For D1 (Skyliner) and D10 (Flights), transit line is optimal
  if (day.day === 'D1' || day.day === 'D10') return;

  // 4. Dynamic query OSRM for any uncached days
  try {
    const profile = isDrive ? 'driving' : 'walking';
    const coordsStr = day.nodes.map(n => `${n.lng.toFixed(5)},${n.lat.toFixed(5)}`).join(';');
    const res = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${coordsStr}?overview=full&geometries=geojson`);
    const json = await res.json();
    if (json.code === 'Ok' && json.routes && json.routes[0]) {
      const r = json.routes[0];
      const realCoords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      // 只画线不报数：预存路线与 OSRM 都按车速算，公里和分钟对步行/电车日都不准
      routeCache[day.day] = { coords: realCoords };

      if (DAYS[currentDayIdx].day === day.day && showRealRoadRoute) {
        polylineLayer.clearLayers();
        drawRealCurvedRoute(realCoords, themeColor, isDrive);
      }
    }
  } catch (e) {
    // Offline or network error - keep straight line
  }
}

function isToday(day) {
  const now = new Date();
  const [m, d] = day.date.split('/').map(Number);
  return now.getFullYear() === 2026 && now.getMonth() + 1 === m && now.getDate() === d;
}
function todayIdx() {
  const i = DAYS.findIndex(isToday);
  return i < 0 ? 0 : i;

function getDayIdxFromHash() {
  const hash = window.location.hash.toLowerCase().replace('#', '');

  const match = hash.match(/\d+/);
  if (match) {
    const num = parseInt(match[0], 10);
    if (num >= 1 && num <= DAYS.length) return num - 1;
  }
  return 0;
}

// Small stand-in for Leaflet's layer group: holds overlays so a day switch can clear them
function makeLayerGroup() {
  const items = [];
  return {
    addLayer(o) { o.setMap(map); items.push(o); },
    clearLayers() { items.forEach(o => o.setMap(null)); items.length = 0; }
  };
}

// latlngs are [lat, lng] pairs; opts use the old Leaflet names (color, weight, opacity, dashArray)
function makePolyline(latlngs, opts) {
  const path = latlngs.map(([lat, lng]) => ({ lat, lng }));
  if (opts.dashArray) {
    const [dash, gap] = opts.dashArray.split(',').map(Number);
    return new google.maps.Polyline({
      path,
      strokeOpacity: 0,
      icons: [{
        icon: { path: 'M 0,-1 0,1', strokeColor: opts.color, strokeOpacity: opts.opacity, scale: opts.weight },
        offset: '0',
        repeat: `${(dash + gap) * 1.5}px`
      }]
    });
  }
  return new google.maps.Polyline({
    path,
    strokeColor: opts.color,
    strokeWeight: opts.weight,
    strokeOpacity: opts.opacity
  });
}

    });
    marker.popupHtml = `
        <div style="font-family:'Inter','Noto Sans SC',sans-serif; min-width:160px;">
          <div style="font-size:11px; font-weight:800; color:var(--shu); margin-bottom:2px;">${node.time} · 第 ${nIdx + 1} 站</div>

        </div>
      `;

    marker.addListener('click', () => {
      openStopInfo(marker);
      highlightNodeCard(nIdx);
    });

    markersLayer.addLayer(marker);
    mapMarkers.push(marker);
  });

  // Render intelligent polyline (real road curves or straight fallback)
  renderRoutePolyline(day);

  // Auto fit bounds with padding
  if (latlngs.length === 1) {
    map.setCenter({ lat: latlngs[0][0], lng: latlngs[0][1] });
    map.setZoom(15);
  } else if (latlngs.length > 1) {
    const bounds = new google.maps.LatLngBounds();
    latlngs.forEach(([lat, lng]) => bounds.extend({ lat, lng }));
    map.fitBounds(bounds, 40);
    google.maps.event.addListenerOnce(map, 'idle', () => {
      if (map.getZoom() > 15) map.setZoom(15);
    });
  }
}

function scrollToCurrentNode() {
  const day = DAYS[currentDayIdx];
  if (!day.nodes.length) return;
  let idx = 0;
  if (isToday(day)) {
    const now = new Date();
    const mins = now.getHours() * 60 + now.getMinutes();
    day.nodes.forEach((n, i) => {
      const t = /^(\d{1,2}):(\d{2})/.exec(n.time);
      if (t && +t[1] * 60 + +t[2] <= mins) idx = i;
    });
  }
  focusNode(idx);
}

  const day = DAYS[currentDayIdx];
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const i = isToday(day) ? day.nodes.findIndex(n => nodeStartMins(n) > mins) : -1;
  if (i < 0) { el.hidden = true; return; }
  const n = day.nodes[i];
  const diff = nodeStartMins(n) - mins;
  const when = diff < 60 ? `${diff} 分钟后` : `${Math.floor(diff / 60)} 小时 ${diff % 60} 分后`;
  el.innerHTML = `<span class="hn-when">${n.mode ? ph(n.mode, PH_LABEL[n.mode]) : ''}下一站 · ${when}</span><span class="hn-what">${n.time.slice(0, 5)} ${n.title}</span>`;
  el.onclick = () => focusNode(i);
  el.hidden = false;
}
setInterval(updateNextStop, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) updateNextStop(); });

function setViewMode(mode) {
  currentViewMode = mode;
  document.body.dataset.view = mode;
  ['split', 'time', 'map'].forEach(m => document.getElementById('btn-' + m).setAttribute('aria-pressed', String(m === mode)));
  document.getElementById('btn-split').classList.toggle('active', mode === 'split');
  document.getElementById('btn-time').classList.toggle('active', mode === 'time');
  document.getElementById('btn-map').classList.toggle('active', mode === 'map');

  const mapCard = document.getElementById('mapCard');
  const heroCard = document.getElementById('dayHero');
  const timelineList = document.getElementById('timelineList');
  const mapElem = document.getElementById('map');

  if (mode === 'time') {
    mapCard.classList.add('collapsed');
    heroCard.style.display = 'block';
    timelineList.style.display = 'block';
  } else if (mode === 'map') {
    mapCard.classList.remove('collapsed');
    heroCard.style.display = 'none';
    timelineList.style.display = 'none';
    mapElem.style.height = 'calc(100vh - 140px)';
  } else {
    // split
    mapCard.classList.remove('collapsed');
    heroCard.style.display = 'block';
    timelineList.style.display = 'block';
    mapElem.style.height = (window.innerWidth >= 640) ? '340px' : '270px';
  }
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
