<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>东京 · 随身行程与地图助手 (Tokyo Companion)</title>
<meta name="theme-color" content="#F7F5F0" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="东京 2026" />
<script>
// 与手册共用 tokyo_theme：在任一页切换，另一页跟着走
try {
  const savedTheme = localStorage.getItem('tokyo_theme');
  const t = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0e1116' : '#F7F5F0';
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="tabbar.css?v=5">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #6B6255;
    --grid: #E5DFC5;
    --ai: #1C3553;
    --ai-soft: rgba(28, 53, 83, 0.08);
    --shu: #C2412D;
    --shu-ink: #B03A27;
    --shu-soft: rgba(194, 65, 45, 0.08);
    --matcha: #506628;
    --matcha-soft: rgba(80, 102, 40, 0.1);
    --kin: #855E16;
    --kin-soft: rgba(133, 94, 22, 0.08);
    --shadow: 0 4px 16px rgba(35, 31, 27, 0.06);
    --radius: 16px;
    --on-ai: #FFFFFF;
    --chip-bg: #EFECE6;
    --chip-bg-2: #EAE6DE;
    --map-bg: #e5e3df;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --bar-bg: rgba(247, 245, 240, 0.96);
    --pin-ring: #FFFFFF;
  }
  /* 深色：与手册 index.html 的深色色值一致 */
  /* 底栏一直盖在页底（手机 57px；宽屏浮起 16px）：键盘 Tab 到页底的站点时让开它 */
  html { scroll-padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px) + 8px); }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1116;
    --paper: #12161c;
    --card-bg: #151a21;
    --ink: #e8ecf1;
    --muted: #aab4c0;
    --grid: #29303a;
    --ai: #8fb3e6;
    --ai-soft: rgba(143, 179, 230, 0.12);
    --shu: #f08a78;
    --shu-ink: #f08a78;
    --shu-soft: rgba(240, 138, 120, 0.12);
    --matcha: #9dbf5a;
    --matcha-soft: rgba(157, 191, 90, 0.12);
    --kin: #d9b25c;
    --kin-soft: rgba(217, 178, 92, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --on-ai: #0e1116;
    --chip-bg: #1c222b;
    --chip-bg-2: #1c222b;
    --map-bg: #1c222b;
    --bar-bg: rgba(14, 17, 22, 0.94);
    --pin-ring: #151a21;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }

  /* ── Sticky Top Bar ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: var(--bar-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--grid);
  }
  .bar-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    max-width: 900px;
    margin: 0 auto;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .back-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ai);
    background: var(--ai-soft);
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 99px;
    white-space: nowrap;
    min-height: 40px;
    transition: scale .1s var(--ease), background-color .15s var(--ease);
  }
  .back-btn:active { scale: .96; }
  .view-toggles {
    display: flex;
    flex-shrink: 0;
    gap: 4px;
    background: var(--chip-bg);
    padding: 2px;
    border-radius: 99px;
  }
  .view-btn {
    position: relative;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    padding: 0 12px;
    min-height: 40px;
    white-space: nowrap;
    border-radius: 99px;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), scale .1s var(--ease);
  }
  .view-btn:active,.theme-btn:active, .d8-opt-btn:active, .route-toggle-btn:active { scale: .96; }
  .view-btn.active {
    background: var(--ai);
    color: var(--on-ai);
  }
  /* 昼 / 夜 切换 */
  .bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .theme-btn {
    position: relative;
    min-width: 40px; min-height: 40px; padding: 0 10px;
    border: 0; border-radius: 99px; background: transparent;
    color: var(--muted); font: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), scale .1s var(--ease);
  }
  @media (hover: hover) { .theme-btn:hover { background: var(--chip-bg); color: var(--ink); } }

  /* ── Day Selector Pills ── */
  .day-scroll {
    overflow-x: auto;
    scrollbar-width: none;
    display: flex;
    gap: 6px;
    padding: 6px 12px 10px;
    max-width: 900px;
    margin: 0 auto;
  }
  .day-scroll::-webkit-scrollbar { display: none; }
  .day-pill {
    flex: 0 0 auto;
    padding: 6px 12px;
    background: var(--paper);
    border: 1px solid var(--grid);
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  /* 胶囊 30px 高：点击区只上下扩到 44px（左右扩会压住隔壁那天）。
     上 7px / 下 9px（从 1px 边框里面算）刚好落在日期栏的内边距里，不会让它多出竖向滚动 */
  .day-pill { position: relative; }
  .day-pill::after { content: ""; position: absolute; inset: -7px 0 -9px; }
  .day-pill .dp-tag {
    font-size: 11px;
    font-weight: 600;
  }
  .day-pill.active {
    background: var(--ai);
    color: var(--on-ai);
    border-color: var(--ai);
    box-shadow: 0 2px 8px rgba(28, 53, 83, 0.25);
  }
  .d8-opt-btn small { font-size: 11px; font-weight: 600; }

  /* ── Main Layout Container ── */
  .content-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 12px 14px;
  }

  /* ── Map Container ── */
  .map-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .map-card.collapsed {
    display: none;
  }
  .map-header {
    padding: 8px 14px;
    background: var(--paper);
    border-bottom: 1px solid var(--grid);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    gap: 8px;
  }
  .map-actions {
    display: flex;
    flex: 1;
    gap: 6px;
    align-items: center;
  }
  .map-actions > a { margin-left: auto; }
  .route-toggle-btn {
    position: relative;
    border: 1px solid var(--grid);
    background: var(--card-bg);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), scale .1s var(--ease);
  }
  .route-toggle-btn.active {
    background: var(--ai);
    color: var(--on-ai);
    border-color: var(--ai);
  }
  .map-link-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--shu-ink);
    text-decoration: none;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--shu-soft);
    transition: scale .1s var(--ease);
  }
  .map-link-btn:active { scale: .96; }
  #map {
    width: 100%;
    height: 270px;
    background: var(--map-bg);
  }
  @media (min-width: 640px) {
    #map { height: 340px; }
  }
  /* 地图载入失败（没网、key 被拒、当日额度用完）：收成一行提示，别留一个空框占半个屏幕 */
  .map-off #map { height: auto; background: none; }
  .map-off .route-toggle-btn { display: none; }
  .map-fail { margin: 0; padding: 10px 16px 12px; font-size: 13px; line-height: 1.6; color: var(--muted); text-wrap: pretty; }


  /* ── Day Summary Header Card ── */
  
  /* Day 8 Tri-Option Switcher Pills */
  .day8-switcher {
    display: flex;
    gap: 6px;
    background: var(--chip-bg-2);
    padding: 3px;
    border-radius: 17px;
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .day8-switcher::-webkit-scrollbar { display: none; }
  .d8-opt-btn {
    flex: 1 1 0;
    min-width: 0;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    padding: 5px 4px;
    border-radius: 14px;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), scale .1s var(--ease);
    white-space: nowrap;
    text-align: center;
  }
  .d8-opt-btn.active {
    background: var(--ai);
    color: var(--on-ai);
    box-shadow: 0 2px 8px rgba(28, 53, 83, 0.25);
  }

  .day-hero-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .hero-pacing {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--chip-bg);
    color: var(--muted);
  }
  .hero-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 6px;
    text-wrap: balance;
  }
  /* 下一站：卡片内边距 14px，圆角 16 - 6 ≈ 10px 保持同心 */
  .hero-next {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; min-height: 44px; margin: 4px 0 8px; padding: 8px 12px;
    border: 0; border-radius: 10px; background: var(--chip-bg); color: var(--ink);
    font: inherit; text-align: left; cursor: pointer;
    transition: scale .1s var(--ease), background-color .15s var(--ease);
  }
  .hero-next[hidden] { display: none; }
  .hero-next:active { scale: .98; } /* 整行宽的条，.96 缩得太明显，和 .node-card 的 .99 同理 */
  .hero-next:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .hn-when {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; color: var(--shu-ink);
    font-variant-numeric: tabular-nums;
  }
  .hn-when .ph { width: 1.2em; height: 1.2em; }
  .hn-what {
    font-size: 14px; font-weight: 700; line-height: 1.4;
    font-variant-numeric: tabular-nums; text-wrap: pretty;
  }
  /* 概要默认收起：路线已在标题里，逐站细节在下面的时间轴 */
  .hero-more > summary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    margin: -6px 0 -8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ai);
    cursor: pointer;
    list-style: none;
  }
  .hero-more > summary::-webkit-details-marker { display: none; }
  .hero-more > summary::after {
    content: "";
    width: 6px; height: 6px;
    border: solid currentColor;
    border-width: 0 1.5px 1.5px 0;
    rotate: 45deg;
    translate: 0 -.15em;
    transition: rotate .2s var(--ease), translate .2s var(--ease);
  }
  .hero-more[open] > summary::after { rotate: 225deg; translate: 0 .15em; }
  .hero-more > summary:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; border-radius: 4px; }
  .hero-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.65;
    padding-bottom: 4px;
    text-wrap: pretty;
  }
  .hero-transit {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 8px 12px;
    border-radius: 10px;
    margin: 4px 0 6px;
    width: 100%;
  }
  .hero-route-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 800;
    color: var(--ai);
    background: var(--ai-soft);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 99px;
    margin-top: 8px;
    transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  /* 分屏时地图卡已有「Google 路线」，这里只在「行程」视图出现 */
  body:not([data-view="time"]) .hero-route-link { display: none; }
  @media (hover: hover) {
    .hero-route-link:hover { background: var(--ai); color: var(--on-ai); }
  }

  /* ── Timeline Nodes ── */
  .timeline {
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    top: 14px;
    bottom: 14px;
    left: 11px;
    width: 2px;
    background: var(--grid);
    border-radius: 2px;
  }
  .node-item {
    position: relative;
    margin-bottom: 16px;
    cursor: pointer;
  }
  .node-dot {
    position: absolute;
    left: -28px;
    top: 14px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 2px solid var(--ai);
    color: var(--ai);
    padding: 0;
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    z-index: 2;
    transition: background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .node-dot:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  /* 圆点 24px：点击区扩到 44px，右边压进卡片 6px 无妨，点卡片也是「在地图上看这一站」 */
  .node-dot::after { content: ""; position: absolute; inset: 50% auto auto 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
  .node-item.hero .node-dot {
    border-color: var(--shu);
    color: var(--shu);
  }
  /* 选中 = 靛蓝；红色只留给「必看」(.hero)，两者要分得开 */
  .node-item.active .node-dot {
    background: var(--ai);
    border-color: var(--ai);
    color: var(--on-ai);
    transform: scale(1.15);
  }

  .node-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: scale .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .node-item.active .node-card {
    border-color: var(--ai);
    box-shadow: 0 4px 18px color-mix(in srgb, var(--ai) 15%, transparent);
  }
  .node-card:active {
    scale: .99;
  }

  .node-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 4px;
  }
  .time-badge {
    font-size: 12px;
    font-weight: 800;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: .02em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-variant-numeric: tabular-nums;
  }
  .ph { width: 1.2em; height: 1.2em; flex: none; }
  .nav-btn .ph { width: 1.25em; height: 1.25em; }
  a.tel { display: inline-flex; align-items: center; gap: 3px; color: var(--ai); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
  a.tel .ph { width: 1.1em; height: 1.1em; }
  .node-when {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    min-width: 0;
  }
  .node-tag {
    font-size: 12px;
    font-weight: 700;
    color: var(--ai);
    line-height: 1.4;
  }
  .node-item.hero .time-badge {
    color: var(--shu);
    background: var(--shu-soft);
  }

  .nav-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--on-ai);
    background: var(--ai);
    text-decoration: none;
    padding: 4px 9px;
    border-radius: 99px;
    flex-shrink: 0;
    transition: background-color .15s var(--ease), opacity .15s var(--ease), scale .1s var(--ease);
  }
  .nav-btn:active { scale: .96; }
  .back-btn::after, .view-btn::after, .theme-btn::after, .route-toggle-btn::after, .map-link-btn::after {
    content: ""; position: absolute; inset: 50% auto auto 50%;
    width: 44px; height: 44px; transform: translate(-50%, -50%);
  }
  /* 导航钮在可点的站点卡片里：只往上、左右扩，不压住下方站名（误触会跳出到 Google Maps）。
     往上 20px 凑满 44px 高：会伸出卡片顶 7px，落在两张卡片之间的空隙里 */
  .nav-btn::after { content: ""; position: absolute; inset: -20px -6px 0; }
  @media (hover: hover) { .nav-btn:hover { opacity: .9; } }
  .node-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 4px;
    text-wrap: balance;
  }
  .node-name-sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 6px;
    text-wrap: pretty;
    font-variant-numeric: tabular-nums;
  }
  /* 一站 = 站名 + 几条要点（永远看得到，一条一行）+ 收起的详情 */
  .node-key,
  .node-more ul {
    list-style: none;
    margin: 0 0 2px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    text-wrap: pretty;
    overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
  }
  .node-key li,
  .node-more li {
    position: relative;
    padding-left: 14px;
  }
  .node-key li::before,
  .node-more li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: .68em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
  }
  /* 注意事项：墨色粗体 + 金色荧光笔底线，和手册一致。红色只留给「今天」和「必看」 */
  .node-key li.kw { color: var(--ink); font-weight: 700; }
  .node-key li.kw::before { background: var(--kin); }
  .node-key li.kw > span {
    background: linear-gradient(transparent 58%, color-mix(in srgb, var(--kin) 26%, transparent) 0);

  }


  /* ── 小动效：用 Phosphor 同一图标的不同字重表达状态，形状不变只换墨量 ──
     电脑（能悬停）：悬停一站，交通图标浮出 Duotone 底色；导航箭头往右上探一下；日落图标的太阳先沉下去给你看。
     手机（点按）：按住时同样浮出底色；「现在」那一站的圆点慢慢呼吸；换天时太阳从高处落到此刻的位置。

  .ph-tone { opacity: 0; }

  .node-item.is-now .time-badge .ph-tone { opacity: .25; }

// Route Mode: true = Real Road Curves (贴合真实道路), false = Clean Straight Lines
let showRealRoadRoute = true;
const routeCache = {};

function toggleRouteMode() {
  showRealRoadRoute = !showRealRoadRoute;
  const btn = document.getElementById('btnRouteToggle');
  if (btn) {
    btn.classList.toggle('active', showRealRoadRoute);
    btn.setAttribute('aria-pressed', String(showRealRoadRoute)); // 关掉＝直线连站
  }
  const day = DAYS[currentDayIdx];
  renderRoutePolyline(day);
}

// Compact Polyline Decoder
function decodePolyline(encoded) {
  const points = [];
  let index = 0, len = encoded.length;
  let lat = 0, lng = 0;
  while (index < len) {
    let b, shift = 0, result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lat += dlat;
    shift = 0;
    result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lng += dlng;
    points.push([lat * 1e-5, lng * 1e-5]);
  }
  return points;
}

function drawRealCurvedRoute(coords, color, isDrive) {
  // Glow casing line
  const casing = makePolyline(coords, {
    color: color,
    weight: isDrive ? 8 : 6,
    opacity: 0.22,
    lineCap: 'round',
    lineJoin: 'round'
  });
  // Core crisp line
  const core = makePolyline(coords, {
    color: color,
    weight: isDrive ? 4 : 3,
    opacity: 0.9,
    lineCap: 'round',
    lineJoin: 'round'
  });
  polylineLayer.addLayer(casing);
  polylineLayer.addLayer(core);
}

async function renderRoutePolyline(day) {
  if (!polylineLayer) return;
  polylineLayer.clearLayers();
  
  const latlngs = day.nodes.map(n => [n.lat, n.lng]);
  if (latlngs.length < 2) {
    return;
  }

  const isDrive = (day.day === 'D4' || day.day === 'D5');
  const isNature = isDrive;
  const themeColor = isNature ? cssVar('--matcha') : (isDrive ? cssVar('--ai') : cssVar('--shu'));

  if (!showRealRoadRoute) {
    // Straight line mode
    const straightLine = makePolyline(latlngs, {
      color: themeColor,
      weight: 3.5,
      opacity: 0.65,
      dashArray: '5, 8'
    });
    polylineLayer.addLayer(straightLine);
    return;
  }

  // Real Road Mode:
  // 1. Check prebaked cache first (0ms instant)
  if (PREBAKED_ROUTES[day.day]) {
    const data = PREBAKED_ROUTES[day.day];
    const coords = decodePolyline(data.encoded);
    drawRealCurvedRoute(coords, themeColor, isDrive);
    return;
  }

  // 2. Check dynamic memory cache
  if (routeCache[day.day]) {
    const data = routeCache[day.day];
    drawRealCurvedRoute(data.coords, themeColor, isDrive);
    return;
  }

  // 3. Fallback transit/straight line immediately
  const tempLine = makePolyline(latlngs, {
    color: themeColor,
    weight: 3.5,
    opacity: 0.65,
    dashArray: day.day === 'D10' ? '8, 12' : '5, 8'
  });
  polylineLayer.addLayer(tempLine);

  // For D1 (Skyliner) and D10 (Flights), transit line is optimal
  if (day.day === 'D1' || day.day === 'D10') return;

  // 4. Dynamic query OSRM for any uncached days
  try {
    const profile = isDrive ? 'driving' : 'walking';
    const coordsStr = day.nodes.map(n => `${n.lng.toFixed(5)},${n.lat.toFixed(5)}`).join(';');
    const res = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${coordsStr}?overview=full&geometries=geojson`);
    const json = await res.json();
    if (json.code === 'Ok' && json.routes && json.routes[0]) {
      const r = json.routes[0];
      const realCoords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      // 只画线不报数：预存路线与 OSRM 都按车速算，公里和分钟对步行/电车日都不准
      routeCache[day.day] = { coords: realCoords };

      if (DAYS[currentDayIdx].day === day.day && showRealRoadRoute) {
        polylineLayer.clearLayers();
        drawRealCurvedRoute(realCoords, themeColor, isDrive);
      }
    }
  } catch (e) {
    // Offline or network error - keep straight line
  }
}

// Map & Interaction Engine

let map = null;

// 现在几点：网址加 ?now=2026-10-10T16:50 可以假装是那个时刻，出发前预览「现在」和日落倒数
const NOW_OVERRIDE = (() => {
  const m = /[?&]now=([\d\-T:]+)/.exec(location.search);
  return m ? new Date(m[1]) - Date.now() : 0;
})();
function nowDate() { return new Date(Date.now() + NOW_OVERRIDE); }
function nowMins() { const n = nowDate(); return n.getHours() * 60 + n.getMinutes(); }
function hhmm(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }

// 行程当天：没带日期打开（例如底栏「地图」）就停在今天
function isToday(day) {
  const now = nowDate();
  const [m, d] = day.date.split('/').map(Number);
  return now.getFullYear() === 2026 && now.getMonth() + 1 === m && now.getDate() === d;
}
function todayIdx() {
  const i = DAYS.findIndex(isToday);
  return i < 0 ? 0 : i;
}

function getDayIdxFromHash() {
  const hash = window.location.hash.toLowerCase().replace('#', '');
  if (!hash) return todayIdx();
  const match = hash.match(/\d+/);
  if (match) {
    const num = parseInt(match[0], 10);
    if (num >= 1 && num <= DAYS.length) return num - 1;
  }
  return 0;
}

function initApp() {
  renderDayPills();
  const initIdx = getDayIdxFromHash();
  selectDay(initIdx, false);
  // 首屏画完才开动效：打开页面时不播，之后换天、换站才有过渡
  requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.dataset.motion = 'ready'; }));

  window.addEventListener('hashchange', () => {
    const idx = getDayIdxFromHash();
    if (idx !== currentDayIdx) {
      selectDay(idx, false);
    }
  });
}

// Small stand-in for Leaflet's layer group: holds overlays so a day switch can clear them
function makeLayerGroup() {
  const items = [];
  return {
    addLayer(o) { o.setMap(map); items.push(o); },
    clearLayers() { items.forEach(o => o.setMap(null)); items.length = 0; }
  };
}

// latlngs are [lat, lng] pairs; opts use the old Leaflet names (color, weight, opacity, dashArray)
function makePolyline(latlngs, opts) {
  const path = latlngs.map(([lat, lng]) => ({ lat, lng }));
  if (opts.dashArray) {
    const [dash, gap] = opts.dashArray.split(',').map(Number);
    return new google.maps.Polyline({
      path,
      strokeOpacity: 0,
      icons: [{
        icon: { path: 'M 0,-1 0,1', strokeColor: opts.color, strokeOpacity: opts.opacity, scale: opts.weight },
        offset: '0',
        repeat: `${(dash + gap) * 1.5}px`
      }]
    });
  }
  return new google.maps.Polyline({
    path,
    strokeColor: opts.color,
    strokeWeight: opts.weight,
    strokeOpacity: opts.opacity
  });
}

// 「当前站」：看的是今天就按钟点找已开始的最后一站，否则第一站
function scrollToCurrentNode() {
  const day = DAYS[currentDayIdx];
  if (!day.nodes.length) return;
  let idx = 0;
  if (isToday(day)) {
    const mins = nowMins();
    day.nodes.forEach((n, i) => {
      const t = /^(\d{1,2}):(\d{2})/.exec(n.time);
      if (t && +t[1] * 60 + +t[2] <= mins) idx = i;
    });
  }
  focusNode(idx);
}

// 「下一站」：只在行程当天出现，指向下一个还没开始的站，点一下跳过去
function nodeStartMins(n) {
  const t = /^(\d{1,2}):(\d{2})/.exec(n.time);
  return t ? +t[1] * 60 + +t[2] : null;
}
function updateNextStop() {
  const el = document.getElementById('heroNext');
  if (!el) return;
  const day = DAYS[currentDayIdx];
  const mins = nowMins();
  const i = isToday(day) ? day.nodes.findIndex(n => nodeStartMins(n) > mins) : -1;
  if (i < 0) { el.hidden = true; return; }
  const n = day.nodes[i];
  const diff = nodeStartMins(n) - mins;
  const when = diff < 60 ? `${diff} 分钟后` : (diff % 60 ? `${Math.floor(diff / 60)} 小时 ${diff % 60} 分后` : `${diff / 60} 小时后`);
  el.innerHTML = `<span class="hn-when">${n.mode ? ph(n.mode, PH_LABEL[n.mode]) : ''}下一站 · ${when}</span><span class="hn-what">${n.time.slice(0, 5)} ${n.title}</span>`;
  el.onclick = () => focusNode(i);
  el.hidden = false;
}
// 「现在」这一站：当天、且现在落在这一站的时间段里（没写结束时间就到下一站开始）
function markNow() {
  const day = DAYS[currentDayIdx];
  const items = document.querySelectorAll('#timelineList .node-item');
  let cur = -1;
  if (isToday(day)) {
    const mins = nowMins();
    day.nodes.forEach((n, i) => {
      const start = hhmm(n.time);
      const endM = /[-–]\s*(\d{1,2}:\d{2})/.exec(n.time);
      const next = day.nodes[i + 1] ? hhmm(day.nodes[i + 1].time) : null;
      const end = endM ? hhmm(endM[1]) : (next ?? start + 60);
      if (start != null && mins >= start && mins < end) cur = i;
    });
  }
  items.forEach((el, i) => {
    const on = i === cur;
    if (el.classList.contains('is-now') === on) return;
    el.classList.toggle('is-now', on);
    const when = el.querySelector('.node-when');
    const tag = el.querySelector('.now-tag');
    if (on && !tag) when.insertAdjacentHTML('beforeend', '<span class="now-tag">现在</span>');
    if (!on && tag) tag.remove();
  });
}

// 日落／日出小图标：太阳按时间一点点沉下地平线（日出反过来），离得越近颜色越暖；
// 不是当天就停在半露的样子，只显示时刻
const SUN_SVG = `<svg class="sun-ico" viewBox="0 0 256 256" aria-hidden="true">
  <g clip-path="url(#sun-clip)"><g class="sun-disc"><circle class="sun-tone" cx="128" cy="144" r="56"/><circle cx="128" cy="144" r="56"/></g></g>
  <g class="sun-rays"><path d="M80,40l8,16M176,40l-8,16M24,96l16,8M232,96l-16,8"/></g>
  <path d="M16,160H240M48,200H208"/></svg>`;
function sunState(sun, today, mins) {
  const at = hhmm(sun.at);
  if (!today) return { y: 0, w: 0, txt: `${sun.zh} ${sun.at}` };
  const d = mins - at;
  const up = -40, down = 64;
  let y, txt;
  const left = m => m < 60 ? `${m} 分` : `${Math.floor(m / 60)} 小时${m % 60 ? ` ${m % 60} 分` : ''}`;
  if (sun.kind === 'set') {
    y = d <= -180 ? up : d <= 0 ? up * (-d / 180) : Math.min(down, down * d / 20);
    txt = d < -180 ? `${sun.zh} ${sun.at}` : d < 0 ? `${sun.zh}还有 ${left(-d)}` : d < 40 ? '余晖中' : `已${sun.zh} ${sun.at}`;
  } else {
    y = d <= -20 ? down : d <= 0 ? down * (-d / 20) : Math.max(up, up * d / 180);
    txt = d < -180 ? `${sun.zh} ${sun.at}` : d < 0 ? `${sun.zh}还有 ${left(-d)}` : d < 30 ? '日出中' : `${sun.zh} ${sun.at}`;
  }
  // 暖度：日落前一小时从金色渐到朱色；日出后一小时从朱色退回金色
  const w = sun.kind === 'set' ? (d < -60 ? 0 : d < 0 ? (60 + d) / 60 : 1) : (d < 0 ? 1 : d < 60 ? 1 - d / 60 : 0);
  return { y, w, txt };
}
function updateSun(settle) {
  const day = DAYS[currentDayIdx];
  const today = isToday(day), mins = nowMins();
  document.querySelectorAll('#timelineList .sun-chip').forEach(chip => {
    const st = sunState(day.nodes[+chip.dataset.node].sun, today, mins);
    const apply = () => {
      chip.style.setProperty('--sun-y', st.y.toFixed(1));
      chip.style.setProperty('--sun-w', st.w.toFixed(2));
    };
    chip.querySelector('.sun-txt').textContent = st.txt;
    // 换天时太阳从高处落到现在的位置（只在首屏之后）
    if (settle && document.documentElement.dataset.motion === 'ready') {
      chip.style.setProperty('--sun-y', -40); chip.style.setProperty('--sun-w', 0);
      requestAnimationFrame(() => requestAnimationFrame(apply));
    } else apply();
  });
}

function tick() { updateNextStop(); markNow(); updateSun(false); }
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

function setViewMode(mode) {
  currentViewMode = mode;
  document.body.dataset.view = mode;
  ['split', 'time', 'map'].forEach(m => document.getElementById('btn-' + m).setAttribute('aria-pressed', String(m === mode)));
  document.getElementById('btn-split').classList.toggle('active', mode === 'split');
  document.getElementById('btn-time').classList.toggle('active', mode === 'time');
  document.getElementById('btn-map').classList.toggle('active', mode === 'map');

  const mapCard = document.getElementById('mapCard');
  const heroCard = document.getElementById('dayHero');
  const timelineList = document.getElementById('timelineList');
  const mapElem = document.getElementById('map');

  if (mode === 'time') {
    mapCard.classList.add('collapsed');
    heroCard.style.display = 'block';
    timelineList.style.display = 'block';
  } else if (mode === 'map') {
    mapCard.classList.remove('collapsed');
    heroCard.style.display = 'none';
    timelineList.style.display = 'none';
    // 填到底栏上沿为止，不被底栏盖住
    const bar = document.querySelector('.tabbar');
    const covered = bar ? window.innerHeight - bar.getBoundingClientRect().top : 0;
    const top = mapElem.getBoundingClientRect().top + window.scrollY;
    mapElem.style.height = Math.max(270, window.innerHeight - top - covered - 12) + 'px';
  } else {
    // split
    mapCard.classList.remove('collapsed');
    heroCard.style.display = 'block';
    timelineList.style.display = 'block';
    mapElem.style.height = (window.innerWidth >= 640) ? '340px' : '270px';
  }
}

// 转屏或窗口大小变了：地图高度按当前视图重算（地图视图要贴着底栏上沿）
let resizeFrame = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => setViewMode(currentViewMode));
});

document.addEventListener('DOMContentLoaded', initApp);
</script>
