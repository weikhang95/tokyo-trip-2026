// 点餐卡：原生 <dialog>，自带 Esc 关闭、背景不能点、焦点留在里面；关掉后焦点回到按钮
// 菜和短句都能点开放大给店员看；「…をお願いします」的菜可以加减份数，日文、中文里的数字跟着变
// 日文小字注音：数据里写 {漢字|かな}，显示成汉字上面一行假名；「2つ」「1皿」这种数量也标上念法
const COUNTER_READ = {
  'つ': ['', 'ひとつ', 'ふたつ', 'みっつ', 'よっつ', 'いつつ', 'むっつ', 'ななつ', 'やっつ', 'ここのつ'],
  '皿': ['', 'ひとさら', 'ふたさら', 'さんさら', 'よんさら', 'ごさら', 'ろくさら', 'ななさら', 'はちさら', 'きゅうさら']
};
function rb(jp) {
  return jp
    .replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>')
    .replace(/([1-9])(つ|皿)/g, (m, n, u) => `<ruby>${m}<rt>${COUNTER_READ[u][n]}</rt></ruby>`);
}
function qtyParts(jp) {
  const m = /^(.*?を)\s*(?:(\d+)\s*(つ|皿)\s*)?(お(?:\{願\|ねが\}|願)いします。?)$/.exec(jp);
  return m && { head: m[1], n: +(m[2] || 1), unit: m[3] || 'つ', tail: m[4], plain: !m[2] };
}
// 听念法：手机自带的日语语音（iPhone 离线也能念）；念的是注音的假名，不会把汉字念错
const CAN_SAY = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function kana(jp) {
  return jp.replace(/<[^>]+>/g, '')
    .replace(/\{([^|}]+)\|([^}]+)\}/g, '$2')
    .replace(/([1-9])(つ|皿)/g, (m, n, u) => COUNTER_READ[u][n]);
}
function sayJa(jp, rate = .85) {
  if (!CAN_SAY) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(kana(jp));
  u.lang = 'ja-JP'; u.rate = rate;
  const v = speechSynthesis.getVoices().find(x => /^ja/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const sayBtn = (attr, what) => CAN_SAY ? `<button type="button" class="oc-say" ${attr} aria-label="听「${what}」的念法">${ph('speaker')}</button>` : '';
let ocWake = null;
function ocKeepAwake(on) {
  if (on && !ocWake && navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { ocWake = l; }).catch(() => {});
  if (!on && ocWake) { ocWake.release().catch(() => {}); ocWake = null; }
}
function openOrderCard(k, from) {
  const c = ORDER_CARDS[k], dlg = document.getElementById('orderCard');
  if (!c || !dlg.showModal) return;
  let big = null, back = null; // 放大的那一项：{ jp, zh, q: qtyParts, n, src }；back = 点开它的按钮
  const dishes = c.dishes || [];
  const phrases = c.sections ? c.sections.flatMap(x => x.phrases) : c.phrases;
  const hearSet = new Set();
  if (c.sections) { let k = 0; c.sections.forEach(x => x.phrases.forEach(() => { if (x.hear) hearSet.add(k); k++; })); }
  let pi = 0;
  const phRow = ([jp, zh, re]) => { const i = pi++; return `<div class="oc-row"><button type="button" class="oc-ph" data-ph="${i}"><b lang="ja">${rb(jp)}</b><span>${zh}</span>${re ? `<span class="oc-re"><i>你答</i><span lang="ja">${rb(re)}</span></span>` : ''}</button>${sayBtn(`data-say-ph="${i}"`, zh)}</div>`; };
  const body = c.sections
    ? c.sections.map(x => `<p class="oc-label">${x.label}</p><div class="oc-phrases">${x.phrases.map(phRow).join('')}</div>`).join('')
    : `<p class="oc-label">指给店员看 · 点一下放大</p>
      ${dishes.map((d, i) => `<div class="oc-row"><button type="button" class="oc-dish" data-dish="${i}"><span class="oc-jp" lang="ja">${rb(d.jp)}</span><span class="oc-zh">${d.zh}</span><span class="oc-meta"><span>${d.tip || ''}</span>${d.price ? `<span class="oc-price">${d.price}</span>` : ''}</span></button>${sayBtn(`data-say-dish="${i}"`, d.zh)}</div>`).join('')}
      <p class="oc-label">常用短句 · 点一下放大</p>
      <div class="oc-phrases">${phrases.map(phRow).join('')}</div>`;
  dlg.classList.remove('is-big');
  dlg.innerHTML = `<div class="oc-head"><h2 id="ocTitle">${c.title}</h2><button type="button" class="oc-x" data-close aria-label="关闭">${ph('close')}</button></div>
    <div class="oc-body">
      ${c.sections && CAN_SAY ? '<p class="oc-hint">每句都有注音。点喇叭听念法，跟着念几遍；点句子放大，给对方看。</p>' : ''}
      ${body}
    </div>
    <div class="oc-big"></div>`;
  const bigEl = dlg.querySelector('.oc-big');
  const drawBig = step => {
    const { jp, zh, q, n } = big;
    big.src = !q || (q.plain && n === 1) ? jp : `${q.head} <em>${n}${q.unit}</em> ${q.tail}`;
    const jpTxt = rb(big.src);
    const zhTxt = !q || n === q.n ? zh : /(一|\d+)\s*(份|个|杯|碗|盘)/.test(zh) ? zh.replace(/(一|\d+)\s*(份|个|杯|碗|盘)/, `${n}$2`) : `${zh}（${n} 份）`;
    if (step) { // 只改字和数字，焦点留在刚按的钮上
      bigEl.querySelector('b').innerHTML = jpTxt;
      bigEl.querySelector('.oc-big-zh').textContent = zhTxt;
      bigEl.querySelector('output').textContent = n;
      bigEl.querySelector('[data-step="-1"]').disabled = n <= 1;
      bigEl.querySelector('[data-step="1"]').disabled = n >= 9;
      return;
    }
    bigEl.innerHTML = `<b lang="ja">${jpTxt}</b><span class="oc-big-zh">${zhTxt}</span>
      ${CAN_SAY ? `<button type="button" class="oc-say is-big" data-say-big>${ph('speaker')}听念法</button>` : ''}
      ${q ? `<span class="oc-step" role="group" aria-label="份数"><button type="button" data-step="-1" aria-label="少一份"${n <= 1 ? ' disabled' : ''}>−</button><output aria-live="polite">${n}</output><button type="button" data-step="1" aria-label="多一份"${n >= 9 ? ' disabled' : ''}>＋</button></span>` : ''}
      <button type="button" class="oc-back" data-unbig>点一下回去</button>`;
  };
  const openBig = (item, from) => {
    big = item; back = from; drawBig();
    dlg.classList.add('is-big'); dlg.scrollTop = 0;
    bigEl.querySelector('[data-unbig]').focus({ preventScroll: true });
    ocKeepAwake(true); // 拿给店员看的时候屏幕别暗掉
  };
  dlg.onclick = e => {
    if (e.target === dlg || e.target.closest('[data-close]')) { dlg.close(); return; }
    const sy = e.target.closest('.oc-say');
    // 自己要说的念慢一点跟读；店员会说的用正常语速，练耳朵
    if (sy) { sayJa(sy.dataset.sayBig !== undefined ? big.src : sy.dataset.sayDish !== undefined ? dishes[+sy.dataset.sayDish].jp : phrases[+sy.dataset.sayPh][0], hearSet.has(sy.dataset.sayBig !== undefined ? big.i : +sy.dataset.sayPh) ? 1 : .85); return; }
    const d = e.target.closest('[data-dish]'), p = e.target.closest('[data-ph]'), st = e.target.closest('[data-step]');
    if (d) { const x = dishes[+d.dataset.dish], q = qtyParts(x.jp); openBig({ jp: x.jp, zh: x.zh, q, n: q ? q.n : 1 }, d); return; }
    if (p) { const [jp, zh] = phrases[+p.dataset.ph]; openBig({ jp, zh, q: null, n: 1, i: +p.dataset.ph }, p); return; }
    if (st) {
      big.n = Math.min(9, Math.max(1, big.n + +st.dataset.step)); drawBig(true);
      if (st.disabled) bigEl.querySelector('[data-step]:not(:disabled)').focus(); // 按到头，焦点换到另一颗
      return;
    }
    if (e.target.closest('.oc-step')) return;
    if (e.target.closest('.oc-big')) { dlg.classList.remove('is-big'); ocKeepAwake(false); back?.focus(); }
  };
  dlg.onclose = () => { ocKeepAwake(false); if (CAN_SAY) speechSynthesis.cancel(); from?.focus({ preventScroll: true }); };
  dlg.showModal();
  dlg.scrollTop = 0;
  dlg.querySelector('.oc-x').focus();
}

// 本章简报：目标、体力、歇脚、要带、彩蛋、下雨，最后是交通和概要。
// 出发前、当天第一站开始前是展开的（早上 30 秒看完）；走起来以后收成一行，让「下一站」在最上面
function briefHtml(day) {
  const rests = day.nodes.map((n, i) => n.rest ? `<button type="button" class="brief-go rest" data-go="${i}">${ph('armchair')}${n.short || n.title}<small>${n.rest}</small></button>` : '').join('');
  const eggList = day.nodes.flatMap((n, i) => (n.eggs || []).map(e => [i, e]));
  const eggs = eggList.map(([i, e]) => `<button type="button" class="brief-go" data-go="${i}">${ph('sparkle')}${e.t}</button>`).join('');
  const gear = (day.gear || []).map(g => `<li>${g}</li>`).join('');
  const rows = [
    ['目标', `<span class="brief-goal">${day.goal}</span>`],
    ['体力', `${stamina(day.intensity)}${day.intensity}`],
    rests && ['歇脚', `<div class="brief-links">${rests}</div>`],
    gear && ['要带', `<ul class="gear">${gear}</ul>`],
    eggs && ['彩蛋', `<div class="brief-links">${eggs}</div>`],
    day.rain && ['下雨', `${day.rain.sum} <button type="button" class="brief-go" data-rain>${ph('umbrella')}雨天攻略</button>`]
  ].filter(Boolean);
  const peek = [gear && `要带 ${day.gear.length} 样`, eggList.length && `彩蛋 ${eggList.length}`, day.rain && '雨天攻略'].filter(Boolean).join(' · ');
  const open = !(isToday(day) && nowMins() >= nodeStartMins(day.nodes[0]));
  return `<details class="brief"${open ? ' open' : ''}><summary>本章简报<span class="brief-peek">${peek}</span></summary>
    <dl class="brief-list">${rows.map(([t, d]) => `<div class="bl-row"><dt>${t}</dt><dd>${d}</dd></div>`).join('')}</dl>
    ${Array.isArray(day.desc) ? `<ul class="hero-desc">${day.desc.map(x => `<li>${x}</li>`).join('')}</ul>` : `<p class="hero-desc">${day.desc}</p>`}
    ${Array.isArray(day.transit) ? `<ol class="hero-transit">${day.transit.map(x => `<li>${x}</li>`).join('')}</ol>` : `<div class="hero-transit">${day.transit}</div>`}
  </details>`;
}
// 路线条：每站一个分类图标 ＋ 短名 ＋ 钟点；走过的变灰、现在的实心靛蓝，点了跳到那一站
function stripHtml(day) {
  return `<nav class="route-strip" aria-label="本章路线 · ${day.nodes.length} 站"><ol>${day.nodes.map((n, i) => `<li class="rs-stop${n.hero ? ' hero' : ''}${n.rest ? ' rest' : ''}"><button type="button" class="rs-btn" data-go="${i}" aria-label="第 ${i + 1} 站 · ${n.time.slice(0, 5)} ${n.title || n.name}${n.rest ? ' · 歇脚' : ''}"><span class="rs-ico">${nodeCatIcon(n)}</span><span class="rs-name">${n.short || ''}</span><span class="rs-time">${n.time.slice(0, 5)}</span></button></li>`).join('')}</ol></nav>`;
}
// 当天打开：路线条滚到「现在」那一站
function centerStrip() {
  const strip = document.querySelector('#dayHero .route-strip');
  const cur = strip && (strip.querySelector('.is-now') || [...strip.querySelectorAll('.rs-stop:not(.is-past)')][0]);
  if (strip) strip.scrollLeft = cur && isToday(DAYS[currentDayIdx]) ? Math.max(0, cur.offsetLeft - strip.clientWidth / 2 + cur.offsetWidth / 2) : 0;
  if (strip) edgeFade(strip);
}
// 横滑的两排：滑到头的那一边不淡出（配合 CSS 的 data-edge）
function edgeFade(row) {
  const max = row.scrollWidth - row.clientWidth;
  row.dataset.edge = [row.scrollLeft <= 1 && 'start', row.scrollLeft >= max - 1 && 'end'].filter(Boolean).join(' ');
}
document.addEventListener('scroll', e => { if (e.target.matches?.('.day-scroll, .route-strip')) edgeFade(e.target); }, { capture: true, passive: true });
function renderRain(day) {
  const el = document.getElementById('rainCard');
  if (!day.rain) { el.hidden = true; el.innerHTML = ''; return; }
  el.open = false;
  el.innerHTML = `<summary>${ph('umbrella')}<span><b>雨天攻略</b><span>${day.rain.sum}</span></span></summary>
    <div class="rain-body">${day.rain.tiers.map(t => `<h3>${t.t}</h3><ul>${t.d.map(x => `<li>${x}</li>`).join('')}</ul>`).join('')}</div>`;
  el.hidden = false;
  if (window.TripDetails) TripDetails.decorate(el);
}
// 章末：第 N 章 · 完，今天走了多少步，接下一章（带插画）；最后一章写「全书完」
function renderChEnd(idx) {
  const el = document.getElementById('chEnd');
  const day = DAYS[idx], next = DAYS[idx + 1], prev = DAYS[idx - 1];
  const steps = /约 [\d,–]+ 步/.exec(day.intensity || '');
  const nextHtml = next
    ? `<button type="button" class="ch-next" data-ch="${idx + 1}">
        <span class="ch-next-art"><img src="img/illo/day-${idx + 2}.svg" alt="" loading="lazy" decoding="async"></span>
        <span class="ch-next-body"><span class="ch-next-k">下一章 · ${dayDate(next)}</span><span class="ch-next-n">${chNo(idx + 1)} ${next.chapter}</span><span class="ch-next-t">${next.nodes[0].time.slice(0, 5)} 出发 · ${next.goal}</span></span>
        ${ph('caretR')}
      </button>`
    : `<p class="ch-fin">全书完 · 一路平安</p>`;
  el.innerHTML = `<p class="ch-end-mark">${chNo(idx)} · 完</p>
    ${steps ? `<p class="ch-end-sum">这一章${steps[0]}</p>` : ''}
    ${nextHtml}
    <div class="ch-nav">
      <button type="button" data-ch="${idx - 1}"${prev ? '' : ' hidden'}>${ph('caretL')}${prev ? `${chNo(idx - 1)} ${prev.chapter}` : ''}</button>
      <button type="button" data-toc>${ph('list')}目录</button>
    </div>`;
}

// 每站一个分类图标（吃、走、买、看…），规则在 cat-icons.js；节点写了 cat 就用它，其次看交通方式
function nodeCatIcon(node) {
  if (!window.CatIcons) return node.mode ? ph(node.mode, PH_LABEL[node.mode]) : '';
  const segs = (node.tags || []).flatMap(t => t.split(/\s*·\s*/)).concat([node.title || node.name]);
  const cat = node.cat || CatIcons.classify(segs, node.mode);
  return CatIcons.svg(cat, 'ph', node.icon || CatIcons.glyph(segs, cat));
}

function renderTimeline(day) {
  const list = document.getElementById('timelineList');
  list.innerHTML = '';

  day.nodes.forEach((node, nIdx) => {
    const item = document.createElement('article');
    item.className = `node-item ${node.hero ? 'hero' : ''}`;
    item.id = `node-${nIdx}`;
    
    // Google Maps Navigation Deep Link
    const gmapsNavUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(node.name + ' ' + (node.sub || ''))}`;

    // key（要点，一条一行；"!" 开头 = 警示）+ more（收起的详情）+ 最多 2 个纯文字 tag
    const keyHtml = `<ul class="node-key">${node.key.map(f => f.startsWith('!') ? `<li class="kw"><span>${f.slice(1)}</span></li>` : `<li>${f}</li>`).join('')}</ul>`;
    const moreHtml = node.more && node.more.length
      ? `<details class="node-more"><summary>详情 · ${node.more.length} 条</summary><ul>${node.more.map(li => `<li>${li}</li>`).join('')}</ul></details>`
      : '';
    const tagHtml = (node.tags || []).map(t => `<span class="node-tag">${t}</span>`).join('')
      + (node.rest ? `<span class="rest-chip">${ph('armchair')}${node.rest}</span>` : '');
    // 分支：「如果…就…」一眼看到，不埋在详情里
    const branchHtml = (node.branch || []).map(b => `<div class="branch"><p class="br-q">${ph('signpost')}${b.q || '临时有变'}</p><ul>${b.opts.map(([k, v]) => `<li><span class="br-if">${k}</span><span>${v}</span></li>`).join('')}</ul></div>`).join('');
    const eggHtml = (node.eggs || []).map(e => `<p class="egg">${ph('sparkle')}<span><b>彩蛋 · ${e.t}</b>${e.d ? `：${e.d}` : ''}</span></p>`).join('');
    const cardHtml = (node.cards || []).filter(k => ORDER_CARDS[k]).length
      ? `<div class="card-btns">${node.cards.filter(k => ORDER_CARDS[k]).map(k => `<button type="button" class="card-btn" data-card="${k}" aria-haspopup="dialog">${ph('chat')}点餐卡 · ${ORDER_CARDS[k].btn}</button>`).join('')}</div>`
      : '';

    item.innerHTML = `
      <button type="button" class="node-dot" aria-label="在地图上看第 ${nIdx + 1} 站">${nIdx + 1}</button>
      <div class="node-card">
        <div class="node-top">
          <span class="node-when"><span class="time-badge">${nodeCatIcon(node)}${String(node.time).replace(/\s*-\s*/, '–')}</span>${tagHtml}${node.sun ? `<span class="sun-chip" data-kind="${node.sun.kind}" data-node="${nIdx}">${SUN_SVG}<span class="sun-txt"></span></span>` : ''}</span>
          <a href="${gmapsNavUrl}" target="_blank" class="nav-btn" title="在 Google Maps 中导航">${ph('nav')}导航</a>
        </div>
        <h2 class="node-name">${node.title || node.name}</h2>
        <div class="node-name-sub">${String(node.sub || '').replace(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/g, '$1–$2')}</div>
        ${keyHtml}
        ${branchHtml}
        ${eggHtml}
        ${cardHtml}
        ${moreHtml}
      </div>
    `;

    // Click card to highlight and center map
    item.onclick = (e) => {
      const cb = e.target.closest('.card-btn');
      if (cb) { openOrderCard(cb.dataset.card, cb); return; }
      if (e.target.closest('.nav-btn, .node-more')) return; // Allow normal link click; 详情展开不移动地图
      focusNode(nIdx);
    };

    list.appendChild(item);
  });
  foldDone(day, list);
  if (window.TripDetails) TripDetails.decorate(list);
  markNow();
  updateSun(true);
}

let mapMarkers = [];

function updateMap(day) {
  if (!map) return;
  markersLayer.clearLayers();
  polylineLayer.clearLayers();
  infoWindow.close();
  mapMarkers = [];

  const latlngs = [];

  day.nodes.forEach((node, nIdx) => {
    latlngs.push([node.lat, node.lng]);

    // Custom numbered pin
    const pinColor = node.hero ? cssVar('--shu') : (day.day === 'D4' || day.day === 'D5' ? cssVar('--matcha') : cssVar('--ai'));

    const gmapsNavUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(node.name + ' ' + (node.sub || ''))}`;

    const marker = new google.maps.Marker({
      position: { lat: node.lat, lng: node.lng },
      label: { text: String(nIdx + 1), color: cssVar('--on-ai'), fontSize: '12px', fontWeight: '800' },
      icon: {
        path: PIN_PATH,
        fillColor: pinColor,
        fillOpacity: 1,
        strokeColor: cssVar('--pin-ring'),
        strokeWeight: 2,
        anchor: new google.maps.Point(13, 30),
        labelOrigin: new google.maps.Point(13, 13)
      },
      title: `${nIdx + 1} ${node.title || node.name}`,
      zIndex: nIdx
    });
    marker.popupHtml = `
        <div style="font-family:'Inter','Noto Sans SC',sans-serif; min-width:160px;">
          <div style="font-size:11px; font-weight:800; color:var(--shu); margin-bottom:2px; font-variant-numeric:tabular-nums;">${String(node.time).replace(/\s*-\s*/, '–')} · 第 ${nIdx + 1} 站</div>
          <div style="font-size:14px; font-weight:800; color:var(--ink); margin-bottom:4px;">${node.title || node.name}</div>
          <div style="font-size:12px; color:var(--muted); margin-bottom:6px; font-variant-numeric:tabular-nums;">${node.sub}</div>
          <a href="${gmapsNavUrl}" target="_blank" style="display:inline-flex; align-items:center; min-height:44px; font-size:12px; font-weight:700; color:var(--on-ai); background:var(--ai); text-decoration:none; padding:0 14px; border-radius:99px;">Google Maps 导航 ↗</a>
        </div>
      `;

    marker.addListener('click', () => {
      openStopInfo(marker);
      highlightNodeCard(nIdx);
    });

    markersLayer.addLayer(marker);
    mapMarkers.push(marker);
  });

  // Render intelligent polyline (real road curves or straight fallback)
  renderRoutePolyline(day);

  // Auto fit bounds with padding
  if (latlngs.length === 1) {
    map.setCenter({ lat: latlngs[0][0], lng: latlngs[0][1] });
    map.setZoom(15);
  } else if (latlngs.length > 1) {
    const bounds = new google.maps.LatLngBounds();
    latlngs.forEach(([lat, lng]) => bounds.extend({ lat, lng }));
    map.fitBounds(bounds, 40);
    google.maps.event.addListenerOnce(map, 'idle', () => {
      if (map.getZoom() > 15) map.setZoom(15);
    });
  }
}

function focusNode(idx) {
  highlightNodeCard(idx);
  if (map && mapMarkers[idx]) {
    const marker = mapMarkers[idx];
    map.panTo(marker.getPosition());
    map.setZoom(Math.max(map.getZoom(), 14));
    openStopInfo(marker);
  }
}

function highlightNodeCard(idx) {
  if (document.getElementById(`node-${idx}`)?.classList.contains('is-folded')) unfoldDone();
  document.querySelectorAll('.node-item').forEach((card, i) => {
    card.classList.toggle('active', i === idx);
  });
  const activeCard = document.getElementById(`node-${idx}`);
  if (activeCard) {
    activeCard.scrollIntoView({ behavior: scrollBehavior(), block: 'center' });
  }
}

// 「当前站」：看的是今天就按钟点找已开始的最后一站，否则第一站
function scrollToCurrentNode() {
  const day = DAYS[currentDayIdx];
  if (!day.nodes.length) return;
  let idx = 0;
  if (isToday(day)) {
    const mins = nowMins();
    day.nodes.forEach((n, i) => {
      const t = /^(\d{1,2}):(\d{2})/.exec(n.time);
      if (t && +t[1] * 60 + +t[2] <= mins) idx = i;
    });
  }
  focusNode(idx);
}

// 「下一站」：只在行程当天出现，指向下一个还没开始的站，点一下跳过去
function nodeStartMins(n) {
  const t = /^(\d{1,2}):(\d{2})/.exec(n.time);
  return t ? +t[1] * 60 + +t[2] : null;
}
function updateNextStop() {
  const el = document.getElementById('heroNext');
  if (!el) return;
  const day = DAYS[currentDayIdx];
  const mins = nowMins();
  const i = isToday(day) ? day.nodes.findIndex(n => nodeStartMins(n) > mins) : -1;
  if (i < 0) {
    // 今天收工：最后一站也结束了，告诉你明天几点出门、第一站去哪
    const last = day.nodes.length - 1;
    const done = isToday(day) && nodeSpan(day, last)[1] <= mins;
    const next = DAYS[currentDayIdx + 1];
    if (!done) { el.hidden = true; return; }
    const steps = /约 [\d,–]+ 步/.exec(day.intensity || '');
    const first = next && next.nodes[0];
    el.classList.add('is-done');
    el.innerHTML = `<span class="hn-when">今天收工${steps ? ` · 走了${steps[0]}` : ''}</span>` +
      (first ? `<span class="hn-what">明天 · ${chNo(currentDayIdx + 1)} ${next.chapter} · ${first.time.slice(0, 5)} 出发</span>` : '<span class="hn-what">全书完，一路平安</span>');
    el.onclick = first ? () => { openChapter(currentDayIdx + 1); window.scrollTo({ top: 0, behavior: 'auto' }); } : null;
    el.hidden = false;
    return;
  }
  el.classList.remove('is-done');
  const n = day.nodes[i];
  const diff = nodeStartMins(n) - mins;
  const when = diff < 60 ? `${diff} 分钟后` : (diff % 60 ? `${Math.floor(diff / 60)} 小时 ${diff % 60} 分后` : `${diff / 60} 小时后`);
  el.innerHTML = `<span class="hn-when">${n.mode ? ph(n.mode, PH_LABEL[n.mode]) : ''}下一站 · ${when}</span><span class="hn-what">${n.time.slice(0, 5)} ${n.title || n.name}</span>`;
  el.onclick = () => focusNode(i);
  el.hidden = false;
}
// 「还剩」多久：不到一小时写分钟，否则几小时几分
function leftTxt(m) { return m < 60 ? `${m} 分` : `${Math.floor(m / 60)} 小时${m % 60 ? ` ${m % 60} 分` : ''}`; }
// 一站的起止（分钟）：没写结束时间就到下一站开始，最后一站算 60 分钟
function nodeSpan(day, i) {
  const n = day.nodes[i];
  const start = hhmm(n.time);
  const endM = /[-–]\s*(\d{1,2}:\d{2})/.exec(n.time);
  const next = day.nodes[i + 1] ? hhmm(day.nodes[i + 1].time) : null;
  return [start, endM ? hhmm(endM[1]) : (next ?? start + 60)];
}
// 当天打开：走完的站收成一行「已走完 N 站」，折叠条下面第一张就是现在这一站；点折叠条全部展开
function foldDone(day, list) {
  if (!isToday(day)) return;
  const mins = nowMins();
  let live = day.nodes.findIndex((n, i) => nodeSpan(day, i)[1] > mins);
  if (live < 0) live = day.nodes.length - 1;
  const fold = live;
  if (fold < 1) return;
  const items = list.querySelectorAll('.node-item');
  for (let i = 0; i < fold; i++) items[i].classList.add('is-folded');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'done-fold';
  btn.textContent = `已走完 ${fold} 站 · 展开`;
  btn.onclick = unfoldDone;
  list.prepend(btn);
}
function unfoldDone() {
  document.querySelectorAll('#timelineList .is-folded').forEach(el => el.classList.remove('is-folded'));
  document.querySelector('#timelineList .done-fold')?.remove();
}
// 死线：当天倒数「还剩多久」，过了换下一个、都过了就收起；其他日子只写钟点和原因
function updateDeadline() {
  const el = document.getElementById('heroDeadline');
  if (!el) return;
  const day = DAYS[currentDayIdx];
  const today = isToday(day);
  const dl = [].concat(day.deadline || []).find(d => !today || hhmm(d.at) >= nowMins());
  const dock = document.getElementById('dlDock');
  dock.hidden = !(today && dl);
  if (!dl) { el.hidden = true; syncDock(); return; }
  const left = hhmm(dl.at) - nowMins();
  const txt = !today ? dl.note : `还剩 ${leftTxt(left)}`;
  el.innerHTML = `<span class="hd-what">${dl.at} 前${dl.what}</span><span class="hd-left">${txt}</span>`;
  el.hidden = false;
  if (today) {
    dock.innerHTML = `${ph('timer')}<span class="dd-what">${dl.at} 前${dl.what}</span><span class="dd-left">${txt}</span>`;
    dock.setAttribute('aria-label', `限时：${dl.at} 前${dl.what}，${txt}。回到本章封面`);
  }
  syncDock();
}
// 限时停靠：封面上的限时条被顶栏盖住以后才出现，在目录、地图里不出现
function syncDock() {
  const dock = document.getElementById('dlDock');
  const hd = document.getElementById('heroDeadline');
  const covered = !!hd && hd.getBoundingClientRect().bottom < document.querySelector('.top-bar').getBoundingClientRect().bottom;
  dock.classList.toggle('is-on', !dock.hidden && covered && (currentViewMode === 'time' || currentViewMode === 'split'));
}
let dockFrame = 0;
addEventListener('scroll', () => { if (!dockFrame && !document.getElementById('dlDock').hidden) dockFrame = requestAnimationFrame(() => { dockFrame = 0; syncDock(); }); }, { passive: true });
document.getElementById('dlDock').addEventListener('click', () => window.scrollTo({ top: 0, behavior: scrollBehavior() }));
// 「现在」这一站：当天、且现在落在这一站的时间段里（没写结束时间就到下一站开始）
function markNow() {
  const day = DAYS[currentDayIdx];
  const items = document.querySelectorAll('#timelineList .node-item');
  const stops = document.querySelectorAll('#dayHero .rs-stop');
  let cur = -1;
  if (isToday(day)) {
    const mins = nowMins();
    day.nodes.forEach((n, i) => {
      const [start, end] = nodeSpan(day, i);
      if (start != null && mins >= start && mins < end) cur = i;
      if (start != null && mins >= end) { items[i]?.classList.add('is-past'); stops[i]?.classList.add('is-past'); }
    });
  }
  stops.forEach((el, i) => el.classList.toggle('is-now', i === cur));
  items.forEach((el, i) => {
    const on = i === cur;
    if (el.classList.contains('is-now') === on) return;
    el.classList.toggle('is-now', on);
    const when = el.querySelector('.node-when');
    const tag = el.querySelector('.now-tag');
    if (on && !tag) when.insertAdjacentHTML('beforeend', '<span class="now-tag">现在</span>');
    if (!on && tag) tag.remove();
    if (!on) el.querySelector('.incense')?.remove();
  });
  burnIncense(day, cur, items, stops);
}
// 线香：现在这一站烧了多少（0–1）。最后一站没写结束钟点就不点，不编一个离开时间
function burnIncense(day, cur, items, stops) {
  stops.forEach((el, i) => el.classList.toggle('is-next', cur >= 0 && i === cur + 1));
  const el = items[cur], tag = el?.querySelector('.now-tag');
  if (!tag) return;
  const n = day.nodes[cur];
  if (!(/[-–]\s*\d{1,2}:\d{2}/.test(n.time) || day.nodes[cur + 1])) return;
  const [start, end] = nodeSpan(day, cur), mins = nowMins();
  const burn = Math.min(1, Math.max(0, (mins - start) / (end - start))).toFixed(3);
  let inc = el.querySelector('.incense');
  if (!inc) {
    el.querySelector('.node-card').insertAdjacentHTML('afterbegin', `<div class="incense" aria-hidden="true"><span class="incense-tip"><i></i><svg viewBox="0 0 10 13"><path d="M5 13c-2.5-2 2.5-3.5 0-6s2-3.5.5-6"/></svg></span></div>`);
    inc = el.querySelector('.incense');
  }
  inc.style.setProperty('--burn', burn);
  stops[cur + 1]?.style.setProperty('--burn', burn);
  tag.textContent = `现在 · 还剩 ${leftTxt(end - mins)}`;
}

// 日落／日出小图标：太阳按时间一点点沉下地平线（日出反过来），离得越近颜色越暖；
// 不是当天就停在半露的样子，只显示时刻
const SUN_SVG = `<svg class="sun-ico" viewBox="0 0 256 256" aria-hidden="true">
  <g clip-path="url(#sun-clip)"><g class="sun-disc"><circle class="sun-tone" cx="128" cy="144" r="56"/><circle cx="128" cy="144" r="56"/></g></g>
  <g class="sun-rays"><path d="M80,40l8,16M176,40l-8,16M24,96l16,8M232,96l-16,8"/></g>
  <path d="M16,160H240M48,200H208"/></svg>`;
function sunState(sun, today, mins) {
  const at = hhmm(sun.at);
  if (!today) return { y: 0, w: 0, txt: `${sun.zh} ${sun.at}` };
  const d = mins - at;
  const up = -40, down = 64;
  let y, txt;
  if (sun.kind === 'set') {
    y = d <= -180 ? up : d <= 0 ? up * (-d / 180) : Math.min(down, down * d / 20);
    txt = d < -180 ? `${sun.zh} ${sun.at}` : d < 0 ? `${sun.zh}还有 ${leftTxt(-d)}` : d < 40 ? '余晖中' : `已${sun.zh} ${sun.at}`;
  } else {
    y = d <= -20 ? down : d <= 0 ? down * (-d / 20) : Math.max(up, up * d / 180);
    txt = d < -180 ? `${sun.zh} ${sun.at}` : d < 0 ? `${sun.zh}还有 ${leftTxt(-d)}` : d < 30 ? '日出中' : `${sun.zh} ${sun.at}`;
  }
  // 暖度：日落前一小时从金色渐到朱色；日出后一小时从朱色退回金色
  const w = sun.kind === 'set' ? (d < -60 ? 0 : d < 0 ? (60 + d) / 60 : 1) : (d < 0 ? 1 : d < 60 ? 1 - d / 60 : 0);
  return { y, w, txt };
}
function updateSun(settle) {
  const day = DAYS[currentDayIdx];
  const today = isToday(day), mins = nowMins();
  document.querySelectorAll('#timelineList .sun-chip').forEach(chip => {
    const st = sunState(day.nodes[+chip.dataset.node].sun, today, mins);
    const apply = () => {
      chip.style.setProperty('--sun-y', st.y.toFixed(1));
      chip.style.setProperty('--sun-w', st.w.toFixed(2));
    };
    chip.querySelector('.sun-txt').textContent = st.txt;
    // 换天时太阳从高处落到现在的位置（只在首屏之后）
    if (settle && document.documentElement.dataset.motion === 'ready') {
      chip.style.setProperty('--sun-y', -40); chip.style.setProperty('--sun-w', 0);
      requestAnimationFrame(() => requestAnimationFrame(apply));
    } else apply();
  });
}

function tick() { updateDeadline(); updateNextStop(); markNow(); updateSun(false); }
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

function setViewMode(mode) {
  currentViewMode = mode;
  if (mode === 'split' || mode === 'time') chapterMode = mode;
  if (mode !== 'map') lastGuide = mode === 'toc' ? 'toc' : 'chapter';
  document.body.dataset.view = mode;
  document.body.dataset.tab = mode === 'map' ? 'map' : 'days';
  if (window.TabBar) window.TabBar.setActive(document.body.dataset.tab);
  ['split', 'time', 'map'].forEach(m => document.getElementById('btn-' + m).setAttribute('aria-pressed', String(m === mode)));
  document.getElementById('btn-split').classList.toggle('active', mode === 'split');
  document.getElementById('btn-time').classList.toggle('active', mode === 'time' || mode === 'toc');
  document.getElementById('btn-map').classList.toggle('active', mode === 'map');
  document.getElementById('tocBtn').setAttribute('aria-pressed', String(mode === 'toc'));
  document.querySelectorAll('.day-pill').forEach((p, i) => p.setAttribute('aria-pressed', String(mode !== 'toc' && i === currentDayIdx)));
  document.getElementById('tocView').hidden = mode !== 'toc';

  const mapCard = document.getElementById('mapCard');
  const heroCard = document.getElementById('dayHero');
  const timelineList = document.getElementById('timelineList');
  const mapElem = document.getElementById('map');

  if (mode === 'toc') {
    mapCard.classList.add('collapsed');
    heroCard.style.display = 'none';
    timelineList.style.display = 'none';
  } else if (mode === 'time') {
    mapCard.classList.add('collapsed');
    heroCard.style.display = 'block';
    timelineList.style.display = 'block';
  } else if (mode === 'map') {
    mapCard.classList.remove('collapsed');
    heroCard.style.display = 'none';
    timelineList.style.display = 'none';
    // 填到底栏上沿为止，不被底栏盖住
    const bar = document.querySelector('.tabbar');
    const covered = bar ? window.innerHeight - bar.getBoundingClientRect().top : 0;
    const top = mapElem.getBoundingClientRect().top + window.scrollY;
    mapElem.style.height = Math.max(270, window.innerHeight - top - covered - 12) + 'px';
  } else {
    // split
    mapCard.classList.remove('collapsed');
    heroCard.style.display = 'block';
    timelineList.style.display = 'block';
    mapElem.style.height = (window.innerWidth >= 640) ? '340px' : '270px';
  }
  syncDock();
}

// 转屏或窗口大小变了：地图高度按当前视图重算（地图视图要贴着底栏上沿）
let resizeFrame = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => setViewMode(currentViewMode));
});

document.addEventListener('DOMContentLoaded', initApp);
</script>
