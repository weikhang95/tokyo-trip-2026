<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>东京 · 随身行程与地图助手 (Tokyo Companion)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #6B6255;
    --faint: #B8B0A2;
    --grid: #E5DFC5;
    --ai: #1C3553;
    --ai-soft: rgba(28, 53, 83, 0.08);
    --shu: #C2412D;
    --shu-soft: rgba(194, 65, 45, 0.08);
    --matcha: #506628;
    --matcha-soft: rgba(80, 102, 40, 0.1);
    --kin: #855E16;
    --kin-soft: rgba(133, 94, 22, 0.08);
    --shadow: 0 4px 16px rgba(35, 31, 27, 0.06);
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 90px;
  }

  /* ── Sticky Top Bar ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(247, 245, 240, 0.96);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--grid);
  }
  .bar-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .brand-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ai);
    background: var(--ai-soft);
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 99px;
  }
  .page-title {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .view-toggles {
    display: flex;
    gap: 4px;
    background: #EFECE6;
    padding: 2px;
    border-radius: 99px;
  }
  .view-btn {
    border: none;
    background: transparent;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 99px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .view-btn.active {
    background: var(--ai);
    color: #fff;
  }

  /* ── Day Selector Pills ── */
  .day-scroll {
    overflow-x: auto;
    scrollbar-width: none;
    display: flex;
    gap: 6px;
    padding: 6px 12px 10px;
    max-width: 900px;
    margin: 0 auto;
  }
  .day-scroll::-webkit-scrollbar { display: none; }
  .day-pill {
    flex: 0 0 auto;
    padding: 6px 12px;
    background: var(--paper);
    border: 1px solid var(--grid);
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all .18s ease;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .day-pill .dp-tag {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.8;
  }
  .day-pill.active {
    background: var(--ai);
    color: #fff;
    border-color: var(--ai);
    box-shadow: 0 2px 8px rgba(28, 53, 83, 0.25);
  }

  /* ── Main Layout Container ── */
  .content-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 12px 14px;
  }

  /* ── Map Container ── */
  .map-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: all .2s ease;
  }
  .map-card.collapsed {
    display: none;
  }
  .map-header {
    padding: 8px 14px;
    background: var(--paper);
    border-bottom: 1px solid var(--grid);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 8px;
  }
  .map-title-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .route-stats-badge {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 2px 8px;
    border-radius: 99px;
    transition: all .2s;
  }
  .map-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .route-toggle-btn {
    border: 1px solid var(--grid);
    background: #FFFFFF;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .route-toggle-btn.active {
    background: var(--ai);
    color: #FFFFFF;
    border-color: var(--ai);
  }
  .map-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--shu);
    text-decoration: none;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--shu-soft);
  }
  #map {
    width: 100%;
    height: 270px;
    background: #e5e3df;
  }
  @media (min-width: 640px) {
    #map { height: 340px; }
  }

  /* Leaflet custom pin markers */
  .custom-pin {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    background: var(--ai);
    color: #FFFFFF;
    font-weight: 800;
    font-size: 12px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #FFFFFF;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .custom-pin span {
    transform: rotate(45deg);
  }
  .custom-pin.hero {
    background: var(--shu);
  }
  .custom-pin.nature {
    background: var(--matcha);
  }

  /* ── Day Summary Header Card ── */
  
  /* Day 8 Tri-Option Switcher Pills */
  .day8-switcher {
    display: flex;
    gap: 6px;
    background: #EAE6DE;
    padding: 3px;
    border-radius: 99px;
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .day8-switcher::-webkit-scrollbar { display: none; }
  .d8-opt-btn {
    flex: 1 0 auto;
    border: none;
    background: transparent;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 99px;
    cursor: pointer;
    transition: all .18s ease;
    white-space: nowrap;
    text-align: center;
  }
  .d8-opt-btn.active {
    background: var(--ai);
    color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(28, 53, 83, 0.25);
  }

  .day-hero-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .hero-badge {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--ai);
    color: #fff;
  }
  .hero-pacing {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    background: #EFECE6;
    color: var(--muted);
  }
  .hero-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 6px;
  }
  .hero-desc {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .hero-transit {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 4px 10px;
    border-radius: 8px;
    margin-top: 8px;
    width: 100%;
  }
  .hero-route-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 800;
    color: var(--shu);
    background: var(--shu-soft);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 99px;
    margin-top: 8px;
    transition: all .15s;
  }
  .hero-route-link:hover {
    background: var(--shu);
    color: #fff;
  }

  /* ── Timeline Nodes ── */
  .timeline {
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    top: 14px;
    bottom: 14px;
    left: 11px;
    width: 2px;
    background: var(--grid);
    border-radius: 2px;
  }
  .node-item {
    position: relative;
    margin-bottom: 16px;
    cursor: pointer;
  }
  .node-dot {
    position: absolute;
    left: -28px;
    top: 14px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 2px solid var(--ai);
    color: var(--ai);
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    z-index: 2;
    transition: all .2s;
  }
  .node-item.hero .node-dot {
    border-color: var(--shu);
    color: var(--shu);
  }
  .node-item.active .node-dot {
    background: var(--shu);
    border-color: var(--shu);
    color: #FFFFFF;
    transform: scale(1.15);
  }

  .node-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .node-item.active .node-card {
    border-color: var(--shu);
    box-shadow: 0 4px 18px rgba(194, 65, 45, 0.15);
  }
  .node-card:active {
    transform: scale(0.99);
  }

  .node-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 4px;
  }
  .time-badge {
    font-size: 12px;
    font-weight: 800;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: .02em;
    display: inline-block;
  }
  .node-item.hero .time-badge {
    color: var(--shu);
    background: var(--shu-soft);
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: #FFFFFF;
    background: var(--ai);
    text-decoration: none;
    padding: 4px 9px;
    border-radius: 99px;
    flex-shrink: 0;
    transition: background .15s;
  }
  .nav-btn:hover {
    background: var(--shu);
  }
  .node-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .node-name-sub {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .node-action {
    font-size: 12.5px;
    color: var(--ink);
    line-height: 1.48;
    margin-bottom: 8px;
  }
  .node-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .ntag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    background: #FAF9F6;
    border: 1px solid var(--grid);
    color: var(--muted);
  }
  .ntag.highlight {
    background: var(--shu-soft);
    border-color: rgba(194, 65, 45, 0.2);
    color: var(--shu);
  }
  .ntag.ease {
    background: var(--matcha-soft);
    border-color: rgba(80, 102, 40, 0.2);
    color: var(--matcha);
  }

  /* ── Bottom Floating Quick Action ── */
  .float-dock {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28, 53, 83, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 99px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    z-index: 1000;
  }
  .dock-btn {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    text-decoration: none;
  }
  .dock-sep {
    width: 1px;
    height: 14px;
    background: rgba(255,255,255,0.25);
  }
</style>
</head>

<!-- ── Sticky Top Bar ── -->
<header class="top-bar">

    <div class="brand-group">

  <section class="day-hero-card" id="dayHero">

  <!-- Chronological Timeline Stream -->
  <main class="timeline" id="timelineList">

  </main>
</div>

<!-- Floating Action Bar -->
<div class="float-dock">

</div>

// Route Mode: true = Real Road Curves (贴合真实道路), false = Clean Straight Lines
let showRealRoadRoute = true;
const routeCache = {};

function toggleRouteMode() {
  showRealRoadRoute = !showRealRoadRoute;
  const btn = document.getElementById('btnRouteToggle');
  if (btn) {
    btn.classList.toggle('active', showRealRoadRoute);
    btn.textContent = showRealRoadRoute ? '🛣️ 真实路网' : '📍 直线';
  }
  const day = DAYS[currentDayIdx];
  renderRoutePolyline(day);
}

// Compact Polyline Decoder
function decodePolyline(encoded) {
  const points = [];
  let index = 0, len = encoded.length;
  let lat = 0, lng = 0;
  while (index < len) {
    let b, shift = 0, result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lat += dlat;
    shift = 0;
    result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lng += dlng;
    points.push([lat * 1e-5, lng * 1e-5]);
  }
  return points;
}

function drawRealCurvedRoute(coords, color, isDrive) {
  // Glow casing line
  const casing = L.polyline(coords, {
    color: color,
    weight: isDrive ? 8 : 6,
    opacity: 0.22,
    lineCap: 'round',
    lineJoin: 'round'
  });
  // Core crisp line
  const core = L.polyline(coords, {
    color: color,
    weight: isDrive ? 4 : 3,
    opacity: 0.9,
    lineCap: 'round',
    lineJoin: 'round'
  });
  polylineLayer.addLayer(casing);
  polylineLayer.addLayer(core);
}

async function renderRoutePolyline(day) {
  if (!polylineLayer) return;
  polylineLayer.clearLayers();
  
  const statsBadge = document.getElementById('mapRouteStats');
  const latlngs = day.nodes.map(n => [n.lat, n.lng]);
  if (latlngs.length < 2) {
    if (statsBadge) statsBadge.style.display = 'none';
    return;
  }

  const isDrive = (day.day === 'D4' || day.day === 'D5');
  const isNature = isDrive;
  const themeColor = isNature ? '#506628' : (isDrive ? '#1C3553' : '#C2412D');

  if (!showRealRoadRoute) {
    // Straight line mode
    const straightLine = L.polyline(latlngs, {
      color: themeColor,
      weight: 3.5,
      opacity: 0.65,
      dashArray: '5, 8'
    });
    polylineLayer.addLayer(straightLine);
    if (statsBadge) {
      statsBadge.textContent = '📍 直线模式';
      statsBadge.style.display = 'inline-block';
    }
    return;
  }

  // Real Road Mode:
  // 1. Check prebaked cache first (0ms instant)
  if (PREBAKED_ROUTES[day.day]) {
    const data = PREBAKED_ROUTES[day.day];
    const coords = decodePolyline(data.encoded);
    drawRealCurvedRoute(coords, themeColor, isDrive);
    if (statsBadge) {
      const modeLabel = isDrive ? '🚗 自驾路网' : '🚶 步行动线';
      statsBadge.textContent = `${modeLabel} 约 ${data.distance} (${data.duration})`;
      statsBadge.style.display = 'inline-block';
    }
    return;
  }

  // 2. Check dynamic memory cache
  if (routeCache[day.day]) {
    const data = routeCache[day.day];
    drawRealCurvedRoute(data.coords, themeColor, isDrive);
    if (statsBadge) {
      statsBadge.textContent = `🛣️ 路网 约 ${data.distance} (${data.duration})`;
      statsBadge.style.display = 'inline-block';
    }
    return;
  }

  // 3. Fallback transit/straight line immediately
  const tempLine = L.polyline(latlngs, {
    color: themeColor,
    weight: 3.5,
    opacity: 0.65,
    dashArray: day.day === 'D10' ? '8, 12' : '5, 8'
  });
  polylineLayer.addLayer(tempLine);
  if (statsBadge) {
    statsBadge.textContent = day.day === 'D10' ? '✈️ 航线' : (day.day === 'D1' ? '🚆 铁道直通' : '🛣️ 计算中...');
    statsBadge.style.display = 'inline-block';
  }

  // For D1 (Skyliner) and D10 (Flights), transit line is optimal
  if (day.day === 'D1' || day.day === 'D10') return;

  // 4. Dynamic query OSRM for any uncached days
  try {
    const profile = isDrive ? 'driving' : 'walking';
    const coordsStr = day.nodes.map(n => `${n.lng.toFixed(5)},${n.lat.toFixed(5)}`).join(';');
    const res = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${coordsStr}?overview=full&geometries=geojson`);
    const json = await res.json();
    if (json.code === 'Ok' && json.routes && json.routes[0]) {
      const r = json.routes[0];
      const realCoords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      const dist = (r.distance / 1000).toFixed(1) + ' km';
      const dur = Math.round(r.duration / 60) + ' 分钟';
      routeCache[day.day] = { coords: realCoords, distance: dist, duration: dur };
      
      if (DAYS[currentDayIdx].day === day.day && showRealRoadRoute) {
        polylineLayer.clearLayers();
        drawRealCurvedRoute(realCoords, themeColor, isDrive);
        if (statsBadge) {
          statsBadge.textContent = `${isDrive ? '🚗 自驾' : '🚶 步行'} 约 ${dist} (${dur})`;
        }
      }
    }
  } catch (e) {
    // Offline or network error - keep straight line
  }
}

// Map & Interaction Engine
// ══════════════════════════════════════════════════════════════════════
let map = null;
let currentDayIdx = 0;
let markersLayer = null;
let polylineLayer = null;
let currentViewMode = 'split'; // 'split', 'time', 'map'

function getDayIdxFromHash() {
  const hash = window.location.hash.toLowerCase().replace('#', '');
  if (!hash) return 0;
  const match = hash.match(/\d+/);
  if (match) {
    const num = parseInt(match[0], 10);
    if (num >= 1 && num <= DAYS.length) return num - 1;
  }
  return 0;
}

function initApp() {
  renderDayPills();
  initMap();
  const initIdx = getDayIdxFromHash();
  selectDay(initIdx, false);

  window.addEventListener('hashchange', () => {
    const idx = getDayIdxFromHash();
    if (idx !== currentDayIdx) {
      selectDay(idx, false);
    }
  });
}

function initMap() {
  map = L.map('map', {
    zoomControl: true,
    attributionControl: false
  }).setView([35.6895, 139.6917], 12);

  // CartoDB Voyager Clean Tiles (Fast, legible, elegant)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    subdomains: 'abcd'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  polylineLayer = L.layerGroup().addTo(map);
}

function renderDayPills() {
  const container = document.getElementById('dayPills');
  container.innerHTML = '';
  DAYS.forEach((d, idx) => {
    const btn = document.createElement('button');
    btn.className = `day-pill ${idx === currentDayIdx ? 'active' : ''}`;
    btn.id = `pill-${idx}`;
    btn.innerHTML = `<span>${d.day}</span><span class="dp-tag">${d.date}${d.weekday}</span>`;
    btn.onclick = () => selectDay(idx);
    container.appendChild(btn);
  });
}


function switchDay8Option(key) {
  if (!DAY8_OPTIONS[key]) return;
  currentDay8OptionKey = key;
  DAYS[7] = DAY8_OPTIONS[key];
  
  // Update PREBAKED_ROUTES for D8
  if (PREBAKED_ROUTES['D8_' + key]) {
    PREBAKED_ROUTES['D8'] = PREBAKED_ROUTES['D8_' + key];
  }

  // Re-render Day 8
  selectDay(7, false);
}

function selectDay(idx, updateHash = true) {
  currentDayIdx = idx;
  const day = DAYS[idx];

  if (updateHash && window.location.hash !== `#${day.day}`) {
    history.replaceState(null, '', `#${day.day}`);
  }

  // Update pills
  document.querySelectorAll('.day-pill').forEach((p, i) => {
    p.classList.toggle('active', i === idx);
  });
  const activePill = document.getElementById(`pill-${idx}`);
  if (activePill) {
    activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }

  // Update map header
  document.getElementById('mapDayLabel').textContent = `📍 ${day.day} (${day.date} ${day.weekday}) 地图路线`;
  const routeBtn = document.getElementById('btnGmapsDayRoute');
  routeBtn.href = day.routeUrl;

  // Render Day Hero Card
  const heroCard = document.getElementById('dayHero');
  let d8SwitcherHtml = '';
  if (idx === 7) {
    d8SwitcherHtml = `
      <div class="day8-switcher" role="group" aria-label="Day 8 方案选择">
        <button class="d8-opt-btn ${currentDay8OptionKey === 'kamakura' ? 'active' : ''}" onclick="switchDay8Option('kamakura')">🌊 方案 A: 镰仓海景大佛 (主推)</button>
        <button class="d8-opt-btn ${currentDay8OptionKey === 'nezu' ? 'active' : ''}" onclick="switchDay8Option('nezu')">⛩️ 方案 B: 根津神社·谷中祭 (第一平替)</button>
        <button class="d8-opt-btn ${currentDay8OptionKey === 'kiyosumi' ? 'active' : ''}" onclick="switchDay8Option('kiyosumi')">☕ 方案 C: 清澄白河 (避人潮)</button>
        <button class="d8-opt-btn ${currentDay8OptionKey === 'kichijoji' ? 'active' : ''}" onclick="switchDay8Option('kichijoji')">🛍️ 方案 D: 吉祥寺井之头</button>
      </div>
    `;
  }

  heroCard.innerHTML = `
    ${d8SwitcherHtml}
    <div class="hero-meta">
      <span class="hero-badge">${day.day} · ${day.date} (${day.weekday})</span>
      <span class="hero-pacing">${day.intensity}</span>
    </div>
    <h1 class="hero-title">${day.title}</h1>
    <p class="hero-desc">${day.desc}</p>
    <div class="hero-transit">🚇 ${day.transit}</div>
    <a href="${day.routeUrl}" target="_blank" class="hero-route-link">🗺️ 打开今日完整 Google Maps 路线规划 ↗</a>
  `;

  // Render Timeline
  renderTimeline(day);

  // Update Leaflet Map
  updateMap(day);
}

function renderTimeline(day) {
  const list = document.getElementById('timelineList');
  list.innerHTML = '';

  day.nodes.forEach((node, nIdx) => {
    const item = document.createElement('article');
    item.className = `node-item ${node.hero ? 'hero' : ''}`;
    item.id = `node-${nIdx}`;
    
    // Google Maps Navigation Deep Link
    const gmapsNavUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(node.name + ' ' + (node.sub || ''))}`;

    item.innerHTML = `
      <div class="node-dot">${nIdx + 1}</div>
      <div class="node-card">
        <div class="node-top">
          <span class="time-badge">${node.time}</span>
          <a href="${gmapsNavUrl}" target="_blank" class="nav-btn" title="在 Google Maps 中导航">📍 导航 ↗</a>
        </div>
        <h2 class="node-name">${node.name}</h2>
        <div class="node-name-sub">${node.sub}</div>
        <p class="node-action">${node.action}</p>
        <div class="node-tags">
          ${node.tags.map(t => `<span class="ntag ${t.includes('★') || t.includes('现金') || t.includes('注意') || t.includes('日出') ? 'highlight' : (t.includes('0') || t.includes('电梯') || t.includes('直达') || t.includes('省') ? 'ease' : '')}">${t}</span>`).join('')}
        </div>
      </div>
    `;

    // Click card to highlight and center map
    item.onclick = (e) => {
      if (e.target.closest('.nav-btn')) return; // Allow normal link click
      focusNode(nIdx);
    };

    list.appendChild(item);
  });
}

let mapMarkers = [];

function updateMap(day) {
  if (!map) return;
  markersLayer.clearLayers();
  polylineLayer.clearLayers();
  mapMarkers = [];

  const latlngs = [];

  day.nodes.forEach((node, nIdx) => {
    latlngs.push([node.lat, node.lng]);

    // Custom numbered pin
    const pinClass = node.hero ? 'custom-pin hero' : (day.day === 'D4' || day.day === 'D5' ? 'custom-pin nature' : 'custom-pin');
    const icon = L.divIcon({
      className: '',
      html: `<div class="${pinClass}"><span>${nIdx + 1}</span></div>`,
      iconSize: [26, 26],
      iconAnchor: [13, 26],
      popupAnchor: [0, -26]
    });

    const gmapsNavUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(node.name + ' ' + (node.sub || ''))}`;

    const marker = L.marker([node.lat, node.lng], { icon })
      .bindPopup(`
        <div style="font-family:'Inter','Noto Sans SC',sans-serif; min-width:160px;">
          <div style="font-size:11px; font-weight:800; color:var(--shu); margin-bottom:2px;">${node.time} · 第 ${nIdx + 1} 站</div>
          <div style="font-size:13.5px; font-weight:800; color:var(--ink); margin-bottom:4px;">${node.name}</div>
          <div style="font-size:11.5px; color:var(--muted); margin-bottom:8px;">${node.sub}</div>
          <a href="${gmapsNavUrl}" target="_blank" style="display:inline-block; font-size:11.5px; font-weight:700; color:#fff; background:var(--ai); text-decoration:none; padding:4px 10px; border-radius:99px;">📍 Google Maps 导航 ↗</a>
        </div>
      `);

    marker.on('click', () => {
      highlightNodeCard(nIdx);
    });

    markersLayer.addLayer(marker);
    mapMarkers.push(marker);
  });

  // Render intelligent polyline (real road curves or straight fallback)
  renderRoutePolyline(day);

  // Auto fit bounds with padding
  if (latlngs.length > 0) {
    map.fitBounds(L.latLngBounds(latlngs), { padding: [40, 40], maxZoom: 15 });
  }
}

function focusNode(idx) {
  highlightNodeCard(idx);
  if (map && mapMarkers[idx]) {
    const marker = mapMarkers[idx];
    map.setView(marker.getLatLng(), Math.max(map.getZoom(), 14), { animate: true });
    marker.openPopup();
  }
}

function highlightNodeCard(idx) {
  document.querySelectorAll('.node-item').forEach((card, i) => {
    card.classList.toggle('active', i === idx);
  });
  const activeCard = document.getElementById(`node-${idx}`);
  if (activeCard) {
    activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function scrollToCurrentNode() {
  const cards = document.querySelectorAll('.node-item');
  if (cards.length > 0) {
    focusNode(0);
  }
}

function setViewMode(mode) {
  currentViewMode = mode;
  document.getElementById('btn-split').classList.toggle('active', mode === 'split');
  document.getElementById('btn-time').classList.toggle('active', mode === 'time');
  document.getElementById('btn-map').classList.toggle('active', mode === 'map');

  const mapCard = document.getElementById('mapCard');
  const heroCard = document.getElementById('dayHero');
  const timelineList = document.getElementById('timelineList');
  const mapElem = document.getElementById('map');

  if (mode === 'time') {
    mapCard.classList.add('collapsed');
    heroCard.style.display = 'block';
    timelineList.style.display = 'block';
  } else if (mode === 'map') {
    mapCard.classList.remove('collapsed');
    heroCard.style.display = 'none';
    timelineList.style.display = 'none';
    mapElem.style.height = 'calc(100vh - 140px)';
    if (map) map.invalidateSize();
  } else {
    // split
    mapCard.classList.remove('collapsed');
    heroCard.style.display = 'block';
    timelineList.style.display = 'block';
    mapElem.style.height = (window.innerWidth >= 640) ? '340px' : '270px';
    if (map) map.invalidateSize();
  }
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
