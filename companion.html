<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>攻略 · 东京 · 河口湖 2026</title>
<meta name="theme-color" content="#F7F5F0" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="东京 2026" />
<script>
// 与手册共用 tokyo_theme：在任一页切换，另一页跟着走
try {
  const savedTheme = localStorage.getItem('tokyo_theme');
  const t = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0e1116' : '#F7F5F0';
} catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="tabbar.css?v=5">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --paper: #FAF9F6;
    --card-bg: #FFFFFF;
    --ink: #231F1B;
    --muted: #6B6255;
    --grid: #E5DFC5;
    --ai: #1C3553;
    --ai-soft: rgba(28, 53, 83, 0.08);
    --shu: #C2412D;
    --shu-ink: #B03A27;
    --shu-soft: rgba(194, 65, 45, 0.08);
    --matcha: #506628;
    --matcha-soft: rgba(80, 102, 40, 0.1);
    --kin: #855E16;
    --kin-soft: rgba(133, 94, 22, 0.08);
    --shadow: 0 4px 16px rgba(35, 31, 27, 0.06);
    --radius: 16px;
    --on-ai: #FFFFFF;
    --chip-bg: #EFECE6;
    --chip-bg-2: #EAE6DE;
    --map-bg: #e5e3df;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --bar-bg: rgba(247, 245, 240, 0.96);
    --pin-ring: #FFFFFF;
    --serif: 'Noto Serif SC', 'Songti SC', serif;
  }
  /* 深色：与手册 index.html 的深色色值一致 */
  /* 底栏一直盖在页底（手机 57px；宽屏浮起 16px）：键盘 Tab 到页底的站点时让开它 */
  html { scroll-padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px) + 8px); }
  /* 跳到某张卡时别被顶栏（和限时停靠条）盖住 */
  html { scroll-padding-top: 112px; }
  html:has(.dl-dock.is-on) { scroll-padding-top: 150px; }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1116;
    --paper: #12161c;
    --card-bg: #151a21;
    --ink: #e8ecf1;
    --muted: #aab4c0;
    --grid: #29303a;
    --ai: #8fb3e6;
    --ai-soft: rgba(143, 179, 230, 0.12);
    --shu: #f08a78;
    --shu-ink: #f08a78;
    --shu-soft: rgba(240, 138, 120, 0.12);
    --matcha: #9dbf5a;
    --matcha-soft: rgba(157, 191, 90, 0.12);
    --kin: #d9b25c;
    --kin-soft: rgba(217, 178, 92, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --on-ai: #0e1116;
    --chip-bg: #1c222b;
    --chip-bg-2: #1c222b;
    --map-bg: #1c222b;
    --bar-bg: rgba(14, 17, 22, 0.94);
    --pin-ring: #151a21;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }

  /* ── Sticky Top Bar ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: var(--bar-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--grid);
  }
  .bar-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    max-width: 900px;
    margin: 0 auto;
  }
  .view-toggles {
    display: flex;
    flex-shrink: 0;
    gap: 4px;
    background: var(--chip-bg);
    padding: 2px;
    border-radius: 99px;
  }
  .view-btn {
    position: relative;
    border: none;
    background: transparent;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    padding: 0 12px;
    min-height: 40px;
    white-space: nowrap;
    border-radius: 99px;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), scale .1s var(--ease);
  }
  .view-btn:active,.theme-btn:active, .route-toggle-btn:active { scale: .96; }
  .view-btn.active {
    background: var(--ai);
    color: var(--on-ai);
  }
  /* 昼 / 夜 切换 */
  /* 顶栏和资料页同一种样子：左边衬线站名，右边昼夜。手机上「行程／地图」在底栏，视图切换只在宽屏出现 */
  .bar-brand { font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: .02em; white-space: nowrap; }
  /* 页名：这一页写「攻略」，资料页写「背包」 */
  .page-tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 99px; background: var(--ai-soft); color: var(--ai); font-family: 'Inter', 'Noto Sans SC', sans-serif; font-size: 12px; font-weight: 800; letter-spacing: .04em; vertical-align: 2px; }
  .bar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  @media (max-width: 640px) { .view-toggles { display: none; } }
  .theme-btn {
    position: relative;
    min-width: 40px; min-height: 40px; padding: 0 10px;
    border: 0; border-radius: 99px; background: transparent;
    color: var(--muted); font: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), scale .1s var(--ease);
  }
  @media (hover: hover) { .theme-btn:hover { background: var(--chip-bg); color: var(--ink); } }
  /* 昼夜：月亮 = 点了变深色，太阳 = 点了变浅色；两个图标叠着，切换时一个缩小模糊淡出、一个长出来（打开页面不播） */
  #theme-toggle { display: grid; place-items: center; }
  #theme-toggle svg { grid-area: 1 / 1; width: 20px; height: 20px; fill: currentColor; }
  html[data-theme="dark"] #theme-toggle .ic-moon, html:not([data-theme="dark"]) #theme-toggle .ic-sun { opacity: 0; scale: .25; filter: blur(4px); }
  #theme-toggle.swap svg { animation: glyph-in .3s cubic-bezier(.2,0,0,1); }
  html[data-theme="dark"] #theme-toggle.swap .ic-moon, html:not([data-theme="dark"]) #theme-toggle.swap .ic-sun { animation-name: glyph-out; }
  @keyframes glyph-in { from { opacity: 0; scale: .25; filter: blur(4px); } }
  @keyframes glyph-out { from { opacity: 1; scale: 1; filter: blur(0); } }

  /* ── Day Selector Pills ── */
  .day-scroll {
    overflow-x: auto;
    scrollbar-width: none;
    display: flex;
    gap: 6px;
    padding: 6px 12px 10px;
    max-width: 900px;
    margin: 0 auto;
  }
  .day-scroll::-webkit-scrollbar { display: none; }
  .day-pill {
    flex: 0 0 auto;
    padding: 6px 12px;
    background: var(--paper);
    border: 1px solid var(--grid);
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  /* 胶囊 30px 高：点击区只上下扩到 44px（左右扩会压住隔壁那天）。
     上 7px / 下 9px（从 1px 边框里面算）刚好落在日期栏的内边距里，不会让它多出竖向滚动 */
  .day-pill { position: relative; }
  .day-pill::after { content: ""; position: absolute; inset: -7px 0 -9px; }
  .day-pill.active {
    background: var(--ai);
    color: var(--on-ai);
    border-color: var(--ai);
    box-shadow: 0 2px 8px rgba(28, 53, 83, 0.25);
  }

  /* ── Main Layout Container ── */
  .content-wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 12px 14px;
  }

  /* ── Map Container ── */
  .map-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .map-card.collapsed {
    display: none;
  }
  .map-header {
    padding: 8px 14px;
    background: var(--paper);
    border-bottom: 1px solid var(--grid);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    gap: 8px;
  }
  .map-actions {
    display: flex;
    flex: 1;
    gap: 6px;
    align-items: center;
  }
  .map-actions > a { margin-left: auto; }
  .route-toggle-btn {
    position: relative;
    border: 1px solid var(--grid);
    background: var(--card-bg);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), scale .1s var(--ease);
  }
  .route-toggle-btn.active {
    background: var(--ai);
    color: var(--on-ai);
    border-color: var(--ai);
  }
  .map-link-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--shu-ink);
    text-decoration: none;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--shu-soft);
    transition: scale .1s var(--ease);
  }
  .map-link-btn:active { scale: .96; }
  #map {
    width: 100%;
    height: 270px;
    background: var(--map-bg);
  }
  @media (min-width: 640px) {
    #map { height: 340px; }
  }
  /* 地图载入失败（没网、key 被拒、当日额度用完）：收成一行提示，别留一个空框占半个屏幕 */
  .map-off #map { height: auto; background: none; }
  .map-off .route-toggle-btn { display: none; }
  .map-fail { margin: 0; padding: 10px 16px 12px; font-size: 13px; line-height: 1.6; color: var(--muted); text-wrap: pretty; }


  /* ── Day Summary Header Card ── */
  
  .day-hero-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  /* 当天的插画（和资料页同一套 img/illo/），贴满卡片顶部；地面在底部，所以从底部对齐 */
  .hero-illo { margin: -14px -16px 12px; height: min(170px, calc((100vw - 30px) * .325)); background: var(--chip-bg); } /* 手机上整张画刚好放下（800:260），宽屏最高 170px、裁掉天空；不用 aspect-ratio + max-height，那样宽屏会把画挤窄 */
  .hero-illo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
  html[data-theme="dark"] .hero-illo img { filter: brightness(.8) saturate(.9); }
  .hero-count {
    font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px;
    background: var(--ai-soft); color: var(--ai); font-variant-numeric: tabular-nums;
  }
  .hero-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .hero-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 6px;
    text-wrap: balance;
    word-break: keep-all; overflow-wrap: anywhere; /* 只在空格、→ 两边换行，「开顶巴士」不会拆成两行 */
  }
  /* 下一站：卡片内边距 14px，圆角 16 - 6 ≈ 10px 保持同心 */
  .hero-next {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; min-height: 44px; margin: 4px 0 8px; padding: 8px 12px;
    border: 0; border-radius: 10px; background: var(--chip-bg); color: var(--ink);
    font: inherit; text-align: left; cursor: pointer;
    transition: scale .1s var(--ease), background-color .15s var(--ease);
  }
  .hero-next[hidden] { display: none; }
  .hero-next:active { scale: .98; } /* 整行宽的条，.96 缩得太明显，和 .node-card 的 .99 同理 */
  .hero-next:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .hn-when {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; color: var(--ai);
    font-variant-numeric: tabular-nums;
  }
  .hn-when .ph { width: 1.2em; height: 1.2em; }
  .hero-next.is-done { background: var(--ai-soft); }
  .hn-what {
    font-size: 14px; font-weight: 700; line-height: 1.4;
    font-variant-numeric: tabular-nums; text-wrap: pretty;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  /* 死线：这一天有错过就作废的钟点（例如巴士）。金色＝警示，和站点里「!」要点同色 */
  .hero-deadline {
    display: flex; align-items: baseline; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap;
    margin: 4px 0 0; padding: 8px 12px; border-radius: 10px;
    background: var(--kin-soft); box-shadow: inset 3px 0 0 var(--kin);
  }
  .hero-deadline[hidden] { display: none; }
  .hd-what { font-size: 14px; font-weight: 800; line-height: 1.4; color: var(--ink); text-wrap: pretty; word-break: keep-all; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .hd-left { font-size: 12px; font-weight: 700; color: var(--kin); white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* 限时停靠：当天还有没到的限时，封面那条滚出顶栏后，它钉在顶栏下面一行（盖在内容上，不挤动页面）；点一下回到封面 */
  .dl-dock {
    position: absolute; left: 0; right: 0; top: 100%;
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px;
    padding: 6px max(16px, calc((100% - 900px) / 2 + 16px));
    border: 0; background: color-mix(in srgb, var(--kin) 12%, var(--paper));
    box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--kin) 28%, transparent), 0 6px 14px -10px rgba(0, 0, 0, .35);
    color: var(--ink); font: inherit; text-align: left; cursor: pointer;
    opacity: 0; translate: 0 -4px; visibility: hidden;
    transition: opacity .18s var(--ease), translate .18s var(--ease), visibility 0s .18s;
  }
  .dl-dock[hidden] { display: none; }
  .dl-dock.is-on { opacity: 1; translate: 0; visibility: visible; transition: opacity .18s var(--ease), translate .18s var(--ease), visibility 0s; }
  .dl-dock .ph { flex: none; width: 1.2em; height: 1.2em; color: var(--kin); }
  .dd-what { flex: 1; min-width: 0; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .dd-left { flex: none; font-size: 12px; font-weight: 800; color: var(--kin); font-variant-numeric: tabular-nums; }
  .dl-dock:focus-visible { outline: 2px solid var(--ai); outline-offset: -2px; }
  .hero-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.65;
    padding-bottom: 4px;
    text-wrap: pretty;
  }
  /* 概要一条一行、交通一步一行：长段落拆开，手机上一眼扫完 */
  ul.hero-desc { list-style: none; margin: 4px 0 6px; padding: 0; display: flex; flex-direction: column; gap: 3px; color: var(--ink); font-variant-numeric: tabular-nums; }
  ul.hero-desc li { position: relative; padding-left: 14px; }
  ul.hero-desc li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
  ol.hero-transit { margin: 4px 0 6px; padding: 8px 12px 8px 2em; display: flex; flex-direction: column; gap: 2px; text-wrap: pretty; font-variant-numeric: tabular-nums; }
  ol.hero-transit li::marker { font-weight: 700; }
  .hero-transit {
    display: block;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 8px 12px;
    border-radius: 10px;
    margin: 4px 0 6px;
    width: 100%;
  }
  .hero-route-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 800;
    color: var(--ai);
    background: var(--ai-soft);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 99px;
    margin-top: 8px;
    transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  /* 分屏时地图卡已有「Google 路线」，这里只在「行程」视图出现 */
  body:not([data-view="time"]) .hero-route-link { display: none; }
  @media (hover: hover) {
    .hero-route-link:hover { background: var(--ai); color: var(--on-ai); }
  }

  /* ── Timeline Nodes ── */
  .timeline {
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    top: 14px;
    bottom: 14px;
    left: 11px;
    width: 2px;
    background: var(--grid);
    border-radius: 2px;
  }
  .node-item {
    position: relative;
    margin-bottom: 16px;
    cursor: pointer;
  }
  .node-dot {
    position: absolute;
    left: -28px;
    top: 14px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 2px solid var(--ai);
    color: var(--ai);
    padding: 0;
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    z-index: 2;
    transition: background-color .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .node-dot:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  /* 圆点 24px：点击区扩到 44px，右边压进卡片 6px 无妨，点卡片也是「在地图上看这一站」 */
  .node-dot::after { content: ""; position: absolute; inset: 50% auto auto 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
  .node-item.hero .node-dot {
    border-color: var(--shu);
    color: var(--shu);
  }
  /* 选中 = 靛蓝；红色只留给「必看」(.hero)，两者要分得开 */
  /* 走过的站：圆点换淡色，一眼分出「已经过了」；卡片文字不淡化，晚点了照样看得清 */
  .node-item.is-past:not(.active) .node-dot { border-color: var(--grid); color: var(--muted); box-shadow: none; }
  /* 当天打开：走完的站收成一行，时间轴从「现在」开始 */
  .node-item.is-folded { display: none; }
  .done-fold {
    display: flex; align-items: center; gap: 6px; width: 100%; min-height: 44px; margin: 0 0 16px; padding: 0 14px;
    border: 1px dashed var(--grid); border-radius: 12px; background: none; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 700; text-align: left; cursor: pointer;
    transition: background-color .15s var(--ease);
  }
  .done-fold:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  @media (hover: hover) { .done-fold:hover { background: var(--ai-soft); } }
  .node-item.active .node-dot {
    background: var(--ai);
    border-color: var(--ai);
    color: var(--on-ai);
    transform: scale(1.15);
  }

  .node-card {
    background: var(--card-bg);
    border: 1px solid var(--grid);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: scale .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .node-item.active .node-card {
    border-color: var(--ai);
    box-shadow: 0 4px 18px color-mix(in srgb, var(--ai) 15%, transparent);
  }
  /* 现在这一站：靛蓝框，和手册的「现在」卡一样 */
  .node-item.is-now .node-card {
    border-color: var(--ai);
    box-shadow: 0 0 0 1px var(--ai), var(--shadow);
  }
  .node-card:active {
    scale: .99;
  }

  .node-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 4px;
  }
  .time-badge {
    font-size: 12px;
    font-weight: 800;
    color: var(--ai);
    background: var(--ai-soft);
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: .02em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-variant-numeric: tabular-nums;
  }
  .ph { width: 1.2em; height: 1.2em; flex: none; }
  .nav-btn .ph { width: 1.25em; height: 1.25em; }
  a.tel { display: inline-flex; align-items: center; gap: 3px; color: var(--ai); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
  a.tel .ph { width: 1.1em; height: 1.1em; }
  .node-when {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    min-width: 0;
  }
  .node-tag {
    font-size: 12px;
    font-weight: 700;
    color: var(--ai);
    line-height: 1.4;
  }
  .node-item.hero .time-badge {
    color: var(--shu);
    background: var(--shu-soft);
  }

  .nav-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--on-ai);
    background: var(--ai);
    text-decoration: none;
    padding: 4px 9px;
    border-radius: 99px;
    flex-shrink: 0;
    transition: background-color .15s var(--ease), opacity .15s var(--ease), scale .1s var(--ease);
  }
  .nav-btn:active { scale: .96; }
  .view-btn::after, .theme-btn::after, .route-toggle-btn::after, .map-link-btn::after {
    content: ""; position: absolute; inset: 50% auto auto 50%;
    width: 44px; height: 44px; transform: translate(-50%, -50%);
  }
  /* 导航钮在可点的站点卡片里：只往上、左右扩，不压住下方站名（误触会跳出到 Google Maps）。
     往上 20px 凑满 44px 高：会伸出卡片顶 7px，落在两张卡片之间的空隙里 */
  .nav-btn::after { content: ""; position: absolute; inset: -20px -6px 0; }
  @media (hover: hover) { .nav-btn:hover { opacity: .9; } }
  .node-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 4px;
    text-wrap: balance;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .node-name-sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 6px;
    text-wrap: pretty;
    font-variant-numeric: tabular-nums;
  }
  /* 一站 = 站名 + 几条要点（永远看得到，一条一行）+ 收起的详情 */
  .node-key,
  .node-more ul {
    list-style: none;
    margin: 0 0 2px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    text-wrap: pretty;
    overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
  }
  .node-key li,
  .node-more li {
    position: relative;
    padding-left: 14px;
  }
  .node-key li::before,
  .node-more li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: .68em;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
  }
  /* 注意事项：墨色粗体 + 金色荧光笔底线，和手册一致。红色只留给「今天」和「必看」 */
  .node-key li.kw { color: var(--ink); font-weight: 700; }
  .node-key li.kw::before { background: var(--kin); }
  .node-key li.kw > span {
    background: linear-gradient(transparent 58%, color-mix(in srgb, var(--kin) 26%, transparent) 0);
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  /* summary 保持 44px 触控高度，但吃掉一部分卡片内边距，免得底部空一大块 */
  .node-more { margin: -4px 0 -10px; }
  .node-more > summary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    cursor: pointer;
    list-style: none;
    font-size: 12px;
    font-weight: 700;
    color: var(--ai);
    -webkit-tap-highlight-color: transparent;
  }
  .node-more > summary::-webkit-details-marker { display: none; }
  .node-more > summary::after {
    content: "";
    width: .45em; height: .45em;
    border-right: 2px solid; border-bottom: 2px solid;
    rotate: 45deg; translate: 0 -.15em;
    transition: rotate .15s var(--ease), translate .15s var(--ease);
  }
  .node-more[open] > summary::after { rotate: 225deg; translate: 0 .15em; }
  .node-more > summary:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; border-radius: 4px; }
  .node-more ul { gap: 6px; margin-bottom: 8px; }
  .node-more strong { font-weight: 700; }

  /* ── 小动效：用 Phosphor 同一图标的不同字重表达状态，形状不变只换墨量 ──
     电脑（能悬停）：悬停一站，交通图标浮出 Duotone 底色；导航箭头往右上探一下；日落图标的太阳先沉下去给你看。
     手机（点按）：按住时同样浮出底色；「现在」那一站的圆点慢慢呼吸；换天时太阳从高处落到此刻的位置。
     全部只在 html[data-motion="ready"]（首屏画完）之后才开；状态本身都另有文字或颜色，不只靠动效。 */
  .ph-tone { opacity: 0; }
  /* 分类图标：餐食、咖啡用金色，饿的时候一眼找到；其余跟时间胶囊同色 */
  .time-badge .cat-meal, .time-badge .cat-cafe { color: var(--kin); }
  html[data-motion="ready"] .ph-tone { transition: opacity .15s var(--ease); }
  html[data-motion="ready"] .nav-btn .ph { transition: translate .2s cubic-bezier(.2,0,0,1); }
  .node-card:active .time-badge .ph-tone, .nav-btn:active .ph-tone { opacity: .25; }
  @media (hover: hover) {
    .node-card:hover .time-badge .ph-tone { opacity: .25; }
    .nav-btn:hover .ph-tone { opacity: .3; }
    .nav-btn:hover .ph { translate: 1.5px -1.5px; }
  }

  /* 「现在」：当天、时间落在这一站里。圆点外一圈慢呼吸，旁边写「现在」 */
  .node-item.is-now .time-badge .ph-tone { opacity: .25; }
  .node-item.is-now .node-dot::before {
    content: ""; position: absolute; inset: -2px; border-radius: 50%;
    border: 2px solid var(--ai); opacity: .4; pointer-events: none;
  }
  html[data-motion="ready"] .node-item.is-now .node-dot::before { animation: now-breathe 2.8s cubic-bezier(.2,0,0,1) infinite; }
  @keyframes now-breathe { 0% { opacity: .55; scale: 1; } 70%, 100% { opacity: 0; scale: 1.9; } }
  .now-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 800; color: var(--ai); letter-spacing: .02em;
  }
  .now-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  html[data-motion="ready"] .now-tag { animation: now-in .25s cubic-bezier(.2,0,0,1); }
  @keyframes now-in { from { opacity: 0; translate: 0 4px; } }

  /* 线香：现在这一站的上边框是一炷香，从这一站开始烧到下一站开始（或写明的结束钟点）。
     烧过的一段成灰（虚线），香头是朱色的火点，冒一缕烟；还剩多久写在「现在」旁边，不只靠这条线。
     封面路线条上，现在这一站到下一站的那段连线也一样烧。 */
  .node-item.is-now .node-card { position: relative; }
  .incense { --burn: 0; position: absolute; top: -2px; left: 14px; right: 14px; height: 2px; pointer-events: none; }
  .incense::before {
    content: ""; position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--burn) * 100%) 0 0);
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--muted) 50%, transparent) 0 2px, transparent 2px 5px) var(--card-bg);
  }
  .incense-tip { position: absolute; inset: 0; translate: calc(var(--burn) * 100%) 0; }
  .incense i, .rs-stop.is-next::after {
    position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--shu);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--shu) 22%, transparent), 0 0 8px 1px color-mix(in srgb, var(--shu) 45%, transparent);
  }
  .incense i { top: 1px; left: 0; }
  .incense svg {
    position: absolute; bottom: 4px; left: 0; width: 10px; height: 13px; margin-left: -4px; overflow: visible;
    fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; opacity: .6;
    -webkit-mask-image: linear-gradient(to top, #000 25%, transparent); mask-image: linear-gradient(to top, #000 25%, transparent);
  }
  /* 路线条：两个圆之间露出来的连线是 17px 到 43px 这 26px */
  .rs-stop.is-next { --burn: 0; }
  .rs-stop.is-next::before { background: linear-gradient(90deg, color-mix(in srgb, var(--ai) 45%, transparent) calc(17px + var(--burn) * 26px), var(--grid) 0); }
  .rs-stop.is-next::after { content: ""; top: 17px; left: -13px; translate: calc(var(--burn) * 26px) 0; z-index: 1; }
  html[data-motion="ready"] .incense::before { transition: clip-path 1s cubic-bezier(.2,0,0,1); }
  html[data-motion="ready"] .incense-tip, html[data-motion="ready"] .rs-stop.is-next::after { transition: translate 1s cubic-bezier(.2,0,0,1); }

  /* 日落／日出：--sun-y 是太阳相对地平线的高度（负 = 在上面），--sun-w 是暖度（0 金 → 1 朱） */
  .sun-chip {
    --sun-y: 0; --sun-w: 0;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: color-mix(in srgb, var(--shu) calc(var(--sun-w) * 100%), var(--kin));
  }
  .sun-ico { width: 1.35em; height: 1.35em; flex: none; overflow: visible; }
  .sun-ico path, .sun-ico circle { fill: none; stroke: currentColor; stroke-width: 16; stroke-linecap: round; }
  .sun-ico .sun-tone { fill: currentColor; fill-opacity: .2; stroke: none; }
  .sun-disc { translate: 0 calc(var(--sun-y) * 1px); }
  .sun-rays { opacity: clamp(0, calc(1 - var(--sun-y) / 24), 1); }
  html[data-motion="ready"] .sun-disc { transition: translate 1.2s cubic-bezier(.2,0,0,1); }
  html[data-motion="ready"] .sun-rays { transition: opacity .6s var(--ease); }
  html[data-motion="ready"] .sun-chip { transition: color 1.2s var(--ease); }
  /* 电脑悬停：太阳先沉下去让你预览「落日」，移开再升回来 */
  @media (hover: hover) {
    .node-card:hover .sun-chip[data-kind="set"] .sun-disc { translate: 0 calc((var(--sun-y) + 30) * 1px); }
    .node-card:hover .sun-chip[data-kind="set"] .sun-rays { opacity: 0; }
    .node-card:hover .sun-chip[data-kind="rise"] .sun-disc { translate: 0 calc((var(--sun-y) - 30) * 1px); }
  }

  /* ══ 攻略：把 10 天当成一本 10 章的攻略本 ══
     目录（章节选择）→ 每章封面（题签＋简报＋路线条）→ 逐站卡片（分支、彩蛋、歇脚）→ 章末（下一章）。
     颜色照旧：靛蓝＝能点、主色；红＝今天、必看；金＝限时、警示；抹茶绿＝歇脚（让妈妈坐下来的地方）。 */
  .day-row { display: flex; align-items: center; max-width: 900px; margin: 0 auto; }
  .day-row .day-scroll {
    flex: 1; min-width: 0; margin: 0; padding-left: 8px;
  }
  .toc-btn {
    position: relative; flex: none; display: inline-flex; align-items: center; gap: 4px;
    margin: 6px 0 10px 12px; padding: 6px 10px; border: 1px solid var(--grid); border-radius: 99px;
    background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), scale .1s var(--ease);
  }
  .toc-btn .ph { width: 1.25em; height: 1.25em; }
  .toc-btn::after { content: ""; position: absolute; inset: -7px -4px -9px; }
  .toc-btn:active { scale: .96; }
  .toc-btn[aria-pressed="true"] { background: var(--ai); color: var(--on-ai); border-color: var(--ai); }
  .toc-btn:focus-visible, .day-pill:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .dp-no { font-family: var(--serif); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* 今天那一章：胶囊右上一个红点（红色只给「今天」） */
  .dp-today { width: 6px; height: 6px; border-radius: 50%; background: var(--shu); margin-left: 1px; }
  .day-pill.active .dp-today { background: var(--on-ai); }

  /* ── 目录 ── */
  .toc[hidden] { display: none; }
  .toc-cover {
    background: var(--card-bg); border: 1px solid var(--grid); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px;
  }
  .toc-cover-art { height: min(200px, calc((100vw - 30px) * .325)); background: var(--chip-bg); }
  .toc-cover-art img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
  html[data-theme="dark"] .toc-cover-art img, html[data-theme="dark"] .toc-art img, html[data-theme="dark"] .ch-next-art img { filter: brightness(.8) saturate(.9); }
  .toc-cover-body { padding: 14px 16px 16px; }
  .toc-kicker { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  .toc-title { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.25; letter-spacing: .02em; margin: 4px 0 12px; text-wrap: balance; }
  /* 十格进度：走过的章淡靛蓝，今天红，没到的灰 */
  .toc-rail { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-bottom: 12px; }
  .toc-rail i { height: 6px; border-radius: 3px; background: var(--grid); }
  .toc-rail i.past { background: color-mix(in srgb, var(--ai) 45%, transparent); }
  .toc-rail i.today { background: var(--shu); }
  .toc-go {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 48px;
    padding: 8px 14px; border: 0; border-radius: 12px; background: var(--ai); color: var(--on-ai);
    font: inherit; font-size: 14px; font-weight: 800; text-align: left; cursor: pointer; transition: scale .1s var(--ease);
  }
  .toc-go:active { scale: .98; }
  .toc-go .ph { width: 1.2em; height: 1.2em; }
  .toc-go small { display: block; font-size: 12px; font-weight: 700; opacity: .85; font-variant-numeric: tabular-nums; }
  .toc-pro:focus-visible, .toc-go:focus-visible, .toc-ch:focus-visible, .ch-next:focus-visible, .ch-nav button:focus-visible, .rs-btn:focus-visible, .brief-go:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .toc-pro {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; margin: 0 0 10px; padding: 10px 14px;
    border: 1px dashed var(--grid); border-radius: 14px; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; text-decoration: none;
    transition: background-color .15s var(--ease);
  }
  @media (hover: hover) { .toc-pro:hover { background: var(--ai-soft); } }
  .toc-pro .ph { width: 1.3em; height: 1.3em; color: var(--ai); flex: none; }
  .toc-pro b { display: block; font-family: var(--serif); font-size: 15px; }
  .toc-pro span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .toc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .toc-ch {
    display: grid; grid-template-columns: 108px 1fr; width: 100%; padding: 0;
    border: 1px solid var(--grid); border-radius: 14px; background: var(--card-bg); box-shadow: var(--shadow);
    overflow: hidden; color: inherit; font: inherit; text-align: left; cursor: pointer;
    transition: scale .15s var(--ease), border-color .15s var(--ease);
  }
  .toc-ch:active { scale: .99; }
  .toc-art { position: relative; min-height: 104px; background: var(--chip-bg); }
  .toc-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 72% bottom; }
  /* 走过的章：画褪一点色，像读过的书页；文字照样清楚 */
  .toc-ch.is-past .toc-art img { filter: grayscale(.7) opacity(.75); }
  .toc-num {
    position: absolute; top: 6px; left: 6px; min-width: 26px; padding: 3px 5px; border-radius: 4px;
    background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 15px; font-weight: 700; line-height: 1.2; text-align: center;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 30%, transparent);
  }
  .toc-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 10px 12px 11px; }
  .toc-no { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toc-today { padding: 0 6px; border-radius: 99px; background: var(--shu-soft); color: var(--shu-ink); font-size: 11px; font-weight: 800; line-height: 1.6; }
  .toc-name { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.3; }
  .toc-route {
    font-size: 12.5px; line-height: 1.5; color: var(--muted); word-break: keep-all; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .toc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toc-dl { color: var(--kin); }
  .toc-ch.is-today { border-color: var(--shu); box-shadow: 0 0 0 1px var(--shu), var(--shadow); }

  /* ── 章节封面：插画左上角贴一张「题签」，像线装书封面 ── */
  .hero-illo { position: relative; }
  .slip {
    position: absolute; top: 8px; left: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 4px 7px; min-width: 30px;
    background: var(--paper); color: var(--ink);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 55%, transparent), inset 0 0 0 2px var(--paper), inset 0 0 0 3px color-mix(in srgb, var(--ink) 22%, transparent), 0 2px 6px rgba(0, 0, 0, .12);
    font-family: var(--serif); font-weight: 700; line-height: 1;
  }
  .slip b { font-size: 18px; }
  .slip span { writing-mode: vertical-rl; font-size: 12px; letter-spacing: .1em; color: var(--muted); padding-top: 3px; border-top: 1px solid var(--grid); }
  .ch-line { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }

  /* ── 本章简报：出发前、当天第一站开始前是展开的；走起来以后收成一行 ── */
  .brief { margin: 8px 0 0; border-top: 1px solid var(--grid); }
  .brief > summary {
    display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; list-style: none;
    font-size: 13px; font-weight: 800; color: var(--ink);
  }
  .brief > summary::-webkit-details-marker { display: none; }
  .brief > summary::after, .rain-card > summary::after {
    content: ""; flex: none; width: 6px; height: 6px; margin-left: auto; border: solid var(--muted); border-width: 0 1.5px 1.5px 0;
    rotate: 45deg; translate: 0 -.15em; transition: rotate .2s var(--ease), translate .2s var(--ease);
  }
  .brief[open] > summary::after, .rain-card[open] > summary::after { rotate: 225deg; translate: 0 .15em; }
  .brief > summary:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; border-radius: 4px; }
  .brief-peek { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .brief-list { display: grid; grid-template-columns: auto 1fr; gap: 9px 12px; margin: 0 0 12px; font-size: 14px; line-height: 1.55; }
  .brief-list dt { padding-top: 1px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
  .brief-list dd { margin: 0; min-width: 0; text-wrap: pretty; font-variant-numeric: tabular-nums; }
  .bl-row { display: contents; }
  .brief-goal { font-weight: 700; }
  .stamina { display: inline-flex; gap: 2px; margin-right: 6px; vertical-align: -1px; }
  .stamina i { width: 10px; height: 10px; border-radius: 2px; background: var(--grid); }
  .stamina i.on { background: var(--ai); }
  .gear { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .gear li { padding: 2px 9px; border-radius: 8px; background: var(--chip-bg); font-size: 13px; line-height: 1.6; }
  .brief-links { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .brief-go {
    position: relative; display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 9px;
    border: 0; border-radius: 99px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    background: var(--ai-soft); color: var(--ai); transition: scale .1s var(--ease);
  }
  .brief-go::after { content: ""; position: absolute; inset: -8px 0; }
  .brief-go:active { scale: .96; }
  .brief-go .ph { width: 1.1em; height: 1.1em; }
  .brief-go.rest { background: var(--matcha-soft); color: var(--matcha); }
  .brief-go small { font-size: 12px; font-weight: 700; }

  /* ── 路线条：整章一眼看完，走过的一段变靛蓝，点一站跳过去 ── */
  .route-strip {
    margin: 2px -16px 0; padding: 2px 16px 4px; overflow-x: auto; scrollbar-width: none;
  }
  /* 横滑的两排（章节胶囊、路线条）：还有内容的那一边才淡出；滑到头那一边不淡，也不会露出半个字 */
  .day-row .day-scroll, .route-strip {
    --fade-l: 28px; --fade-r: 28px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent);
    mask-image: linear-gradient(90deg, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent);
  }
  .day-row .day-scroll[data-edge~="start"], .route-strip[data-edge~="start"] { --fade-l: 0px; }
  .day-row .day-scroll[data-edge~="end"], .route-strip[data-edge~="end"] { --fade-r: 0px; }
  .route-strip::-webkit-scrollbar { display: none; }
  .route-strip ol { display: flex; width: max-content; list-style: none; margin: 0; padding: 0; }
  .rs-stop { position: relative; flex: none; width: 60px; }
  .rs-stop + .rs-stop::before { content: ""; position: absolute; top: 16px; left: -30px; width: 60px; height: 2px; background: var(--grid); }
  .rs-stop.is-past + .rs-stop::before { background: color-mix(in srgb, var(--ai) 45%, transparent); }
  .rs-btn {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; padding: 0 0 2px;
    border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer;
  }
  .rs-ico {
    position: relative; z-index: 1; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--card-bg); color: var(--ai); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ai) 30%, transparent);
    transition: scale .1s var(--ease), background-color .2s var(--ease), color .2s var(--ease);
  }
  .rs-btn:active .rs-ico { scale: .92; }
  .rs-ico svg { width: 17px; height: 17px; }
  .rs-stop.hero .rs-ico { color: var(--shu); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--shu) 35%, transparent); }
  .rs-stop.is-past .rs-ico { background: var(--chip-bg); color: var(--muted); box-shadow: none; }
  .rs-stop.is-now .rs-ico { background: var(--ai); color: var(--on-ai); box-shadow: 0 0 0 3px var(--ai-soft); }
  .rs-stop.rest .rs-ico::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--matcha); box-shadow: 0 0 0 2px var(--card-bg); }
  .rs-name { max-width: 58px; font-size: 11.5px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs-time { font-size: 11px; line-height: 1.2; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rs-stop.is-now .rs-name { color: var(--ai); }

  /* ── 逐站卡片：歇脚、分支、彩蛋 ── */
  .rest-chip { display: inline-flex; align-items: center; gap: 3px; padding: 0 7px; border-radius: 99px; background: var(--matcha-soft); color: var(--matcha); font-size: 12px; font-weight: 800; line-height: 1.6; }
  .rest-chip .ph { width: 1.15em; height: 1.15em; }
  .branch { margin: 8px 0 4px; padding: 8px 10px 9px; border-radius: 10px; background: var(--chip-bg); }
  .branch + .branch { margin-top: 6px; }
  .br-q { display: flex; align-items: center; gap: 5px; margin: 0 0 5px; font-size: 12.5px; font-weight: 800; color: var(--ink); }
  .br-q .ph { width: 1.2em; height: 1.2em; color: var(--ai); }
  .branch ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .branch li { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 8px; font-size: 13.5px; line-height: 1.55; text-wrap: pretty; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .br-if { padding: 0 7px; border-radius: 6px; background: var(--card-bg); color: var(--ai); font-size: 12px; font-weight: 800; line-height: 1.7; white-space: nowrap; }
  .egg { display: flex; gap: 6px; margin: 6px 0 2px; font-size: 13.5px; line-height: 1.55; text-wrap: pretty; }
  .egg .ph { flex: none; width: 1.1em; height: 1.1em; margin-top: .22em; color: var(--ai); }
  .egg b { font-weight: 800; }

  /* ── 点餐卡：卡片里的按钮 + 从底部升起的对话框，日文放大给店员看 ── */
  .card-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .card-btn {
    position: relative; display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 11px;
    border: 1px solid color-mix(in srgb, var(--ai) 35%, transparent); border-radius: 99px; background: var(--card-bg);
    color: var(--ai); font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer;
    transition: scale .1s var(--ease), background-color .15s var(--ease);
  }
  .card-btn::after { content: ""; position: absolute; inset: -6px -2px; }
  .card-btn:active { scale: .96; }
  .card-btn:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  @media (hover: hover) { .card-btn:hover { background: var(--ai-soft); } }
  .card-btn .ph { width: 1.2em; height: 1.2em; }
  dialog.oc {
    width: min(100%, 560px); max-width: 100%; max-height: 88dvh; margin: auto auto 0; padding: 0;
    border: 0; border-radius: 20px 20px 0 0; background: var(--card-bg); color: var(--ink);
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .2); overflow: auto; overscroll-behavior: contain;
  }
  dialog.oc::backdrop { background: rgba(20, 18, 15, .45); }
  html[data-motion="ready"] dialog.oc[open] { animation: oc-up .26s cubic-bezier(.2, 0, 0, 1); }
  @keyframes oc-up { from { translate: 0 24px; opacity: 0; } }
  .oc-head {
    position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px;
    padding: 10px 8px 8px 16px; background: var(--card-bg); border-bottom: 1px solid var(--grid);
  }
  .oc-head h2 { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 800; line-height: 1.4; text-wrap: balance; }
  .oc-x { display: grid; place-items: center; flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; }
  .oc-x .ph { width: 1.3em; height: 1.3em; }
  .oc-x:focus-visible, .oc-ph:focus-visible, .oc-dish:focus-visible, .oc-back:focus-visible, .oc-step button:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  /* 日文按词组换行，不会把「します」拆开（Chrome；Safari 照常） */
  dialog.oc [lang="ja"] { word-break: auto-phrase; text-wrap: pretty; }
  /* 注音：汉字上面一行小假名，给你念出来用；颜色淡一点，店员看的还是大字 */
  dialog.oc ruby { ruby-align: center; } /* 假名比汉字宽时，汉字挨在一起居中，不被拉开成「会 計」 */
  dialog.oc rt { font-size: max(10px, .5em); font-weight: 600; color: var(--muted); letter-spacing: 0; }
  dialog.oc em rt { color: inherit; }
  .oc-body { padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
  .oc-label { margin: 6px 0 0; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
  .oc-dish {
    display: block; width: 100%; padding: 12px 14px; border: 0; border-radius: 12px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--grid);
    color: var(--ink); font: inherit; text-align: left; cursor: pointer; transition: scale .1s var(--ease);
  }
  .oc-dish:active { scale: .98; }
  .oc-jp { display: block; font-size: 20px; font-weight: 700; line-height: 1.85; color: var(--ink); }
  .oc-zh { display: block; margin-top: 4px; font-size: 13.5px; line-height: 1.55; color: var(--muted); text-wrap: pretty; }
  .oc-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .oc-price { flex: none; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .oc-phrases { display: grid; gap: 8px; }
  /* 一行 = 句子（点了放大）＋ 右边一颗喇叭（点了念出来） */
  .oc-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .oc-say {
    display: grid; place-items: center; width: 44px; min-height: 44px; border: 0; border-radius: 12px;
    background: var(--ai-soft); color: var(--ai); font: inherit; cursor: pointer; transition: scale .1s var(--ease);
  }
  .oc-say .ph { width: 1.3em; height: 1.3em; }
  .oc-say:active { scale: .96; }
  .oc-say:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .oc-say.is-big { display: inline-flex; gap: 6px; width: auto; padding: 0 16px; border-radius: 99px; font-size: 13px; font-weight: 800; }
  /* 店员会问的：下面一行「回」＝怎么回答 */
  .oc-ph > .oc-re { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; color: var(--ink); font-size: 13.5px; font-weight: 700; line-height: 1.9; }
  .oc-re i { flex: none; padding: 0 6px; border-radius: 6px; background: var(--card-bg); color: var(--ai); font-style: normal; font-size: 11.5px; font-weight: 800; line-height: 1.7; }
  .oc-hint { margin: 2px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); text-wrap: pretty; }
  .oc-ph {
    display: block; width: 100%; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--chip-bg);
    color: var(--ink); font: inherit; text-align: left; cursor: pointer; transition: scale .1s var(--ease);
  }
  .oc-ph:active { scale: .98; }
  .oc-ph b { display: block; font-size: 16px; font-weight: 700; line-height: 1.9; }
  .oc-ph > span { display: block; font-size: 12.5px; color: var(--muted); }
  /* 放大：一句话占满整个对话框，手机横过来给店员看也清楚；点一下回去 */
  .oc-big {
    display: none; min-height: 60dvh; width: 100%; padding: 24px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--card-bg); color: var(--ink); text-align: center; cursor: pointer;
  }
  dialog.oc.is-big .oc-body { display: none; }
  dialog.oc.is-big .oc-big { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .oc-big b { font-size: clamp(26px, 8vw, 40px); font-weight: 800; line-height: 1.75; text-wrap: balance; }
  .oc-big em { font-style: normal; color: var(--ai); white-space: nowrap; }
  .oc-big-zh { font-size: 14px; line-height: 1.55; color: var(--muted); text-wrap: pretty; }
  /* 份数：两个大圆钮夹着数字，拇指按得到 */
  .oc-step { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 4px; border-radius: 99px; background: var(--chip-bg); cursor: default; }
  .oc-step button {
    display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: var(--card-bg); color: var(--ai); font: inherit; font-size: 22px; font-weight: 700; line-height: 1; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08); transition: scale .1s var(--ease), opacity .15s var(--ease);
  }
  .oc-step button:active { scale: .96; }
  .oc-step button:disabled { opacity: .35; cursor: default; box-shadow: none; }
  .oc-step output { min-width: 2.2ch; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .oc-back { min-height: 44px; padding: 0 16px; border: 0; border-radius: 99px; background: none; color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }

  /* ── 雨天攻略（整章的下雨方案，章末一张卡） ── */
  .rain-card { margin: 4px 0 16px; background: var(--card-bg); border: 1px solid var(--grid); border-radius: 14px; box-shadow: var(--shadow); padding: 0 14px; }
  .rain-card[hidden] { display: none; }
  .rain-card > summary { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 12px 0; list-style: none; cursor: pointer; }
  .rain-card > summary::-webkit-details-marker { display: none; }
  .rain-card > summary .ph { width: 1.3em; height: 1.3em; color: var(--ai); flex: none; }
  .rain-card > summary > span { flex: 1; min-width: 0; }
  .rain-card > summary::after { margin-right: 4px; }
  .rain-card > summary b { font-size: 15px; font-weight: 800; }
  .rain-card > summary span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .rain-card > summary:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; border-radius: 8px; }
  .rain-body { padding: 0 0 12px; }
  .rain-body h3 { margin: 10px 0 4px; font-size: 13.5px; font-weight: 800; color: var(--ink); }
  .rain-body ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.6; text-wrap: pretty; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .rain-body li { position: relative; padding-left: 14px; }
  .rain-body li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }

  /* ── 章末：第 N 章 · 完，接下一章 ── */
  .ch-end { margin: 8px 0 8px; }
  .ch-end-mark { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: .12em; }
  .ch-end-mark::before, .ch-end-mark::after { content: ""; flex: 1; height: 1px; background: var(--grid); }
  .ch-end-sum { margin: 0 0 12px; text-align: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ch-next {
    display: grid; grid-template-columns: 96px 1fr auto; align-items: center; width: 100%; padding: 0 12px 0 0;
    border: 1px solid var(--grid); border-radius: 14px; background: var(--card-bg); box-shadow: var(--shadow);
    overflow: hidden; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: scale .15s var(--ease);
  }
  .ch-next:active { scale: .99; }
  .ch-next-art { align-self: stretch; min-height: 84px; position: relative; background: var(--chip-bg); }
  .ch-next-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 72% bottom; }
  .ch-next-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 10px 8px 10px 12px; }
  .ch-next-k { font-size: 12px; font-weight: 700; color: var(--ai); font-variant-numeric: tabular-nums; }
  .ch-next-n { font-family: var(--serif); font-size: 16px; font-weight: 700; }
  .ch-next-t { font-size: 12.5px; color: var(--muted); line-height: 1.45; font-variant-numeric: tabular-nums; word-break: keep-all; overflow-wrap: anywhere; }
  .ch-next > .ph { width: 1.2em; height: 1.2em; color: var(--muted); }
  .ch-fin { padding: 14px 16px; border-radius: 14px; background: var(--ai-soft); text-align: center; font-family: var(--serif); font-size: 16px; font-weight: 700; }
  .ch-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .ch-nav button {
    display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 99px;
    background: none; color: var(--ai); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: background-color .15s var(--ease);
  }
  .ch-nav button .ph { width: 1.1em; height: 1.1em; }
  @media (hover: hover) { .ch-nav button:hover { background: var(--ai-soft); } }
  .ch-nav button[hidden] { visibility: hidden; display: inline-flex; }

  /* 目录和地图视图不显示章末、雨天卡；看目录时胶囊不标选中 */
  body[data-view="toc"] #chEnd, body[data-view="toc"] #rainCard, body[data-view="map"] #chEnd, body[data-view="map"] #rainCard { display: none; }
  body[data-view="toc"] .day-pill.active { background: var(--paper); color: var(--muted); border-color: var(--grid); box-shadow: none; }
  body[data-view="toc"] .day-pill.active .dp-today { background: var(--shu); }

  /* 换章：封面和路线轻轻浮上来（只在首屏之后、你点了换章才播） */
  html[data-motion="ready"] .ch-enter { animation: ch-in .24s cubic-bezier(.2, 0, 0, 1) both; }
  html[data-motion="ready"] .ch-enter + .ch-enter { animation-delay: .04s; }
  @keyframes ch-in { from { opacity: 0; translate: 0 6px; } }

  /* 减少动态：与手册 index.html 同一条规则，过渡与动画一律瞬间完成 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .node-item.active .node-dot { transform: none; }
    /* 「现在」不呼吸，改成一圈静止的淡环 */
    html[data-motion="ready"] .node-item.is-now .node-dot::before { animation: none; opacity: .35; scale: 1.4; }
    .nav-btn:hover .ph { translate: none; }
    .node-card:hover .sun-chip .sun-disc { translate: 0 calc(var(--sun-y) * 1px); }
    .node-card:hover .sun-chip .sun-rays { opacity: clamp(0, calc(1 - var(--sun-y) / 24), 1); }
  }

  /* Google 地图弹窗：深色下跟卡片同色，否则白底上看不见浅色字 */
  html[data-theme="dark"] .gm-style .gm-style-iw-c,
  html[data-theme="dark"] .gm-style .gm-style-iw-d { background: var(--card-bg); color: var(--ink); }
  html[data-theme="dark"] .gm-style .gm-style-iw-tc::after { background: var(--card-bg); }
  html[data-theme="dark"] .gm-style .gm-ui-hover-effect > span { background-color: var(--muted) !important; }
</style>
</head>
<body data-tabbar="always" data-tab="map">

<!-- ── Sticky Top Bar ── -->
<header class="top-bar">
  <div class="bar-main">

// Route Mode: true = Real Road Curves (贴合真实道路), false = Clean Straight Lines
let showRealRoadRoute = true;
const routeCache = {};

function toggleRouteMode() {
  showRealRoadRoute = !showRealRoadRoute;
  const btn = document.getElementById('btnRouteToggle');
  if (btn) {
    btn.classList.toggle('active', showRealRoadRoute);
    btn.setAttribute('aria-pressed', String(showRealRoadRoute)); // 关掉＝直线连站
  }
  const day = DAYS[currentDayIdx];
  renderRoutePolyline(day);
}

// Compact Polyline Decoder
function decodePolyline(encoded) {
  const points = [];
  let index = 0, len = encoded.length;
  let lat = 0, lng = 0;
  while (index < len) {
    let b, shift = 0, result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lat += dlat;
    shift = 0;
    result = 0;
    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);
    const dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
    lng += dlng;
    points.push([lat * 1e-5, lng * 1e-5]);
  }
  return points;
}

function drawRealCurvedRoute(coords, color, isDrive) {
  // Glow casing line
  const casing = makePolyline(coords, {
    color: color,
    weight: isDrive ? 8 : 6,
    opacity: 0.22,
    lineCap: 'round',
    lineJoin: 'round'
  });
  // Core crisp line
  const core = makePolyline(coords, {
    color: color,
    weight: isDrive ? 4 : 3,
    opacity: 0.9,
    lineCap: 'round',
    lineJoin: 'round'
  });
  polylineLayer.addLayer(casing);
  polylineLayer.addLayer(core);
}

async function renderRoutePolyline(day) {
  if (!polylineLayer) return;
  polylineLayer.clearLayers();
  
  const latlngs = day.nodes.map(n => [n.lat, n.lng]);
  if (latlngs.length < 2) {
    return;
  }

  const isDrive = (day.day === 'D4' || day.day === 'D5');
  const isNature = isDrive;
  const themeColor = isNature ? cssVar('--matcha') : (isDrive ? cssVar('--ai') : cssVar('--shu'));

  if (!showRealRoadRoute) {
    // Straight line mode
    const straightLine = makePolyline(latlngs, {
      color: themeColor,
      weight: 3.5,
      opacity: 0.65,
      dashArray: '5, 8'
    });
    polylineLayer.addLayer(straightLine);
    return;
  }

  // Real Road Mode:
  // 1. Check prebaked cache first (0ms instant)
  if (PREBAKED_ROUTES[day.day]) {
    const data = PREBAKED_ROUTES[day.day];
    const coords = decodePolyline(data.encoded);
    drawRealCurvedRoute(coords, themeColor, isDrive);
    return;
  }

  // 2. Check dynamic memory cache
  if (routeCache[day.day]) {
    const data = routeCache[day.day];
    drawRealCurvedRoute(data.coords, themeColor, isDrive);
    return;
  }

  // 3. Fallback transit/straight line immediately
  const tempLine = makePolyline(latlngs, {
    color: themeColor,
    weight: 3.5,
    opacity: 0.65,
    dashArray: day.day === 'D10' ? '8, 12' : '5, 8'
  });
  polylineLayer.addLayer(tempLine);

  // For D1 (Skyliner) and D10 (Flights), transit line is optimal
  if (day.day === 'D1' || day.day === 'D10') return;

  // 4. Dynamic query OSRM for any uncached days
  try {
    const profile = isDrive ? 'driving' : 'walking';
    const coordsStr = day.nodes.map(n => `${n.lng.toFixed(5)},${n.lat.toFixed(5)}`).join(';');
    const res = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${coordsStr}?overview=full&geometries=geojson`);
    const json = await res.json();
    if (json.code === 'Ok' && json.routes && json.routes[0]) {
      const r = json.routes[0];
      const realCoords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      // 只画线不报数：预存路线与 OSRM 都按车速算，公里和分钟对步行/电车日都不准
      routeCache[day.day] = { coords: realCoords };

      if (DAYS[currentDayIdx].day === day.day && showRealRoadRoute) {
        polylineLayer.clearLayers();
        drawRealCurvedRoute(realCoords, themeColor, isDrive);
      }
    }
  } catch (e) {
    // Offline or network error - keep straight line
  }
}

// Map & Interaction Engine
// ══════════════════════════════════════════════════════════════════════
let map = null;
let currentDayIdx = 0;
let markersLayer = null;
let polylineLayer = null;
// 手机默认只看行程（地图在底栏「地图」）；宽屏默认地图＋行程并排
let currentViewMode = matchMedia('(min-width: 900px)').matches ? 'split' : 'time'; // 'split', 'time', 'map', 'toc'
let chapterMode = currentViewMode;   // 看某一章时用的视图：手机「行程」，宽屏「分屏」
let lastGuide = 'chapter';           // 去地图之前在看目录还是某一章，点底栏「攻略」回到那里

// 现在几点：网址加 ?now=2026-10-10T16:50 可以假装是那个时刻，出发前预览「现在」和日落倒数
const NOW_OVERRIDE = (() => {
  const m = /[?&]now=([\d\-T:]+)/.exec(location.search);
  return m ? new Date(m[1]) - Date.now() : 0;
})();
function nowDate() { return new Date(Date.now() + NOW_OVERRIDE); }
function nowMins() { const n = nowDate(); return n.getHours() * 60 + n.getMinutes(); }
function hhmm(t) { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }

// 行程当天：没带日期打开（例如底栏「地图」）就停在今天
function isToday(day) {
  const now = nowDate();
  const [m, d] = day.date.split('/').map(Number);
  return now.getFullYear() === 2026 && now.getMonth() + 1 === m && now.getDate() === d;
}
function todayIdx() {
  const i = DAYS.findIndex(isToday);
  return i < 0 ? 0 : i;
}

// ── 攻略：十章 ──
const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
const TRIP_START = new Date(2026, 9, 3), TRIP_END = new Date(2026, 9, 13); // 10/12 那天过完算结束
function tripPhase() { const n = nowDate(); return n < TRIP_START ? 'before' : n >= TRIP_END ? 'after' : 'during'; }
function chNo(i) { return `第${CN[i]}章`; }
function dayDate(d) { return `${d.date} 周${d.weekday}`; }
function isPastDay(day) { const [m, d] = day.date.split('/').map(Number); return nowDate() >= new Date(2026, m - 1, d + 1); }
// 体力条：低 1 格、中低 2、中 3、高 4（和手册的强度同一把尺）
function stamina(intensity) {
  const t = intensity || '';
  const lv = /^高/.test(t) ? 4 : /^中低/.test(t) ? 2 : /^中/.test(t) ? 3 : 1;
  return `<span class="stamina" role="img" aria-label="体力消耗 ${lv}/4">${[1, 2, 3, 4].map(i => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('')}</span>`;
}

function getDayIdxFromHash() {
  const hash = window.location.hash.toLowerCase().replace('#', '');
  if (!hash) return todayIdx();
  const match = hash.match(/\d+/);
  if (match) {
    const num = parseInt(match[0], 10);
    if (num >= 1 && num <= DAYS.length) return num - 1;
  }
  return 0;
}

function initApp() {
  renderDayPills();
  // 底栏「攻略」带 ?view=time、「地图」带 ?view=map
  const v = (/[?&]view=(time|map|split)/.exec(location.search) || [])[1];
  if (v === 'time' || v === 'split') chapterMode = v;
  const hash = location.hash.toLowerCase();
  if (hash === '#toc') { selectDay(todayIdx(), false); showToc(false); }
  else if (/\d/.test(hash)) { selectDay(getDayIdxFromHash(), false); setViewMode(v || chapterMode); }
  else if (v === 'map' || tripPhase() === 'during') { selectDay(todayIdx(), false); setViewMode(v || chapterMode); }
  else { selectDay(0, false); showToc(false); }

  document.addEventListener('click', e => {
    const a = e.target.closest('.tabbar a[data-key="days"], .tabbar a[data-key="map"]');
    if (!a || !a.href.includes('companion.html')) return;
    e.preventDefault();
    if (a.dataset.key === 'map') setViewMode('map');
    // 「攻略」：从地图回来就回到刚才那一页；已经在攻略里再点一次 = 回到起点（旅行中是今天那一章，其他时候是目录）
    else if (currentViewMode === 'map') lastGuide === 'toc' ? showToc(false) : setViewMode(chapterMode);
    else goHome();
    window.scrollTo({ top: 0, behavior: scrollBehavior() });
  });
  // 封面上的「简报」「路线条」、章末「下一章」：点了跳到那一站或那一章
  document.getElementById('dayHero').addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) { focusNode(+go.dataset.go); return; }
    if (e.target.closest('[data-rain]')) openRain();
  });
  // 电脑上用鼠标滚轮也能横着翻路线条和章节胶囊（手机本来就能滑）；翻到头就把滚轮还给整页
  document.addEventListener('wheel', e => {
    const row = e.target.closest('.route-strip, .day-scroll');
    if (!row || e.ctrlKey || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
    const max = row.scrollWidth - row.clientWidth;
    if (max <= 0 || (e.deltaY < 0 ? row.scrollLeft <= 0 : row.scrollLeft >= max - 1)) return;
    e.preventDefault();
    row.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 16 : 1);
  }, { passive: false });
  document.getElementById('chEnd').addEventListener('click', e => {
    const b = e.target.closest('[data-ch], [data-toc]');
    if (!b) return;
    if (b.dataset.toc !== undefined) showToc(true);
    else { openChapter(+b.dataset.ch); window.scrollTo({ top: 0, behavior: 'auto' }); }
  });
  // 首屏画完才开动效：打开页面时不播，之后换天、换站才有过渡
  requestAnimationFrame(() => requestAnimationFrame(() => { document.documentElement.dataset.motion = 'ready'; }));

  // 手机返回键：目录 ↔ 某一章
  const route = () => {
    if (location.hash.toLowerCase() === '#toc') { if (currentViewMode !== 'toc') showToc(false); return; }
    const idx = getDayIdxFromHash();
    if (currentViewMode === 'toc') setViewMode(chapterMode);
    if (idx !== currentDayIdx) selectDay(idx, false);
  };
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', route);
}

function goHome() {
  if (tripPhase() === 'during') openChapter(todayIdx(), false);
  else showToc(false);
}
// 打开某一章：从目录进来记一笔历史，手机返回键能回目录
function openChapter(idx, push = currentViewMode === 'toc') {
  const switching = idx !== currentDayIdx || currentViewMode === 'toc';
  if (currentViewMode === 'toc' || currentViewMode === 'map' && push) setViewMode(chapterMode);
  selectDay(idx, true, push);
  if (switching && document.documentElement.dataset.motion === 'ready') {
    ['dayHero', 'timelineList'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.remove('ch-enter'); void el.offsetWidth; el.classList.add('ch-enter');
    });
  }
}
function showToc(push) {
  renderToc();
  setViewMode('toc');
  if (location.hash !== '#toc') history[push ? 'pushState' : 'replaceState'](null, '', '#toc');
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function openRain() {
  const el = document.getElementById('rainCard');
  if (el.hidden) return;
  el.open = true;
  el.scrollIntoView({ behavior: scrollBehavior(), block: 'start' });
}

// ── 目录：封面 + 十章 ──
function renderToc() {
  const el = document.getElementById('tocView');
  const phase = tripPhase();
  const ti = DAYS.findIndex(isToday);
  const toGo = Math.ceil((TRIP_START - nowDate()) / 86400000);
  const rail = DAYS.map(d => `<i class="${isToday(d) ? 'today' : isPastDay(d) ? 'past' : ''}"></i>`).join('');
  const railLabel = phase === 'during' && ti >= 0 ? `十章走到第 ${ti + 1} 章` : phase === 'after' ? '十章都走完了' : '还没出发';
  let go = '';
  if (phase === 'during' && ti >= 0) {

// Small stand-in for Leaflet's layer group: holds overlays so a day switch can clear them
function makeLayerGroup() {
  const items = [];
  return {
    addLayer(o) { o.setMap(map); items.push(o); },
    clearLayers() { items.forEach(o => o.setMap(null)); items.length = 0; }
  };
}

// latlngs are [lat, lng] pairs; opts use the old Leaflet names (color, weight, opacity, dashArray)
function makePolyline(latlngs, opts) {
  const path = latlngs.map(([lat, lng]) => ({ lat, lng }));
  if (opts.dashArray) {
    const [dash, gap] = opts.dashArray.split(',').map(Number);
    return new google.maps.Polyline({
      path,
      strokeOpacity: 0,
      icons: [{
        icon: { path: 'M 0,-1 0,1', strokeColor: opts.color, strokeOpacity: opts.opacity, scale: opts.weight },
        offset: '0',
        repeat: `${(dash + gap) * 1.5}px`
      }]
    });
  }
  return new google.maps.Polyline({
    path,
    strokeColor: opts.color,
    strokeWeight: opts.weight,
    strokeOpacity: opts.opacity
  });
}
